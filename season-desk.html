<style>
/* Layout: one desk column. Header with the advance button, a tab strip, the working pane, then the save footer. */
:root{
  --bg:#f5f3eb;--surface:#fffefa;--fg:#192d36;--muted:#4d6266;
  --rule:#c4ccc5;--rule-strong:#a7afa7;--rule-soft:#ebe9e0;--rule-table:#d7dace;--control-border:#a5afaa;
  --band:#213e43;--band-fg:#ffffff;--accent:#174b46;--accent-fg:#ffffff;--accent-muted:#526662;
  --link:#163e40;--focus:#db8742;
  --display:Georgia,'Times New Roman',serif;--body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a1c;--surface:#162427;--fg:#e2ebe8;--muted:#9fb3b0;
  --rule:#2b3d40;--rule-strong:#3a5053;--rule-soft:#203033;--rule-table:#2b3d40;--control-border:#405659;
  --band:#24494d;--band-fg:#eef5f3;--accent:#2c776c;--accent-fg:#ffffff;--accent-muted:#34494a;
  --link:#9fd6cc;--focus:#e89a55;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a1c;--surface:#162427;--fg:#e2ebe8;--muted:#9fb3b0;
  --rule:#2b3d40;--rule-strong:#3a5053;--rule-soft:#203033;--rule-table:#2b3d40;--control-border:#405659;
  --band:#24494d;--band-fg:#eef5f3;--accent:#2c776c;--accent-fg:#ffffff;--accent-muted:#34494a;
  --link:#9fd6cc;--focus:#e89a55;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);margin:0;font:16px/1.45 var(--body)}
main{max-width:1240px;margin:0 auto;padding-block:36px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{border-top:6px solid var(--band);border-bottom:1px solid var(--rule-strong);padding:24px 0;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font:700 clamp(2.3rem,6vw,4.8rem)/1 var(--display);letter-spacing:-.05em;margin:8px 0 18px;text-wrap:balance}
header p{margin:0;color:var(--muted)}
nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:18px 0}
select,button{font:inherit;padding:8px 12px;background:var(--surface);color:inherit;border:1px solid var(--control-border);border-radius:5px;margin:0}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.6}
h2{font:700 1.85rem var(--display);margin:22px 0 12px;text-wrap:balance}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,205px),1fr));gap:12px}
article{background:var(--surface);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
h3{background:var(--band);color:var(--band-fg);padding:9px 12px;margin:0;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase}
ul{padding:0;margin:0;list-style:none}
li{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--rule-soft);flex-wrap:wrap}
li:last-child{border:0}
.chip{width:24px;height:24px;border:4px solid;border-radius:50%;flex:none}
small{display:block;color:var(--muted)}
strong{font-size:1.05rem}
#advance{background:var(--accent);color:var(--accent-fg);border:0;font-weight:700;padding:14px 20px}
#advance:disabled{background:var(--accent-muted);opacity:1}
#tabs{justify-content:flex-start;gap:4px;border-bottom:1px solid var(--rule)}
#tabs button{border:0;background:transparent}
#tabs [aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
#app{padding:25px 0}
#app>small{letter-spacing:.11em;font-weight:700}
#app h2{margin:5px 0 14px}
#app p{max-width:75ch}
.controls,footer{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:16px 0;color:var(--muted)}
.games,.tables{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr))}
.tables{grid-template-columns:repeat(auto-fit,minmax(min(100%,365px),1fr))}
.tables>section,.wide{min-width:0;overflow-x:auto}
.tables h3{border-radius:5px 5px 0 0}
.line{display:flex;align-items:center;justify-content:space-between;padding:9px 12px}
.line+.line{border-top:1px solid var(--rule-soft)}
.line strong{font:700 .95rem system-ui,sans-serif;font-variant-numeric:tabular-nums}
.club{border:0;background:transparent;text-align:left;font-weight:600;padding:3px;color:var(--link)}
.club:hover{text-decoration:underline}
.club i{display:inline-block;width:12px;height:12px;border:2px solid;border-radius:50%;margin-right:7px}
table{width:100%;border-collapse:collapse;background:var(--surface);font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--rule-table);padding:7px;text-align:left}
.units{display:flex;flex-wrap:wrap;gap:12px}
.units>div{background:var(--surface);padding:12px 18px;border-top:3px solid var(--accent);min-width:115px}
.units b{display:block;font:700 1.5rem var(--display)}
.units>div{max-width:100%}
.compare{min-width:340px}
@media (max-width:560px){.compare{font-size:.82rem}.compare tbody th{width:5.6rem}.compare th,.compare td{padding:6px 5px}}
.compare thead th{background:var(--band);color:var(--band-fg)}
.compare tbody th{width:8rem;color:var(--muted);font-weight:600;vertical-align:top}
.compare td{vertical-align:top}
.projects{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.project{padding:12px;display:flex;flex-direction:column;gap:6px}
.project p{margin:0}
.project .controls{margin:6px 0 0;gap:8px}
.terms{font-weight:600;font-variant-numeric:tabular-nums}
.ledger td:not(:first-child),.ledger th:not(:first-child){text-align:right;white-space:nowrap}
.ledger .sum th{border-bottom:2px solid var(--rule-strong)}
fieldset.exclude{border:1px solid var(--rule);border-radius:6px;display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 16px;padding:10px 12px;color:var(--muted)}
.clock{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.clock small{letter-spacing:.08em;text-transform:uppercase;font-weight:700}
#jump{display:flex;gap:8px;flex-wrap:wrap}
#jump:empty{display:none}
figure.map{margin:0 0 16px}
#marketMap{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:760/590}
figure.map figcaption{color:var(--muted);font-size:.85rem;max-width:75ch}
.owners td{vertical-align:top}
.calls{min-width:9.5rem}
.calls button{padding:4px 8px;font-size:.85rem;margin:0 4px 4px 0}
.commitments{margin:4px 0 0;padding:0}
.commitments li{padding:6px 0;border-bottom:1px solid var(--rule-soft);display:block}
.commitments li:last-child{border:0}
.negotiation{flex-direction:column;align-items:stretch}
.negotiation .controls{margin:4px 0}
.confirm{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px;margin:12px 0;background:var(--surface);border:1px solid var(--rule-strong);border-radius:6px}
.capsheet td:nth-child(n+2):not(:last-child),.capsheet th:nth-child(n+2):not(:last-child){text-align:right;font-variant-numeric:tabular-nums}
fieldset.exclude label{display:flex;gap:6px;align-items:center;color:var(--fg)}
optgroup{font-style:normal}
footer{border-top:1px solid var(--rule);padding-top:16px;font-size:.85rem}
#status{flex:1 1 260px;min-width:0}
#importPrompt{flex-basis:100%;display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--rule);border-radius:6px;color:var(--fg);font-size:1rem}
#importPrompt[hidden],[hidden]{display:none!important}
button:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
</style>

'use strict';
// ---------------------------------------------------------------------------
// Constants and league data
// ---------------------------------------------------------------------------
const SCHEMA_VERSION=11;      // Bump when the save shape changes, and add a migration below.
const REGULAR_WEEKS=18;
const OT_DRIVES=6;           // Overtime possessions before a game is recorded as a tie.
const EMERGENCY_RATING=45;   // Rating used for an uncovered starting spot.

const league=JSON.parse(document.querySelector('#seed').textContent);
const clubs=league.teams;
const byId=new Map(clubs.map(t=>[t.id,t]));
const byAbbr=new Map(clubs.map(t=>[t.abbr,t]));
const divisions=['East','North','South','West'];
const groups=['Charter','Union'].flatMap(c=>divisions.map(d=>clubs.filter(t=>t.conference===c&&t.division===d)));
const teamName=id=>{const t=byId.get(id);return t?t.market+' '+t.nickname:'Unknown club';};
const byName=new Map(clubs.map(t=>[teamName(t.id),t.id]));

// All text that reaches innerHTML goes through esc(). Colors go through color().
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const color=v=>/^#[0-9a-f]{6}$/i.test(v)?v:'#888888';
const isInt=(v,min=-Infinity,max=Infinity)=>Number.isInteger(v)&&v>=min&&v<=max;
const $=sel=>document.querySelector(sel);
const sentence=m=>/[.!?]$/.test(m)?m:m+'.';

// ---------------------------------------------------------------------------
// Club directory pane
// ---------------------------------------------------------------------------
const filter=$('#conf');
function renderDirectory(){
  const directory=$('#directory');
  directory.replaceChildren();
  for(const conference of ['Charter','Union']){
    if(filter.value!=='All'&&filter.value!==conference)continue;
    const heading=document.createElement('h2');
    heading.textContent=conference+' Conference';
    const grid=document.createElement('div');
    grid.className='grid';
    directory.append(heading,grid);
    for(const division of divisions){
      const card=document.createElement('article');
      const title=document.createElement('h3');
      title.textContent=division;
      const list=document.createElement('ul');
      for(const team of clubs.filter(t=>t.conference===conference&&t.division===division)){
        const row=document.createElement('li');
        const chip=document.createElement('span');
        chip.className='chip';
        chip.style.backgroundColor=color(team.primary);
        chip.style.borderColor=color(team.secondary);
        const label=document.createElement('button');label.className='club';label.dataset.id=team.id;
        const market=document.createElement('small');
        market.textContent=team.market;
        const name=document.createElement('strong');
        name.textContent=team.nickname;
        label.append(market,name);
        row.append(chip,label);
        list.append(row);
      }
      card.append(title,list);
      grid.append(card);
    }
  }
}
filter.addEventListener('change',renderDirectory);
$('#save').onclick=()=>offerFile('continental-gridiron-league.json',JSON.stringify(league,null,2));
renderDirectory();

// ---------------------------------------------------------------------------
// Seeded randomness. The generator state lives in the save, so the same save
// plus the same actions always produces the same results.
// ---------------------------------------------------------------------------
function newSeed(){
  try{return crypto.getRandomValues(new Uint32Array(1))[0];}
  catch{return Math.floor(Math.random()*4294967296)>>>0;}
}
function rngFor(holder){ // mulberry32; advances holder.state on every draw
  return ()=>{
    let t=holder.state=(holder.state+0x6D2B79F5)>>>0;
    t=Math.imul(t^(t>>>15),t|1);
    t^=t+Math.imul(t^(t>>>7),t|61);
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
const randInt=(r,n)=>Math.floor(r()*n);
function shuffled(r,items){
  const copy=[...items];
  for(let i=copy.length-1;i>0;i--){const j=randInt(r,i+1);[copy[i],copy[j]]=[copy[j],copy[i]];}
  return copy;
}
const randomId=r=>Array.from({length:10},()=>'abcdefghijklmnopqrstuvwxyz0123456789'[randInt(r,36)]).join('');

// ---------------------------------------------------------------------------
// Schedule, rosters and simulation
// ---------------------------------------------------------------------------
function makeSeason(r,number){
  const teams=groups.flatMap(g=>shuffled(r,g));
  const game=(home,away)=>({home:teams[home].id,away:teams[away].id,score:null});
  const rounds=[];
  const divisionRounds=[];
  const pairs=mask=>teams.map((_,i)=>[i,i^mask]).filter(([i,j])=>i<j);
  for(const mask of [1,2,3]){
    const first=pairs(mask).map(([i,j])=>randInt(r,2)?[i,j]:[j,i]);
    divisionRounds.push(first.map(([i,j])=>game(i,j)));
    rounds.push(first.map(([i,j])=>game(j,i)));
  }
  // Two perfect matchings form cycles. Orient each cycle to give every club
  // exactly one home game across its two rounds.
  const conferenceBlock=shuffled(r,[4,8,12]);
  const interBlock=shuffled(r,[16,20,24,28]);
  const masks=shuffled(r,[0,1,2,3].flatMap(k=>[conferenceBlock[0]+k,interBlock[0]+k]).concat(conferenceBlock.slice(1).map(k=>k+randInt(r,4))));
  for(let p=0;p<masks.length;p+=2){
    const visited=new Set(),matches=[[],[]];
    for(let start=0;start<32;start++){
      if(visited.has(start))continue;
      let i=start,side=randInt(r,2);
      do{
        visited.add(i);
        const j=i^masks[p+side];
        matches[side].push(game(i,j));
        i=j;side=1-side;
      }while(i!==start);
    }
    rounds.push(...matches);
  }
  rounds.push(pairs(interBlock[1]+randInt(r,4)).map(([i,j])=>randInt(r,2)?game(i,j):game(j,i)));
  const weeks=shuffled(r,rounds);
  const mid=[[],[],[],[]];
  shuffled(r,groups).forEach((group,index)=>{
    const ids=new Set(group.map(t=>t.id));
    const bye=index%4;
    const active=[0,1,2,3].filter(w=>w!==bye);
    shuffled(r,divisionRounds).forEach((round,i)=>mid[active[i]].push(...round.filter(g=>ids.has(g.home))));
  });
  weeks.splice(6+randInt(r,3),0,...mid);
  const ratings=Object.fromEntries(clubs.map(t=>[t.id,{offense:64+randInt(r,30),defense:64+randInt(r,30)}]));
  return {number,weeks,completed:0,tick:0,ratings};
}
// Position, roster places, starters per formation.
const positions=[
 ['QB',3,1],['RB',3,1],['WR',6,3],['TE',3,1],['OT',4,2],['OG',4,2],['C',2,1],
 ['DE',4,2],['DT',5,2],['LB',6,3],['CB',6,2],['S',4,2],['K',1,1],['P',1,1],['LS',1,1]
];
const positionNames=new Set(positions.map(p=>p[0]));
const startersAt=pos=>positions.find(g=>g[0]===pos)[2];
const givenNames='Andre Anton Austin Beau Blake Bryce Caleb Cameron Carson Cedric Chase Cole Curtis Darius Darnell Dawson Dean Devin Devon Diego Dominic Dylan Eli Ellis Everett Ezra Felix Gabriel Garrett Grant Hayden Isaiah Jalen Jamal Jasper Javier Jaylen Jonah Jordan Julian Kai Kendrick Kieran Lamar Leon Levi Lionel Logan Lorenzo Luca Malcolm Marcus Mason Mateo Micah Miles Nathan Nico Nolan Omar Owen Quincy Rafael Reed Rhett Roman Sam Shane Silas Terrence Theo Thomas Trent Tyrell Victor Wade Wesley Xavier Zane'.split(' ');
const surnames='Abbott Acosta Adair Ames Archer Banks Barrett Bell Bishop Boone Boyd Briggs Brooks Burke Calder Callahan Campbell Carter Castillo Chambers Clay Cobb Cole Collins Conley Cooper Cortez Crawford Cross Dalton Daniels Dawson Delaney Dixon Douglas Drake Ellis Fields Finch Fletcher Ford Foster Franklin Gaines Galvez Gardner Gibson Grant Gray Greene Griffin Hale Hall Hampton Harper Harris Hart Hayes Hill Holland Holt Howard Ingram Jackson James Jensen Jordan Keller King Knox Lane Lawson Lewis Long Lyons Malone Marsh Mason May Mercer Miles Mills Mitchell Monroe Morgan Neal Nelson Ortiz Owens Palmer Park Perry Porter Powell Quinn Ramirez Reed Reeves Reyes Rhodes Rivers Robinson Ross Rowe Sanders Shaw Silva Simon Sloan Steele Stone Sutton Tate Thomas Torres Turner Vega Wallace Walsh Ward Weaver Wells West Wilder Williams Willis Woods Wright Young'.split(' ');
function generateRosters(r,ratings){
  const bag=shuffled(r,givenNames.flatMap(first=>surnames.map(last=>first+' '+last)));
  const rosters={};
  for(const team of clubs){
    const players=[];
    for(const [index,[pos,count]] of positions.entries()){
      const base=index<7?ratings[team.id].offense:ratings[team.id].defense;
      const unitBase=67+(base-78)*.65+randInt(r,17)-8;
      for(let n=0;n<count;n++){
        const rating=Math.max(45,Math.min(99,Math.round(unitBase+randInt(r,26)-9))),age=21+randInt(r,13);
        players.push({id:team.id+'-p'+(players.length+1),name:bag.pop(),pos,rating,age,
          potential:Math.min(99,age<=24?rating+2+randInt(r,12):age<=27?rating+randInt(r,5):rating)});
      }
    }
    rosters[team.id]=players;
  }
  return rosters;
}
function personnel(players,coach=null){
  const chart={},quality={};
  for(const [pos,,starters] of positions){
    const depth=players.filter(p=>p.pos===pos).sort((a,b)=>Number(!!a.out)-Number(!!b.out)||(b.rating+lineupBias(coach,b))-(a.rating+lineupBias(coach,a))||a.id.localeCompare(b.id));
    chart[pos]=depth;
    const healthy=depth.filter(p=>!p.out);
    const startersAvailable=healthy.slice(0,starters);
    const starting=(startersAvailable.reduce((sum,p)=>sum+p.rating,0)+EMERGENCY_RATING*(starters-startersAvailable.length))/starters;
    const rotates=['RB','WR','DE','DT','LB','CB'].includes(pos);
    quality[pos]=rotates?.85*starting+.15*(healthy[starters]?.rating??starting):starting;
  }
  const q=quality;
  const line=(2*q.OT+2*q.OG+q.C)/5;
  const passing=.46*q.QB+.24*q.WR+.08*q.TE+.22*line;
  const rushing=.42*q.RB+.50*line+.08*q.TE;
  const coverage=.52*q.CB+.30*q.S+.18*q.LB;
  const pressure=.58*q.DE+.32*q.DT+.10*q.LB;
  const runDefense=.40*q.DT+.35*q.LB+.25*q.DE;
  return {chart,passing,rushing,coverage,pressure,runDefense,kick:q.K,punt:q.P,snap:q.LS,
    offense:Math.round(.62*passing+.38*rushing),defense:Math.round(.62*(.58*coverage+.42*pressure)+.38*runDefense)};
}
function drive(attack,defense,home,r){
  const pass=r()<(attack.passRate??.62);
  const matchup=pass?attack.passing-(.58*defense.coverage+.42*defense.pressure):attack.rushing-defense.runDefense;
  const advantage=matchup*.009+(home?.014:0)+(75-defense.punt)*.0006;
  const td=Math.min(.55,Math.max(.035,.225+advantage+((attack.gameday??65)-65)*.0004));
  const kickSkill=.93*attack.kick+.07*attack.snap;
  if(r()<td)return r()<Math.min(.995,.945+(kickSkill-75)*.002)?7:6;
  if(r()<.23&&r()<Math.max(.5,Math.min(.97,.83+(kickSkill-75)*.009)))return 3;
  return 0;
}
// Eleven drives each. A tie goes to overtime: each side is guaranteed one
// possession, then the next score wins. Still level after OT_DRIVES is a tie.
function simulate(home,away,r,neutral=false){
  let h=0,a=0;
  for(let d=0;d<11;d++)h+=drive(home,away,!neutral,r);
  for(let d=0;d<11;d++)a+=drive(away,home,false,r);
  if(h!==a)return {score:[h,a]};
  const homeFirst=r()<.5,ot=[0,0];
  for(let n=0;n<OT_DRIVES;n++){
    const homeBall=(n%2===0)===homeFirst;
    ot[homeBall?0:1]+=homeBall?drive(home,away,!neutral,r):drive(away,home,false,r);
    if(n>=1&&ot[0]!==ot[1])break;
  }
  return {score:[h+ot[0],a+ot[1]],ot:true};
}

// ---------------------------------------------------------------------------
// The save
//
// {schemaVersion, saveId, rng:{seed,state}, club, seasonIndex,
//  seasons:[{number, weeks, completed, ratings}], rosters, picks, offer,
//  events:[{id, season, week, type, ...}], nextEventId, migrations?}
//
// Events are structured records. Sentences are written from them at render
// time, so wording can change without touching saves.
// ---------------------------------------------------------------------------
const cur=(S=save)=>S.seasons[S.seasonIndex];
const defaultPicks=()=>clubs.flatMap(t=>Array.from({length:7},(_,i)=>({origin:t.id,round:i+1,owner:t.id})));
function newSave(seed=newSeed()){
  const rng={seed,state:seed},r=rngFor(rng);
  const season=makeSeason(r,1);
  const S={schemaVersion:SCHEMA_VERSION,saveId:randomId(r),rng,club:null,seasonIndex:0,seasons:[season],
    rosters:generateRosters(r,season.ratings),picks:defaultPicks(),offer:null,events:[],nextEventId:1,revision:0,
    world:makeWorld(r,0),staff:makeStaff(r),stadium:newStadiumState(),finance:makeFinance(r),league:makeLeague(r),
    draft:makeDraft(r,1),history:[],draftHistory:[]};
  makeCap(S,r);
  makeStaffAll(S,r);
  initDepth(S,r);
  return S;
}
const snap=p=>({id:p.id,name:p.name,pos:p.pos,rating:p.rating});
function record(S,type,data){
  const s=cur(S);
  S.events.push({id:S.nextEventId++,season:s.number,week:s.tick,type,...data});
}

function playWeek(S){
  const s=cur(S);
  if(s.completed>=s.weeks.length)return;
  const r=rngFor(S.rng);
  const units=Object.fromEntries(clubs.map(t=>[t.id,clubUnits(S,t.id)]));
  const games=s.weeks[s.completed];
  for(const g of games){
    const result=simulate(units[g.home],units[g.away],r);
    g.score=result.score;
    if(result.ot)g.ot=true;
  }
  s.completed++;
  s.tick=s.completed;
  creditRecords(S,games);
  trackStarts(S,units,games);
  afterTick(S,r,{games,units,regularIndex:s.completed-1});
  if(s.completed===s.weeks.length)floorPlanning(S);
}
function finishMedicalWeek(S,units,r,games){
  const played=new Set(games.flatMap(g=>[g.home,g.away]));
  for(const t of clubs){
    const active=Object.values(units[t.id].chart).flat().filter(p=>!p.out);
    for(const p of S.rosters[t.id]){
      if(p.out&&--p.out===0){
        delete p.out;
        if(t.id===S.club)record(S,'cleared',{player:snap(p)});
      }
    }
    if(!played.has(t.id))continue;
    for(const p of shuffled(r,active)){
      const depth=units[t.id].chart[p.pos],starters=startersAt(p.pos);
      const starter=depth.indexOf(p)<starters;
      if(r()>(starter?.024:.006)*(t.id===S.club?injuryFactor(S):1))continue;
      const healthy=S.rosters[t.id].filter(other=>other.pos===p.pos&&!other.out);
      if(healthy.length<=starters)continue;
      p.out=r()<.12?IR_THRESHOLD+randInt(r,11):1+randInt(r,5);
      if(t.id===S.club&&effectActive(S,'facility')&&p.out>1&&r()<.4)p.out--;
      if(t.id===S.club&&starter){
        const backup=personnel(S.rosters[t.id]).chart[p.pos][starters-1];
        record(S,'injury',{player:snap(p),weeks:p.out,backup:snap(backup)});
      }
    }
  }
}

// ---------------------------------------------------------------------------
// Trades
// ---------------------------------------------------------------------------
const pickValues=[0,100,55,34,21,13,8,5];
const pickKey=p=>p?p.origin+'/'+p.round:'none';
function playerValue(p){
  const weight={QB:1.9,DE:1.25,OT:1.2,WR:1.1,CB:1.1,K:.085,P:.065,LS:.04}[p.pos]??.85;
  return weight*(Math.pow(Math.max(3,p.rating-49),1.55)/4)*Math.max(.7,1-(p.age-25)*.022);
}
// A bargain contract adds trade value; an expensive one subtracts it.
function contractSurplus(S,p){
  if(!p?.contract||!S?.cap)return 0;
  return Math.max(-40,Math.min(40,(marketValue(S,p)-capHit(p))*Math.min(p.contract.yearsLeft,3)*1.2));
}
// Clubs charge rivals more: +20% inside the division, +8% inside the conference.
function rivalFactor(a,b){
  const x=byId.get(a),y=byId.get(b);
  if(!x||!y||a===b||x.conference!==y.conference)return 1;
  return x.division===y.division?1.2:1.08;
}
const rivalNote=(a,b)=>{const f=rivalFactor(a,b);return f>=1.2?'a division rival':f>1?'a conference rival':'';};
function termsNeeded(target,out,S=save,sellerId=null){
  const base=playerValue(target)*tradeFactor(S)+contractSurplus(S,target);
  const rf=sellerId&&S?.club?rivalFactor(S.club,sellerId):1;
  return Math.max(0,Math.ceil(base*rf-(out?playerValue(out)+contractSurplus(S,out):0)));
}
function ownedPicks(S){
  return S.picks.filter(p=>p.owner===S.club).sort((a,b)=>b.round-a.round);
}
function pickLabel(p){
  return p?(byId.get(p.origin)?.abbr??'?')+' round '+p.round:'no draft pick';
}
// Healthy players a roster would have at pos after `leaving` goes and `arriving` comes.
function healthyAfter(roster,pos,leaving,arriving){
  return roster.filter(p=>p.pos===pos&&!p.out&&p.id!==leaving?.id).length+(arriving&&arriving.pos===pos&&!arriving.out?1:0);
}
// A club will not trade itself below a full set of healthy starters at the position.
const sellerShort=(S,seller,target,out)=>healthyAfter(S.rosters[seller],target.pos,target,out)<startersAt(target.pos);
const buyerShort=(S,target,out)=>!!out&&healthyAfter(S.rosters[S.club],out.pos,out,target)<startersAt(out.pos);

function tradeCap(S,seller,target,out){
  return {buyer:round2(capRoom(S,S.club)-capHit(target)+(out?capHit(out):0)),seller:round2(capRoom(S,seller)+capHit(target)-(out?capHit(out):0))};
}
function tradeQuote(S,seller,targetId){
  const s=cur(S);
  if(!S.club||seller===S.club||S.offer||!tradeWindow(S))return;
  const target=S.rosters[seller]?.find(p=>p.id===targetId&&!p.out);
  if(!target)return;
  const base={seller,targetId,outId:null,origin:null,round:0,week:s.tick};
  if(sellerShort(S,seller,target,null)){S.offer={...base,firm:false,status:'needsDepth'};return;}
  if(tradeCap(S,seller,target,null).buyer<0){S.offer={...base,firm:false,status:'capShort'};return;}
  const gap=termsNeeded(target,null,S,seller);
  const pick=ownedPicks(S).find(p=>pickValues[p.round]>=gap*1.3+3);
  S.offer={...base,origin:pick?.origin??null,round:pick?.round??0,firm:!!pick||gap===0,status:pick||gap===0?'opening':'needMore'};
}
function counterTrade(S,outId,key){
  const q=S.offer;if(!q||q.week!==cur(S).tick)return;
  const target=S.rosters[q.seller].find(p=>p.id===q.targetId&&!p.out);
  const out=outId==='none'?null:S.rosters[S.club].find(p=>p.id===outId&&!p.out);
  const picks=ownedPicks(S),pick=picks.find(p=>pickKey(p)===key);
  if(!target||(outId!=='none'&&!out)||(!pick&&key!=='none'))return;
  if(!out&&!pick){q.status='incomplete';return;}
  if(sellerShort(S,q.seller,target,out)){
    Object.assign(q,{outId:out?.id??null,round:0,origin:null,firm:false,status:'needsDepth'});
    return;
  }
  const cap=tradeCap(S,q.seller,target,out);
  if(cap.buyer<0||cap.seller<0){Object.assign(q,{outId:out?.id??null,round:0,origin:null,firm:false,status:cap.buyer<0?'capShort':'sellerCap'});return;}
  const needed=termsNeeded(target,out,S,q.seller);
  const value=pick?pickValues[pick.round]:0;
  let terms=pick;
  if(value>=needed){q.firm=true;q.status='accepted';}
  else{
    terms=picks.find(p=>pickValues[p.round]>=needed);
    q.firm=!!terms;
    q.status=terms?'countered':'declined';
  }
  Object.assign(q,{outId:out?.id??null,round:terms?.round??0,origin:terms?.origin??null});
}
function resolveOffer(S,accept){
  const q=S.offer;if(!q)return;
  if(!accept){S.offer=null;record(S,'talksEnded',{seller:q.seller});return;}
  if(!tradeWindow(S)){S.offer=null;record(S,'termsGone',{seller:q.seller});return;}
  if(q.firm===false)return;
  const theirs=S.rosters[q.seller],ours=S.rosters[S.club];
  const i=theirs.findIndex(p=>p.id===q.targetId&&!p.out),j=ours.findIndex(p=>p.id===q.outId&&!p.out);
  const target=theirs[i],out=j>=0?ours[j]:null;
  const pick=ownedPicks(S).find(p=>p.origin===q.origin&&p.round===q.round);
  if(i<0||(q.outId&&!out)||(!q.outId&&!pick)||(q.round&&!pick)||q.week!==cur(S).tick||sellerShort(S,q.seller,target,out)||tradeCap(S,q.seller,target,out).buyer<0||tradeCap(S,q.seller,target,out).seller<0){
    S.offer=null;record(S,'termsGone',{seller:q.seller});return;
  }
  if(out){theirs[i]=out;ours[j]=target;}else{theirs.splice(i,1);ours.push(target);}
  if(pick)pick.owner=q.seller;
  S.offer=null;
  record(S,'trade',{seller:q.seller,incoming:snap(target),outgoing:out?snap(out):null,pick:pick?{origin:pick.origin,round:pick.round}:null});
}

const between=(r,[lo,hi])=>lo+r()*(hi-lo);
const round5=n=>Math.round(n/5)*5;
const personName=r=>givenNames[randInt(r,givenNames.length)]+' '+surnames[randInt(r,surnames.length)];

function makeWorld(r,completed){
  const markets=OPEN_MARKETS.map(m=>({...m,officials:[
    {id:m.id+'-city',title:CITY_TITLE[m.country],name:personName(r),warmth:35+randInt(r,40)},
    {id:m.id+'-region',title:REGION_TITLE[m.country],name:personName(r),warmth:30+randInt(r,40)}]}));
  const sites=markets.flatMap(m=>Object.entries(SITE_KINDS).map(([kind,k])=>{
    const estimate=round5(between(r,k.infra));
    const issue=r()<.45?SITE_ISSUES[randInt(r,SITE_ISSUES.length)]:null;
    return {id:m.id+'-'+kind,marketId:m.id,kind,name:k.names[randInt(r,k.names.length)],
      control:kind==='downtown'?'city':'region',sponsor:m.id+(kind==='downtown'?'-city':'-region'),
      acres:Math.round(between(r,k.acres)),transit:k.transit,parking:Math.round(between(r,k.parking)),
      maxSeats:Math.round(between(r,k.seats)/500)*500,landTerms:LAND_TERMS[randInt(r,2)],
      publicOffer:round5((180+m.potential*4)*between(r,k.offer)),
      infraEstimate:estimate,infraTrue:round5(estimate*between(r,[.85,1.35])+(issue?issue.cost:0)),
      issue,infraKnown:false,issueKnown:false,
      expiresWeek:Math.min(REGULAR_WEEKS,completed+4+randInt(r,9)),status:'open'};
  }));
  const leases=Object.fromEntries(clubs.map(t=>{
    const opened=1962+randInt(r,56),age=2026-opened;
    return [t.id,{stadium:t.market+' '+['Memorial Stadium','Municipal Stadium','Stadium','Field','Coliseum'][randInt(r,5)],
      opened,capacity:61000+randInt(r,16)*1000,yearsLeft:2+randInt(r,13),condition:age>40?'Worn':age>20?'Serviceable':'Modern'}];
  }));
  return {markets,sites,leases};
}
const newStadiumState=()=>({visits:[],studies:[],knowledge:[],nextFactId:1,homeMood:60,homeAware:false});
const makeStaff=r=>({president:{name:personName(r)}});

const siteById=(S,id)=>S.world.sites.find(s=>s.id===id);
const marketById=(S,id)=>S.world.markets.find(m=>m.id===id);
const officialById=(S,id)=>S.world.markets.flatMap(m=>m.officials).find(o=>o.id===id);
const stance=w=>w>=65?'eager':w>=45?'open':'cautious';
const plannedVisit=S=>S.stadium.visits.find(v=>v.status==='planned');

function learn(S,fact,knownBy){
  const s=cur(S),f={id:S.stadium.nextFactId++,season:s.number,week:s.tick,...fact,knownBy:[...new Set(knownBy)]};
  S.stadium.knowledge.push(f);
  return f;
}
function tell(f,...who){for(const w of who)if(!f.knownBy.includes(w))f.knownBy.push(w);}
function leak(S,f){
  tell(f,'press','home');
  S.stadium.homeAware=true;
  S.stadium.homeMood=Math.max(0,S.stadium.homeMood-10);
}

// Owner actions. Each returns a short status code; the page turns it into words.
function authorizeVisit(S,siteId,plan){
  const s=cur(S),site=siteById(S,siteId);
  if(!S.club)return 'closed';
  if(!site||site.status!=='open')return 'unavailable';
  if(plannedVisit(S))return 'busy';
  for(const key of Object.keys(VISIT_OPTIONS))if(!(plan?.[key] in VISIT_OPTIONS[key]))return 'invalid';
  const visit={id:'v'+(S.stadium.visits.length+1),siteId,who:plan.who,discretion:plan.discretion,ask:plan.ask,signal:plan.signal,week:s.tick,status:'planned'};
  const f=learn(S,{kind:'visit',siteId,visitId:visit.id},['owner','president']);
  visit.factId=f.id;
  S.stadium.visits.push(visit);
  return 'ok';
}
function cancelVisit(S){
  const v=plannedVisit(S);if(!v)return;
  S.stadium.visits=S.stadium.visits.filter(x=>x!==v);
  S.stadium.knowledge=S.stadium.knowledge.filter(f=>f.id!==v.factId);
}
function commissionStudy(S,siteId){
  const s=cur(S),site=siteById(S,siteId);
  if(!S.club)return 'closed';
  if(!site||site.status!=='open')return 'unavailable';
  if(site.infraKnown&&site.issueKnown||S.stadium.studies.some(x=>x.siteId===siteId))return 'done';
  const f=learn(S,{kind:'study',siteId},['owner','president','consultants']);
  S.stadium.studies.push({siteId,ordered:s.tick,due:s.tick+2,status:'underway',factId:f.id});
  return 'ok';
}

// Runs after each played week.
function processStadium(S,r){
  if(!S.club)return;
  const s=cur(S);
  const v=plannedVisit(S);
  if(v)resolveVisit(S,v,r);
  for(const study of S.stadium.studies.filter(x=>x.status==='underway'&&x.due<=s.tick)){
    const site=siteById(S,study.siteId),f=S.stadium.knowledge.find(x=>x.id===study.factId);
    site.infraKnown=true;site.issueKnown=true;study.status='done';
    const leaked=r()<.04;
    if(leaked&&f)leak(S,f);
    record(S,'studyReport',{siteId:site.id,siteName:site.name,marketName:marketById(S,site.marketId).name,
      estimate:site.infraEstimate,infra:site.infraTrue,issue:site.issue?.text??null,leaked,homeMarket:byId.get(S.club).market});
  }
  for(const site of S.world.sites.filter(x=>x.status==='open'&&x.expiresWeek<=s.tick)){
    site.status='expired';
    if(S.stadium.knowledge.some(f=>f.siteId===site.id))record(S,'siteExpired',{siteId:site.id,siteName:site.name,marketName:marketById(S,site.marketId).name});
  }
}
function resolveVisit(S,v,r){
  const site=siteById(S,v.siteId),market=marketById(S,site.marketId),official=officialById(S,site.sponsor);
  const f=S.stadium.knowledge.find(x=>x.id===v.factId);
  const before={warmth:official.warmth,offer:site.publicOffer,parking:site.parking,land:site.landTerms,expires:site.expiresWeek};
  let gain={president:3,owner:12,both:15}[v.who]+(v.signal==='serious'?8:0)+(v.discretion==='open'?3:0)+randInt(r,7)-3;
  const suspicious=v.ask==='publicMoney'&&v.signal==='exploring'&&r()<.5;
  if(suspicious)gain-=14;
  official.warmth=Math.max(0,Math.min(100,official.warmth+gain));
  const w=official.warmth;
  if(v.ask==='publicMoney'&&!suspicious)site.publicOffer=round5(site.publicOffer*(1+.02+w/100*.08+(v.signal==='serious'?.03:0)));
  if(v.ask==='landTerms'){
    const i=LAND_TERMS.indexOf(site.landTerms);
    if(w>=45&&i<LAND_TERMS.length-1)site.landTerms=LAND_TERMS[i+1];
    site.parking+=w>=45?2+randInt(r,3):1;
  }
  if(v.ask==='deadline')site.expiresWeek+=w>=45?2+(v.signal==='serious'?2:0)+(v.who!=='president'?1:0)+randInt(r,2):1;
  if(v.ask==='listen'){site.infraKnown=true;if(site.issue&&w>=50)site.issueKnown=true;}
  const leaked=r()<(v.discretion==='quiet'?.06:.55)+(v.who!=='president'?.12:0);
  if(f){tell(f,official.id);if(leaked)leak(S,f);}
  if(leaked)news(S,byId.get(S.club).market+' ownership quietly courted '+market.name+', sources say');
  v.status='done';
  record(S,'visitReport',{visitId:v.id,siteId:site.id,siteName:site.name,marketName:market.name,homeMarket:byId.get(S.club).market,
    plan:{who:v.who,discretion:v.discretion,ask:v.ask,signal:v.signal},
    official:{id:official.id,title:official.title,name:official.name},
    before,after:{warmth:w,offer:site.publicOffer,parking:site.parking,land:site.landTerms,expires:site.expiresWeek},
    gain,suspicious,leaked,
    revealed:v.ask==='listen'?{infra:site.infraTrue,issue:site.issueKnown?site.issue?.text??null:null}:null});
}

// Words for stadium events (plain text; describeEvent escapes it).
function visitReportText(e){
  const off=e.official.title+' '+e.official.name,b=e.before,a=e.after,p=e.plan;
  const parts=[{president:'As you asked, I made the trip to '+e.marketName+' alone.',owner:'You met them yourself in '+e.marketName+', so this is my read from what you told me.',both:'Good trip to '+e.marketName+' together.'}[p.who],
    p.discretion==='quiet'?'We kept it quiet, with no public schedule.':'We made no secret of it.',
    p.signal==='exploring'?'We told them we are exploring options.':'We told them we are serious about moving.'];
  if(p.ask==='publicMoney')parts.push(e.suspicious?off+' asked whether we are using '+e.marketName+' as leverage at home, and the public offer stayed at $'+b.offer+'M.':
    a.offer>b.offer?'On public money, their offer for the '+e.siteName+' moved from $'+b.offer+'M to $'+a.offer+'M.':'On public money, their offer stayed at $'+b.offer+'M.');
  if(p.ask==='landTerms')parts.push((a.land!==b.land?'On land, they moved from a '+b.land+' to a '+a.land+',':'On land, they held at a '+b.land+',')+' and our parking share rose from $'+b.parking+'M to $'+a.parking+'M a year.');
  if(p.ask==='deadline')parts.push(a.expires-b.expires>1?'They extended the deadline from after week '+b.expires+' to after week '+a.expires+'.':'They gave us one more week, to after week '+a.expires+', and made clear that is all for now.');
  if(p.ask==='listen')parts.push('We mostly listened. Their engineers put infrastructure at $'+e.revealed.infra+'M'+(e.revealed.issue?', and they admitted that '+e.revealed.issue+'.':'.'));
  parts.push(off+' came away '+(e.gain>=8?'warmer toward us':e.gain>=0?'about where they started':'cooler toward us')+'.');
  parts.push(e.leaked?'Someone talked: the visit is in the '+e.homeMarket+' papers.':'As far as I can tell, nobody outside the room knows.');
  return parts.join(' ');
}
function studyReportText(e){
  return 'The feasibility study of the '+e.siteName+' in '+e.marketName+' is back. Infrastructure comes to $'+e.infra+'M against their estimate of $'+e.estimate+'M'+
    (e.issue?'. The consultants found that '+e.issue+'.':'. They found no other problems.')+(e.leaked?' Word of the study reached the '+e.homeMarket+' press.':'');
}

  if(w==='consultants')return 'Feasibility consultants';
  if(w==='press')return 'Reporters';
  if(w==='league')return 'League finance committee';
  if(w==='station')return 'The local TV station';
  if(w==='sponsors')return 'Prospective sponsors';
  if(w==='home')return byId.get(S.club).market+' officials and fans';
  const o=officialById(S,w);return o?possessive(o.title+' '+o.name)+' office':w;
}
function factText(S,f){
  const site=siteById(S,f.siteId),market=site&&marketById(S,site.marketId);
  const where=site?'the '+site.name+' in '+market.name:'a site';
  if(f.kind==='visit'){
    const v=S.stadium.visits.find(x=>x.id===f.visitId);
    return (v?.status==='planned'?'Planned private visit to ':'Private visit to ')+where;
  }
  if(f.kind==='study')return 'Feasibility study of '+where;
  if(f.kind==='ownerFunding')return 'You paid personally for the '+projectDef(f.project).name.toLowerCase();
  if(f.kind==='namingTalks')return 'Naming-rights talks for your stadium';
  if(f.kind==='stationVisit')return 'Your visit to the '+openMarket(f.marketId).name+' TV station';
  return 'Note about '+where;
}

function makeFinance(r){
  return {ownerCash:350+randInt(r,401),distributionAnnual:90+randInt(r,71),clubCash:25+randInt(r,41),debt:150+randInt(r,151),rate:.06,
    lossPolicy:'borrow',projects:PROJECTS.map(p=>({id:p.id,status:'proposed'})),ledger:[],capitalLog:[],
    contributions:{capital:0,operating:0},naming:{status:'none'}};
}
const perWeek=annual=>annual/REGULAR_WEEKS;
const round2=n=>Math.round(n*100)/100;
const round1=n=>Math.round(n*10)/10;
function localMetro(team){
  const sharing=clubs.filter(t=>t.marketId===team.marketId).length;
  return (HOME_METRO[team.marketId]??2)/sharing;
}
const leaseRent=lease=>round1(4+(lease.capacity-61000)/1000*.3+({Modern:6,Serviceable:3}[lease.condition]??1));
const effectActive=(S,id)=>S.finance.projects.some(p=>p.id===id&&p.status==='active');
function injuryFactor(S){
  return (effectActive(S,'plane')?.9:1)*(effectActive(S,'facility')?.8:1)*(effectActive(S,'science')?.9:1);
}
function winPct(S,id){
  const s=cur(S);let w=0,n=0;
  for(const g of s.weeks.slice(0,s.completed).flat()){
    if(g.home!==id&&g.away!==id)continue;
    const [a,b]=g.home===id?g.score:[g.score[1],g.score[0]];
    n++;w+=a>b?1:a===b?.5:0;
  }
  return n?w/n:.5;
}
function gate(S,clubId){
  const lease=S.world.leases[clubId],metro=localMetro(byId.get(clubId)),owned=clubId===S.club;
  const upgraded=owned&&effectActive(S,'upgrade'),mood=owned?S.stadium.homeMood:60;
  const fill=Math.max(.55,Math.min(1,.8+(winPct(S,clubId)-.5)*.3+(mood-60)/300+(upgraded?.02:0)+({Modern:.03,Worn:-.03}[lease.condition]??0)));
  const attendance=lease.capacity*fill,price=90+12*Math.sqrt(metro);
  return {attendance,tickets:attendance*price/1e6,
    premium:lease.capacity/1000*.09*({Modern:1.15,Worn:.85}[lease.condition]??1)*(upgraded?1.12:1),
    concessions:attendance*32/1e6*(upgraded?1.12:1)};
}
const salaryRaw=p=>.9+playerValue(p)*.06;
// Cash salaries for a season. Signing bonuses were paid in cash when signed.
function payroll(S,id){
  return [...S.rosters[id],...(S.practice?.[id]??[])].reduce((sum,p)=>sum+(p.contract?.salary??0),0);
}
function weekLines(S,g){
  const id=S.club,team=byId.get(id),lease=S.world.leases[id],F=S.finance,metro=localMetro(team);
  const L={nationalTV:perWeek(300),localMedia:perWeek(40+18*Math.sqrt(metro)),sponsorship:perWeek(25+10*Math.sqrt(metro)),
    namingRights:F.naming.status==='signed'?perWeek(F.naming.deal.annual):0,
    marketRights:S.league?Object.entries(S.league.markets).filter(([,M])=>M.holder===id).reduce((sum,[mk,M])=>sum+perWeek(adValue(mk,M.fans[id]??0)-M.fee),0):0,tickets:0,premium:0,concessions:0,visitorShare:0,
    payroll:-perWeek(payroll(S,id)),footballOps:-perWeek(54+(S.staff?.clubs?(hcOf(S,id).contract.salary+gmOf(S,id).contract.salary):16)),businessOps:-perWeek(45),travel:-perWeek(effectActive(S,'plane')?3:8),
    stadiumRent:-perWeek(leaseRent(lease)),gameDay:0,
    projects:-perWeek(F.projects.filter(p=>p.status==='active').reduce((sum,p)=>sum+projectDef(p.id).recurring,0)),
    debtService:-perWeek(F.debt*F.rate+(F.debt>0?12:0))};
  if(g&&g.home===id){const G=gate(S,id);Object.assign(L,{tickets:G.tickets,premium:G.premium,concessions:G.concessions,gameDay:-2.5,visitorShare:-.34*G.tickets});}
  else if(g)L.visitorShare=.34*gate(S,g.home).tickets;
  return Object.fromEntries(Object.entries(L).map(([k,v])=>[k,round2(v)]));
}
const sumLines=lines=>round2(Object.values(lines).reduce((a,b)=>a+b,0));

// Runs after each played week, for the owner's club.
function processFinance(S){
  if(!S.club)return;
  const s=cur(S),F=S.finance,week=s.completed;
  const g=s.weeks[week-1].find(x=>x.home===S.club||x.away===S.club);
  const lines=weekLines(S,g),result=sumLines(lines);
  F.clubCash=round2(F.clubCash+result);
  if(F.debt>0)F.debt=round2(Math.max(0,F.debt-perWeek(12)));
  let ownerIncome=0,ownerOperating=0,borrowed=0;
  if(F.clubCash<0){
    const need=-F.clubCash;
    if(F.lossPolicy==='owner'&&F.ownerCash>=need){F.ownerCash=round2(F.ownerCash-need);F.contributions.operating=round2(F.contributions.operating+need);ownerOperating=round2(need);}
    else{F.debt=round2(F.debt+need);borrowed=round2(need);}
    F.clubCash=0;
  }
  F.ledger.push({season:s.number,week,lines,result,ownerIncome,ownerOperating,borrowed});
}
// Construction runs on the calendar, offseason included.
function processProjects(S){
  for(const p of S.finance.projects.filter(x=>x.status==='building')){
    if(--p.weeksLeft<=0){p.status='active';delete p.weeksLeft;record(S,'projectDone',{project:p.id});}
  }
}

// Owner decisions. Each returns a status code the page turns into words.
function fundProject(S,id,funding){
  const F=S.finance,p=F.projects.find(x=>x.id===id),def=projectDef(id),s=cur(S);
  if(!S.club||!p||p.status!=='proposed')return 'unavailable';
  if(!['club','debt','owner'].includes(funding))return 'invalid';
  if(def.cost>0){
    if(funding==='club'&&F.clubCash<def.cost)return 'clubShort';
    if(funding==='owner'&&F.ownerCash<def.cost)return 'ownerShort';
    if(funding==='debt'&&F.debt+def.cost>DEBT_LIMIT)return 'debtLimit';
    if(funding==='club')F.clubCash=round2(F.clubCash-def.cost);
    if(funding==='debt')F.debt=round2(F.debt+def.cost);
    if(funding==='owner'){F.ownerCash=round2(F.ownerCash-def.cost);F.contributions.capital=round2(F.contributions.capital+def.cost);}
    F.capitalLog.push({season:s.number,week:s.tick,project:id,amount:def.cost,funding});
    if(funding==='owner')learn(S,{kind:'ownerFunding',project:id},['owner','president','league']);
  }
  p.funding=def.cost>0?funding:'club';
  if(def.build>0){p.status='building';p.weeksLeft=def.build;}else p.status='active';
  return 'ok';
}
function declineProject(S,id){const p=S.finance.projects.find(x=>x.id===id);if(p?.status==='proposed')p.status='declined';}
function reopenProject(S,id){const p=S.finance.projects.find(x=>x.id===id);if(p?.status==='declined')p.status='proposed';}
function setLossPolicy(S,policy){if(['borrow','owner'].includes(policy))S.finance.lossPolicy=policy;}

// Naming rights: the president negotiates on the owner's mandate.
function namingValue(S){
  const lease=S.world.leases[S.club];
  return round1((6+4*Math.sqrt(localMetro(byId.get(S.club))))*({Modern:1.15,Worn:.8}[lease.condition]??1));
}
function startNaming(S,mandate){
  const s=cur(S),F=S.finance;
  if(!S.club)return 'closed';
  if(F.naming.status==='negotiating'||F.naming.status==='awaiting')return 'busy';
  if(F.naming.status==='signed')return 'signed';
  const m={minAnnual:Number(mandate?.minAnnual),maxYears:Number(mandate?.maxYears),
    exclude:Array.isArray(mandate?.exclude)?mandate.exclude.filter(c=>c in CATEGORY_LABEL):[],authority:mandate?.authority};
  if(!(m.minAnnual>0&&m.minAnnual<=60)||![10,15,20,25].includes(m.maxYears)||!['sign','report'].includes(m.authority))return 'invalid';
  const r=rngFor(S.rng);
  const bidders=shuffled(r,Object.keys(NAMING_SPONSORS)).slice(0,4).map((category,i)=>{
    const names=NAMING_SPONSORS[category];
    return {id:'b'+(i+1),company:names[randInt(r,names.length)],category,appetite:round2(.75+r()*.55),years:8+randInt(r,14)};
  });
  const f=learn(S,{kind:'namingTalks'},['owner','president','sponsors']);
  F.naming={status:'negotiating',round:0,mandate:m,bidders,value:namingValue(S),startedWeek:s.tick,factId:f.id};
  return 'ok';
}
function namingOffers(N){
  const m=N.mandate;
  return N.bidders.map(b=>{
    let annual=N.value*b.appetite*Math.min(1,.86+.05*N.round),years=b.years,reason=null;
    if(years>m.maxYears){
      if(years-m.maxYears<=6){years=m.maxYears;annual*=.95;}
      else reason='they will not go below '+b.years+' years';
    }
    annual=round1(annual);
    if(!reason&&m.exclude.includes(b.category))reason='you ruled out '+CATEGORY_LABEL[b.category].toLowerCase()+' sponsors';
    if(!reason&&annual<m.minAnnual)reason='it is below your $'+m.minAnnual+'M floor';
    return {bidderId:b.id,company:b.company,category:b.category,annual,years,reason};
  }).sort((a,b)=>b.annual-a.annual);
}
function processNaming(S){
  if(!S.club)return;
  const s=cur(S),F=S.finance,N=F.naming;
  if(N.status==='awaiting'&&s.tick>=N.expiresWeek){
    record(S,'namingLapsed',{company:N.offer.company});
    F.naming={status:'none'};return;
  }
  if(N.status!=='negotiating')return;
  N.round++;
  const offers=namingOffers(N),valid=offers.find(o=>!o.reason);
  if(valid&&N.mandate.authority==='sign')return signNaming(S,valid,true);
  if(valid||N.round>=NAMING_ROUNDS){
    const offer=valid??offers[0];
    Object.assign(N,{status:'awaiting',offer,outside:!valid,expiresWeek:s.tick+2});
    record(S,'namingAwaiting',{offer,outside:!valid,expiresWeek:N.expiresWeek,rounds:N.round});
  }
}
function signNaming(S,offer,delegated){
  const lease=S.world.leases[S.club],old=lease.stadium;
  const suffix=['Stadium','Field','Coliseum'].find(w=>old.endsWith(w))??'Stadium';
  lease.stadium=offer.company+' '+suffix;
  const deal={company:offer.company,category:offer.category,annual:offer.annual,years:offer.years,season:cur(S).number,week:cur(S).tick,originalName:old,newName:lease.stadium,delegated};
  const f=S.stadium.knowledge.find(x=>x.id===S.finance.naming.factId);
  if(f)tell(f,'press','home');
  S.finance.naming={status:'signed',deal};
  news(S,old+' will become '+lease.stadium+' under a '+deal.years+'-year naming deal');
  record(S,'namingSigned',{deal});
}
function approveNaming(S){const N=S.finance.naming;if(N.status==='awaiting')signNaming(S,N.offer,false);}
function declineNaming(S){
  const N=S.finance.naming;
  if(N.status==='awaiting')record(S,'namingDeclined',{company:N.offer.company});
  if(N.status==='awaiting'||N.status==='negotiating')S.finance.naming={status:'none'};
}

// Words for money events.
function financeEventText(e){
  const def=e.project&&projectDef(e.project);
  switch(e.type){
    case 'projectDone':return e.project==='plane'?'The team plane is in service.':e.project==='science'?'The sports science department is running.':def.name+' is finished.';
    case 'namingSigned':{const d=e.deal;return (d.delegated?'Done. Inside your terms, I signed ':'Signed, as you approved: ')+d.company+' names the stadium for '+d.years+' years at $'+d.annual+'M a year. '+d.originalName+' becomes '+d.newName+'.';}
    case 'namingAwaiting':{const o=e.offer;return e.outside?
      'After '+e.rounds+' rounds nobody met your terms. The best offer is '+o.company+' ('+CATEGORY_LABEL[o.category].toLowerCase()+') at $'+o.annual+'M a year for '+o.years+' years, but '+o.reason+'. It is on the Finances page through '+weekLabel(e.expiresWeek)+' if you want it anyway.':
      o.company+' offered $'+o.annual+'M a year for '+o.years+' years, inside your terms. You asked to approve it yourself, so it is on the Finances page through '+weekLabel(e.expiresWeek)+'.';}
    case 'namingLapsed':return possessive(e.company)+' naming offer lapsed without an answer.';
    case 'namingDeclined':return 'I told '+e.company+' we are passing on their naming offer.';
  }
  return '';
}

const HOME_COORDS={buffalo:[42.89,-78.88],miami:[25.76,-80.19],'new-england':[42.09,-71.26],'new-york':[40.71,-74.0],baltimore:[39.29,-76.61],

  'los-angeles':[34.05,-118.24],dallas:[32.78,-96.80],philadelphia:[39.95,-75.17],washington:[38.91,-77.04],'green-bay':[44.51,-88.01],
  chicago:[41.88,-87.63],detroit:[42.33,-83.05],minnesota:[44.98,-93.27],atlanta:[33.75,-84.39],carolina:[35.23,-80.84],
  'new-orleans':[29.95,-90.07],'tampa-bay':[27.95,-82.46],arizona:[33.45,-112.07],'san-francisco':[37.77,-122.42],seattle:[47.61,-122.33]};
// Placeholder initial rights; the bible leaves the real list open.
const INITIAL_RIGHTS={columbus:'club-07','san-antonio':'club-09','oklahoma-city':'club-17','mexico-city':'club-29',
  toronto:'club-01',portland:'club-32','st-louis':'club-14','san-diego':'club-30'};
const OWNER_STYLES=['old guard','operator','maverick'];
const possessive=n=>n+(n.endsWith('s')?'’':'’s');
const VOTE_THRESHOLD=24;  // three quarters of 32 clubs
const MEETING_CALLS=6;

function milesBetween([la1,lo1],[la2,lo2]){
  const rad=Math.PI/180,dla=(la2-la1)*rad,dlo=(lo2-lo1)*rad;
  const h=Math.sin(dla/2)**2+Math.cos(la1*rad)*Math.cos(la2*rad)*Math.sin(dlo/2)**2;
  return 3959*2*Math.asin(Math.sqrt(h));
}
const openMarket=id=>OPEN_MARKETS.find(m=>m.id===id);
const clubCoords=id=>HOME_COORDS[byId.get(id).marketId];
function nearestClubs(marketId,n){
  const m=openMarket(marketId),seen=new Set();
  return clubs.map(t=>({id:t.id,miles:milesBetween([m.lat,m.lon],HOME_COORDS[t.marketId])})).sort((a,b)=>a.miles-b.miles)
    .filter(x=>{const mk=byId.get(x.id).marketId;if(seen.has(mk))return false;seen.add(mk);return true;}).slice(0,n).map(x=>x.id);
}
function makeLeague(r){
  const owners=Object.fromEntries(clubs.map(t=>[t.id,{name:personName(r),style:OWNER_STYLES[randInt(r,3)],
    tradition:round2(r()-.5),subsidy:round2(r()*1.2-.6),sponsorAffinity:round2(r()*.6-.3),relation:randInt(r,26)-5,memory:[]}]));
  const markets=Object.fromEntries(OPEN_MARKETS.map(m=>{
    const holder=INITIAL_RIGHTS[m.id],second=nearestClubs(m.id,3).find(id=>id!==holder);
    return [m.id,{holder,fee:round1(1.5+randInt(r,6)*.5),signedSeason:0,fans:{[holder]:45+randInt(r,16),[second]:20+randInt(r,16)}}];
  }));
  return {owners,markets,contest:null,meeting:null,news:[],promises:[],planeNoted:false};
}
const adValue=(marketId,share)=>round1(share/100*openMarket(marketId).metro*4);
const holdsOpenMarket=(S,clubId)=>Object.values(S.league.markets).some(m=>m.holder===clubId);
function remember(S,clubId,text,delta){
  const o=S.league.owners[clubId],s=cur(S);
  o.relation=Math.max(-100,Math.min(100,o.relation+delta));
  o.memory.push({season:s.number,week:s.tick,text,delta});
}
function news(S,text){const s=cur(S);S.league.news.push({season:s.number,week:s.tick,text});}

// The rights fight starts once the owner has a club.
function ensureContest(S){
  if(!S.club||S.league.contest)return;
  const s=cur(S),home=clubCoords(S.club);
  const target=OPEN_MARKETS.filter(m=>S.league.markets[m.id].holder!==S.club)
    .sort((a,b)=>milesBetween(home,[a.lat,a.lon])-milesBetween(home,[b.lat,b.lon]))[0];
  const M=S.league.markets[target.id];
  if(!(S.club in M.fans))M.fans[S.club]=8;
  const deadline=s.tick+4;
  S.league.contest={marketId:target.id,holder:M.holder,deadlineWeek:deadline,status:'open',bid:null,lobbied:false};
}
function stationRange(S){
  const C=S.league.contest,M=S.league.markets[C.marketId],base=adValue(C.marketId,M.fans[C.holder]??40);
  return [round1(Math.max(1,base*.8)),round1(base*1.3)];
}
function submitBid(S,annual,years,lobby){
  const C=S.league.contest,s=cur(S);
  if(!C||C.status!=='open'||s.tick>=C.deadlineWeek)return 'closed';
  if(!(annual>=1&&annual<=12)||![3,5,7].includes(years))return 'invalid';
  C.bid={annual:round1(annual),years};
  if(lobby&&!C.lobbied){
    C.lobbied=true;
    learn(S,{kind:'stationVisit',marketId:C.marketId},['owner','president','station']);
  }
  return 'ok';
}
function withdrawBid(S){const C=S.league.contest;if(C?.status==='open')C.bid=null;}

// Kickoff windows decide whether two clubs' games compete for the same audience.
function slotFor(weekIndex,g){
  let h=weekIndex*31+7;
  for(const ch of g.home)h=(h*33+ch.charCodeAt(0))%9973;
  const v=h%7;
  return v<3?'early':v<6?'late':'night';
}
function gameOf(S,weekIndex,clubId){return cur(S).weeks[weekIndex]?.find(g=>g.home===clubId||g.away===clubId)??null;}
// Who a market sees in a given week.
function coverage(S,marketId,weekIndex){
  const M=S.league.markets[marketId],H=M.holder,hg=H&&gameOf(S,weekIndex,H),hs=hg&&slotFor(weekIndex,hg);
  return Object.keys(M.fans).map(id=>{
    const g=gameOf(S,weekIndex,id);
    if(!g)return {id,slot:null,airs:false};
    const slot=slotFor(weekIndex,g);
    return {id,slot,airs:id===H||!hg||slot!==hs};
  });
}
function coverageText(S,weekIndex){
  const C=S.league.contest;if(!C)return '';
  if(weekIndex>=cur(S).weeks.length)return 'No games until next season.';
  const M=S.league.markets[C.marketId],name=openMarket(C.marketId).name,rows=coverage(S,C.marketId,weekIndex);
  const me=rows.find(x=>x.id===S.club),H=M.holder,them=rows.find(x=>x.id===H);
  if(!me?.slot)return 'You are off that week.';
  if(H===S.club)return 'Your game airs in '+name+' in the '+me.slot+' window.';
  if(!them?.slot)return byId.get(H).market+' is off, so your game airs in '+name+'.';
  return me.airs?'Both games air in '+name+': '+byId.get(H).market+' '+them.slot+', yours '+me.slot+'.':
    'Both games are in the '+me.slot+' window, so '+name+' sees '+byId.get(H).market+', not you.';
}

// Runs after each played week.
function processLeague(S,r,wi=null){
  ensureContest(S);
  const L=S.league,s=cur(S);
  // Fans follow what they can watch, in weeks with regular-season games.
  if(wi!==null)for(const [id,M] of Object.entries(L.markets)){
    for(const row of coverage(S,id,wi)){
      if(!row.slot)continue;
      const growth=row.id===M.holder?.35:row.airs?.08:0;
      const other=100-Object.values(M.fans).reduce((a,b)=>a+b,0);
      M.fans[row.id]=round2(M.fans[row.id]+Math.min(growth,Math.max(0,other-5)));
    }
  }
  // Other owners hear about a personally funded plane through the finance committee.
  if(!L.planeNoted&&S.stadium.knowledge.some(f=>f.kind==='ownerFunding'&&f.project==='plane'&&f.knownBy.includes('league'))){
    L.planeNoted=true;
    for(const [id,o] of Object.entries(L.owners))if(id!==S.club&&o.subsidy<-.3)remember(S,id,'You paid for your team plane personally. Their players still fly charter.',-6);
  }
  const C=L.contest;
  if(C&&C.status==='open'&&s.tick>=C.deadlineWeek)decideContest(S,r);
  const V=L.meeting;
  if(V&&V.status==='scheduled'&&s.tick>=V.week)resolveVote(S);
}
function decideContest(S,r){
  const L=S.league,C=L.contest,M=L.markets[C.marketId],name=openMarket(C.marketId).name,rival=C.holder,ro=L.owners[rival];
  const [lo,hi]=stationRange(S);
  const rivalBid={annual:round1(lo+(hi-lo)*(.25+r()*.6)*(ro.style==='maverick'?1.1:1)),years:5};
  const score=(clubId,b)=>b.annual+b.years*.15+(M.fans[clubId]??0)*.03+(clubId===rival?.4:0)+(clubId===S.club&&C.lobbied?.8:0);
  C.rivalBid=rivalBid;
  const won=!!C.bid&&score(S.club,C.bid)>score(rival,rivalBid);
  C.status='decided';C.winner=won?S.club:rival;
  if(won){
    Object.assign(M,{holder:S.club,fee:C.bid.annual,signedSeason:cur(S).number});
    remember(S,rival,'You took the '+name+' broadcast rights from them.',-25);
    record(S,'rightsWon',{marketId:C.marketId,marketName:name,rival,bid:C.bid,rivalBid});
    news(S,teamName(S.club)+' win '+name+' TV rights from '+teamName(rival));
  }else if(C.bid){
    M.fee=rivalBid.annual;
    remember(S,rival,'You bid against them for '+name+'.',-5);
    record(S,'rightsLost',{marketId:C.marketId,marketName:name,rival,bid:C.bid,rivalBid});
    news(S,teamName(rival)+' hold on to '+name+' after a bidding fight with '+byId.get(S.club).market);
  }else{
    M.fee=rivalBid.annual;
    record(S,'rightsRenewed',{marketId:C.marketId,marketName:name,rival});
  }
  scheduleMeeting(S);
}
// The rival owner takes the fight to the owners' room.
function scheduleMeeting(S){
  const s=cur(S),L=S.league,C=L.contest;
  if(!C.bid)return; // no fight, nothing to take to the owners
  const week=s.tick+3;
  L.meeting={week,sponsor:C.holder,marketId:C.marketId,status:'scheduled',callsLeft:MEETING_CALLS,lobby:{},revealed:{},playerVote:null,
    reversal:C.winner===S.club};
  const name=openMarket(C.marketId).name,o=L.owners[C.holder];
  record(S,'meetingCalled',{sponsor:C.holder,owner:o.name,marketName:name,week,reversal:L.meeting.reversal});
  news(S,byId.get(C.holder).market+' owner '+o.name+' asks the league for a first-refusal rule on broadcast markets');
}
const playerOpposes=S=>S.league.meeting&&(S.league.meeting.reversal||S.league.contest?.bid!=null);
function ownerLean(S,clubId){
  const L=S.league,V=L.meeting,o=L.owners[clubId];
  if(clubId===V.sponsor)return 9;
  let x=.2+o.tradition*.6+o.sponsorAffinity+(holdsOpenMarket(S,clubId)?.5:0);
  x+=(playerOpposes(S)?-1:1)*o.relation/100*.9;
  return round2(x+(V.lobby[clubId]??0));
}
const leanLabel=x=>x>.15?'Leaning yes':x<-.15?'Leaning no':'Undecided';
function callOwner(S,clubId,promise){
  const L=S.league,V=L.meeting,o=L.owners[clubId];
  if(!V||V.status!=='scheduled'||!o||clubId===S.club||clubId===V.sponsor)return 'unavailable';
  if(V.callsLeft<=0)return 'noCalls';
  V.callsLeft--;
  const toward=playerOpposes(S)?-1:1;
  let shift=o.relation>=10?.2:o.relation<=-10?-.1:.1;
  if(promise){
    shift=.6;
    L.promises.push({clubId,season:cur(S).number,week:cur(S).tick,text:'Back their next proposal at a league meeting'});
    remember(S,clubId,'You promised to back their next proposal.',5);
  }
  V.lobby[clubId]=round2((V.lobby[clubId]??0)+toward*shift);
  V.revealed[clubId]=ownerLean(S,clubId);
  return 'ok';
}
function setPlayerVote(S,vote){const V=S.league.meeting;if(V?.status==='scheduled'&&['yes','no'].includes(vote))V.playerVote=vote;}
function resolveVote(S){
  const L=S.league,V=L.meeting,name=openMarket(V.marketId).name,sponsor=V.sponsor,o=L.owners[sponsor];
  const mine=V.playerVote??(playerOpposes(S)?'no':'yes');
  const votes=Object.fromEntries(clubs.map(t=>[t.id,t.id===S.club?mine:ownerLean(S,t.id)>0?'yes':'no']));
  const yes=Object.values(votes).filter(v=>v==='yes').length,passed=yes>=VOTE_THRESHOLD;
  Object.assign(V,{status:'decided',votes,yes,passed});
  let lostMarket=false;
  if(passed&&V.reversal&&L.markets[V.marketId].holder===S.club){
    Object.assign(L.markets[V.marketId],{holder:sponsor,signedSeason:cur(S).number});
    lostMarket=true;
  }
  if(passed)remember(S,sponsor,'The owners backed their first-refusal rule.',4);
  else if(mine==='no')remember(S,sponsor,'You helped block their first-refusal rule.',-10);
  for(const t of clubs)if(t.id!==S.club&&t.id!==sponsor&&votes[t.id]===mine&&V.lobby[t.id])remember(S,t.id,'Voted with you on first refusal after your call.',2);
  record(S,'voteResult',{sponsor,owner:o.name,marketName:name,yes,no:32-yes,passed,lostMarket,mine});
  news(S,passed?'Owners approve first-refusal rule '+yes+'–'+(32-yes)+(lostMarket?'; '+name+' returns to '+byId.get(sponsor).market:''):
    'First-refusal rule falls short, '+yes+'–'+(32-yes)+(V.reversal?'; '+byId.get(S.club).market+' keeps '+name:''));
}

// Words for league events.
function leagueEventText(e){
  const rival=e.rival&&teamName(e.rival);
  switch(e.type){
    case 'rightsWon':return 'The '+e.marketName+' station took our offer: $'+e.bid.annual+'M a year for '+e.bid.years+' years against '+possessive(rival)+' $'+e.rivalBid.annual+'M. Our games get preferred coverage there. Expect to hear from their owner.';
    case 'rightsLost':return rival+' kept '+e.marketName+'. They offered $'+e.rivalBid.annual+'M a year against our $'+e.bid.annual+'M. They know we tried.';
    case 'rightsRenewed':return rival+' renewed the '+e.marketName+' broadcast rights unopposed.';
    case 'meetingCalled':return e.owner+' has called a league vote after '+weekLabel(e.week)+' on a first-refusal rule for broadcast markets.'+(e.reversal?' It would apply to deals signed this season, which means '+e.marketName+'.':'');
    case 'voteResult':return 'The owners voted '+e.yes+'–'+e.no+' on '+possessive(e.owner)+' first-refusal rule. It needed '+VOTE_THRESHOLD+'. '+(e.passed?'It passed.'+(e.lostMarket?' '+e.marketName+' goes back to '+byId.get(e.sponsor).market+'.':''):'It failed.')+' You voted '+e.mine+'.';
  }
  return '';
}

// The market map: one Voronoi cell per market city. Fill is the controlling
// club's primary color, border its secondary. Shared home markets are striped.
// ---------------------------------------------------------------------------
const MAP={w:760,h:590,lon0:-128.5,lat0:53.5,k:.788};
const mapScale=MAP.w/(64*MAP.k);
const project=(lat,lon)=>[(lon-MAP.lon0)*MAP.k*mapScale,(MAP.lat0-lat)*mapScale];
// Rough coastline and northern edge of the playable map, as [lon, lat].
const OUTLINE=[[-124.7,48.4],[-124.1,46.2],[-124.5,42.8],[-124.2,40.4],[-122.5,37.7],[-120.6,34.6],[-118.4,33.9],[-117.1,32.5],
  [-116.6,31.5],[-115.8,30.3],[-114.2,28.0],[-112.1,24.8],[-109.9,22.9],[-106.4,23.2],[-105.3,20.6],[-104.3,19.1],[-101.0,17.9],
  [-98.0,16.3],[-94.0,16.0],[-92.2,14.6],[-91.4,17.3],[-89.1,17.9],[-87.5,18.5],[-87.0,21.5],[-90.4,21.2],[-90.5,19.5],[-92.5,18.6],
  [-94.5,18.1],[-96.1,19.2],[-97.2,21.0],[-97.7,23.5],[-97.2,25.9],[-97.4,27.8],[-94.8,29.3],[-93.8,29.7],[-91.5,29.5],[-89.4,29.0],
  [-89.6,30.2],[-88.0,30.4],[-85.4,29.7],[-84.0,30.1],[-82.8,28.0],[-81.8,26.1],[-80.9,25.1],[-80.1,25.8],[-80.6,28.4],[-81.4,30.5],
  [-81.0,32.0],[-79.0,33.6],[-76.6,34.7],[-75.5,35.3],[-76.0,37.0],[-75.0,38.5],[-74.0,40.4],[-72.0,41.0],[-70.0,41.6],[-70.8,42.6],
  [-70.2,43.7],[-67.0,44.8],[-65.8,44.3],[-63.6,44.6],[-61.0,45.6],[-64.8,48.8],[-68.5,49.0],[-66.5,50.2],[-60.0,50.3],[-70,52],
  [-80,52],[-90,53],[-100,53],[-115,53],[-123,53],[-127.9,50.6],[-125.3,48.8],[-123.4,48.3]];
function mapPoints(S){
  const home=[...new Set(clubs.map(t=>t.marketId))].map(mk=>{
    const ids=clubs.filter(t=>t.marketId===mk).map(t=>t.id),[x,y]=project(...HOME_COORDS[mk]);
    return {id:mk,x,y,holders:ids,label:byId.get(ids[0]).market,open:false};
  });
  const open=OPEN_MARKETS.map(m=>{const [x,y]=project(m.lat,m.lon),h=S.league.markets[m.id].holder;return {id:m.id,x,y,holders:h?[h]:[],label:m.name,open:true};});
  return [...home,...open];
}
function clipHalfPlane(poly,a,b,c){ // keep a*x + b*y <= c
  const out=[];
  for(let i=0;i<poly.length;i++){
    const P=poly[i],Q=poly[(i+1)%poly.length],fp=a*P[0]+b*P[1]-c,fq=a*Q[0]+b*Q[1]-c;
    if(fp<=0)out.push(P);
    if((fp<0&&fq>0)||(fp>0&&fq<0)){const t=fp/(fp-fq);out.push([P[0]+t*(Q[0]-P[0]),P[1]+t*(Q[1]-P[1])]);}
  }
  return out;
}
function voronoiCells(points,w,h){
  return points.map((p,i)=>points.reduce((poly,q,j)=>i===j?poly:
    clipHalfPlane(poly,q[0]-p[0],q[1]-p[1],(q[0]*q[0]+q[1]*q[1]-p[0]*p[0]-p[1]*p[1])/2),[[0,0],[w,0],[w,h],[0,h]]));
}
function drawMap(canvas,S){
  const ctx=canvas.getContext('2d'),dpr=window.devicePixelRatio||1;
  canvas.width=MAP.w*dpr;canvas.height=MAP.h*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const css=getComputedStyle(document.documentElement),token=(n,f)=>css.getPropertyValue(n).trim()||f;
  const fg=token('--fg','#192d36'),bg=token('--bg','#f5f3eb'),neutral=token('--rule','#c4ccc5');
  const pts=mapPoints(S),cells=voronoiCells(pts.map(p=>[p.x,p.y]),MAP.w,MAP.h);
  const land=new Path2D();
  OUTLINE.forEach(([lon,lat],i)=>{const [x,y]=project(lat,lon);i?land.lineTo(x,y):land.moveTo(x,y);});
  land.closePath();
  const stripes=(a,b)=>{
    const c=document.createElement('canvas');c.width=c.height=14;const g=c.getContext('2d');
    g.fillStyle=a;g.fillRect(0,0,14,14);g.strokeStyle=b;g.lineWidth=5;
    g.beginPath();g.moveTo(-3,3);g.lineTo(3,-3);g.moveTo(0,14);g.lineTo(14,0);g.moveTo(11,17);g.lineTo(17,11);g.stroke();
    return ctx.createPattern(c,'repeat');
  };
  ctx.clearRect(0,0,MAP.w,MAP.h);
  ctx.save();ctx.clip(land);
  cells.forEach((cell,i)=>{
    const teams=pts[i].holders.map(id=>byId.get(id));
    ctx.beginPath();cell.forEach(([x,y],k)=>k?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();
    ctx.fillStyle=teams.length>1?stripes(color(teams[0].primary),color(teams[1].primary)):teams[0]?color(teams[0].primary):neutral;
    ctx.fill();
    ctx.strokeStyle=teams[0]?color(teams[0].secondary):fg;ctx.lineWidth=2.5;ctx.stroke();
  });
  ctx.restore();
  ctx.strokeStyle=fg;ctx.lineWidth=1.5;ctx.stroke(land);
  const contested=S.league.contest?.status==='open'?S.league.contest.marketId:null,home=S.club&&byId.get(S.club).marketId;
  ctx.font='600 11px '+token('--body','sans-serif');ctx.textBaseline='middle';
  for(const p of pts){
    ctx.beginPath();ctx.arc(p.x,p.y,p.open?4:3,0,Math.PI*2);ctx.fillStyle=p.open?bg:fg;ctx.fill();ctx.strokeStyle=p.open?fg:bg;ctx.lineWidth=1.5;ctx.stroke();
    if(p.id===contested||p.id===home){ctx.beginPath();ctx.setLineDash(p.id===contested?[3,3]:[]);ctx.arc(p.x,p.y,9,0,Math.PI*2);ctx.strokeStyle=fg;ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([]);}
    if(p.open||p.id===home){
      ctx.lineWidth=3;ctx.strokeStyle=bg;ctx.strokeText(p.label,p.x+8,p.y-9);ctx.fillStyle=fg;ctx.fillText(p.label,p.x+8,p.y-9);
    }
  }
}
