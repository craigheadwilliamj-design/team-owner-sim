// ---------------------------------------------------------------------------
// The calendar
//
// Every season runs on one clock, cur(S).tick:
//   1–18   regular-season weeks (completed tracks the schedule)
//   19–22  Wild Card, Divisional, Conference Championships, Championship Game
//   23–50  February Week 1 through August Week 4
// Advancing from August Week 4 opens the next season at tick 0. Deadlines are
// stored as ticks and carried into the new season.
// ---------------------------------------------------------------------------
const SEASON_TICKS=50;
const ROUND_NAMES=['Wild Card round','Divisional round','Conference Championships','Championship Game'];
const OFF_MONTHS=['February','March','April','May','June','July','August'];
const MILESTONES={review:23,leagueYear:28,draft:34,otas:36,minicamp:40,camp:46,cuts:50};
const now=(S=save)=>cur(S).tick;
function weekLabel(t){
  if(t<=0)return 'the preseason';
  if(t<=REGULAR_WEEKS)return 'Week '+t;
  if(t<=22)return 'the '+ROUND_NAMES[t-19];
  if(t<=SEASON_TICKS){const i=t-23;return OFF_MONTHS[Math.floor(i/4)]+' Week '+(i%4+1);}
  return 'next season';
}
function shortLabel(t){
  if(t<=0)return 'Preseason';
  if(t<=REGULAR_WEEKS)return 'W'+t;
  if(t<=22)return ['Wild Card','Divisional','Conf. Champ.','Championship'][t-19];
  const i=t-23;return OFF_MONTHS[Math.floor(i/4)].slice(0,3)+' W'+(i%4+1);
}
const capital=s=>s[0].toUpperCase()+s.slice(1);
function eventWhen(S,e){
  const prefix=e.season!==cur(S).number?'Season '+e.season+' · ':'';
  return prefix+(e.week?'After '+shortLabel(e.week):'Preseason');
}

// ---- Postseason ------------------------------------------------------------
function seedsFor(S){
  const table=standings(S),pct=r=>(r.w+.5*r.t)/(r.w+r.l+r.t||1);
  const better=(a,b)=>pct(b)-pct(a)||(b.pf-b.pa)-(a.pf-a.pa)||teamName(a.id).localeCompare(teamName(b.id));
  const seeds={};
  for(const conference of ['Charter','Union']){
    const groupsHere=table.filter(rows=>byId.get(rows[0].id).conference===conference);
    const winners=groupsHere.map(rows=>rows[0]).sort(better);
    const rest=groupsHere.flatMap(rows=>rows.slice(1)).sort(better).slice(0,3);
    seeds[conference]=[...winners,...rest].map(r=>r.id);
  }
  return seeds;
}
function postseasonGames(P){
  const seedOf=id=>{for(const c of ['Charter','Union']){const i=P.seeds[c].indexOf(id);if(i>=0)return i;}return 99;};
  const confOf=id=>byId.get(id).conference;
  const r=P.rounds.length,game=(a,b)=>seedOf(a)<=seedOf(b)?{home:a,away:b,score:null}:{home:b,away:a,score:null};
  const winners=round=>P.rounds[round].games.map(g=>g.score[0]>g.score[1]?g.home:g.away);
  if(r===0)return ['Charter','Union'].flatMap(c=>{const s=P.seeds[c];return [game(s[1],s[6]),game(s[2],s[5]),game(s[3],s[4])];});
  if(r===1)return ['Charter','Union'].flatMap(c=>{
    const alive=[P.seeds[c][0],...winners(0).filter(id=>confOf(id)===c)].sort((a,b)=>seedOf(a)-seedOf(b));
    return [game(alive[0],alive[3]),game(alive[1],alive[2])];
  });
  if(r===2)return ['Charter','Union'].map(c=>{const w=winners(1).filter(id=>confOf(id)===c);return game(w[0],w[1]);});
  const [a,b]=winners(2);return [{...game(a,b),neutral:true}];
}
// Playoff games cannot end tied: overtime continues until someone scores more.
function simulatePlayoff(home,away,neutral,r){
  const result=simulate(home,away,r,neutral);
  let [h,a]=result.score,ot=!!result.ot;
  for(let n=0;h===a&&n<40;n++){
    ot=true;
    if(n%2===0)h+=drive(home,away,!neutral,r);else a+=drive(away,home,false,r);
  }
  if(h===a)h+=3;
  return {score:[h,a],ot};
}
function playPostseasonRound(S,r){
  const s=cur(S);
  s.postseason??={seeds:seedsFor(S),rounds:[],champion:null};
  const P=s.postseason,round=P.rounds.length;
  const units=Object.fromEntries(clubs.map(t=>[t.id,clubUnits(S,t.id)]));
  const games=postseasonGames(P);
  for(const g of games){
    const result=simulatePlayoff(units[g.home],units[g.away],!!g.neutral,r);
    g.score=result.score;if(result.ot)g.ot=true;
  }
  P.rounds.push({name:ROUND_NAMES[round],games});
  creditRecords(S,games);
  s.tick++;
  const mine=games.find(g=>g.home===S.club||g.away===S.club);
  if(mine)postseasonFinance(S,mine);
  if(round===3){
    const g=games[0];P.champion=g.score[0]>g.score[1]?g.home:g.away;
    news(S,teamName(P.champion)+' win the Championship Game, '+Math.max(...g.score)+'–'+Math.min(...g.score));
  }
  if(mine)record(S,'playoffResult',{round,home:mine.home,away:mine.away,score:mine.score,ot:!!mine.ot,won:(mine.score[0]>mine.score[1])===(mine.home===S.club)});
  afterTick(S,r,{games,units});
}
function postseasonFinance(S,g){
  const F=S.finance,lines=Object.fromEntries(Object.keys(LINE_LABELS).map(k=>[k,0]));
  if(g.home===S.club){const G=gate(S,S.club);Object.assign(lines,{tickets:G.tickets,premium:G.premium,concessions:G.concessions,gameDay:-2.5,visitorShare:-.34*G.tickets});}
  else if(!g.neutral)lines.visitorShare=.34*gate(S,g.home).tickets;
  for(const k in lines)lines[k]=round2(lines[k]);
  const result=sumLines(lines);
  F.clubCash=round2(F.clubCash+result);
  F.ledger.push({season:cur(S).number,week:now(S),lines,result,ownerIncome:0,ownerOperating:0,borrowed:0,playoff:true});
}
function playoffStatus(S,id){
  const P=cur(S).postseason;
  if(!P)return null;
  const seed=seedIndex(P.seeds,id);
  if(seed<0)return {seed,alive:false,finish:'Missed the playoffs'};
  for(const [i,round] of P.rounds.entries()){
    const g=round.games.find(x=>x.home===id||x.away===id);
    if(g&&(g.score[0]>g.score[1])!==(g.home===id))return {seed,alive:false,finish:i===3?'Lost the Championship Game':'Lost in the '+ROUND_NAMES[i]};
  }
  if(P.champion===id)return {seed,alive:false,finish:'Won the Championship Game',champion:true};
  return {seed,alive:true};
}
function seedIndex(seeds,id){for(const c of ['Charter','Union']){const i=seeds[c].indexOf(id);if(i>=0)return i;}return -1;}

// ---- Players: development, retirement, cuts --------------------------------
const lateBloomers=new Set(['K','P','LS','QB']);
function developPlayers(S,r){
  const retired=[],risers=[];
  for(const t of clubs){
    S.rosters[t.id]=S.rosters[t.id].filter(p=>{
      p.age++;
      const grace=lateBloomers.has(p.pos)?3:0,age=p.age-grace;
      const quits=age>=36||(age>=34&&r()<.45)||(age>=31&&p.rating<55&&r()<.4);
      if(quits){if(t.id===S.club)retired.push(snap(p));S.cap.dead[t.id]=round2((S.cap.dead[t.id]??0)+p.contract.prorated*p.contract.yearsLeft);return false;}
      const before=p.rating;
      if(age<=26)p.rating+=Math.max(0,Math.round(((p.potential??p.rating)-p.rating)*(.14+r()*.28)*devFactor(S,t.id)));
      else if(age<=29)p.rating+=randInt(r,3)-1;
      else if(age<=32)p.rating-=1+randInt(r,3);
      else p.rating-=2+randInt(r,4);
      p.rating=Math.max(40,Math.min(99,p.rating));
      if(t.id===S.club&&p.rating-before>=4)risers.push({...snap(p),gain:p.rating-before});
      return true;
    });
  }
  if(S.practice)for(const t of clubs)for(const p of S.practice[t.id]){p.age++;if(p.age<=26)p.rating=Math.min(99,p.rating+Math.max(0,Math.round(((p.potential??p.rating)-p.rating)*(.14+r()*.28)*devFactor(S,t.id))));}
  return {retired,risers:risers.sort((a,b)=>b.gain-a.gain).slice(0,3)};
}
// Camp work: young players inch toward their potential.
function campWork(S,r){
  for(const t of clubs){const k=.35*devFactor(S,t.id);for(const p of [...S.rosters[t.id],...(S.practice?.[t.id]??[])])if(p.age<=25&&p.rating<(p.potential??0)&&r()<k)p.rating++;}
}
// Keep the best at each position up to the roster slots, then the best of the rest to 53.
function finalCuts(S,r){
  let mine=[];
  for(const t of clubs){
    const roster=S.rosters[t.id].filter(p=>!p.ir),keep=new Set();
    for(const [pos,count] of positions)roster.filter(p=>p.pos===pos).sort((a,b)=>b.rating-a.rating).slice(0,count).forEach(p=>keep.add(p));
    roster.filter(p=>!keep.has(p)).sort((a,b)=>b.rating-a.rating).slice(0,Math.max(0,53-keep.size)).forEach(p=>keep.add(p));
    const cut=roster.filter(p=>!keep.has(p));
    if(t.id===S.club)mine=cut.map(snap);
    for(const p of cut)releasePlayer(S,t.id,p.id);
    if(S.practice)fillPractice(S,t.id,r,cut);
  }
  return mine;
}

// ---- The draft ---------------------------------------------------------------
const COLLEGES=['Allegheny State','Bayou Tech','Cascade','Central Prairie','Delta A&M','Eastern Ridge','Great Lakes Tech','Gulf State',
  'High Plains','Iron Range','Keystone Valley','Lakeshore','Magnolia','North Woods','Ozark State','Palmetto','Piedmont','Red River',
  'Sierra Tech','Tidewater','Twin Rivers','Western Plateau'];
const positionWeights=positions.flatMap(([pos,count])=>Array(count).fill(pos));
// How boards value positions: a great kicker is still not a first-round grade.
const DRAFT_POSITION_VALUE={QB:4,DE:2,OT:2,WR:1,CB:1,K:-14,P:-14,LS:-18};
function makeDraft(r,season){
  const prospects=Array.from({length:400},(_,i)=>{
    const pos=positionWeights[randInt(r,positionWeights.length)];
    const rating=44+randInt(r,20)+(i<48?randInt(r,12):0);
    const potential=Math.min(97,rating+5+randInt(r,22)+(i<48?randInt(r,6):0));
    return {id:'d'+season+'-'+(i+1),name:personName(r),pos,college:COLLEGES[randInt(r,COLLEGES.length)],age:21+randInt(r,3),
      rating,potential,grade:Math.round(.55*potential+.45*rating+randInt(r,9)-4+(DRAFT_POSITION_VALUE[pos]??0))};
  }).sort((a,b)=>b.grade-a.grade);
  return {season,status:'scouting',prospects,order:[],pick:0,picks:[]};
}
function draftOrder(S){
  const s=cur(S),table=standings(S).flat(),P=s.postseason;
  const pct=id=>{const r=table.find(x=>x.id===id);return {p:(r.w+.5*r.t)/(r.w+r.l+r.t||1),d:r.pf-r.pa};};
  const rank=id=>{
    const st=playoffStatus(S,id);
    if(!P||st.seed<0)return 0;
    if(st.champion)return 5;
    if(st.finish==='Lost the Championship Game')return 4;
    return 1+ROUND_NAMES.findIndex(n=>st.finish==='Lost in the '+n);
  };
  const order=clubs.map(t=>t.id).sort((a,b)=>rank(a)-rank(b)||pct(a).p-pct(b).p||pct(a).d-pct(b).d||a.localeCompare(b));
  return [1,2,3,4,5,6,7].flatMap(round=>order.map((origin,i)=>({overall:(round-1)*32+i+1,round,origin,
    owner:S.picks.find(p=>p.origin===origin&&p.round===round)?.owner??origin})));
}
function startDraft(S){
  const D=S.draft;
  if(!D||D.status!=='scouting')return;
  D.order=draftOrder(S);D.status='live';D.pick=0;
  const mine=D.order.filter(x=>x.owner===S.club).map(x=>x.overall);
  record(S,'draftOpen',{picks:mine});
  news(S,'The draft opens with '+teamName(D.order[0].owner)+' on the clock');
}
const draftAvailable=D=>{const taken=new Set(D.picks.map(x=>x.prospectId));return D.prospects.filter(p=>!taken.has(p.id));};
function needAt(S,clubId,pos){
  const target=positions.find(x=>x[0]===pos)[1];
  return target-S.rosters[clubId].filter(p=>p.pos===pos&&p.age<=31).length;
}
function bestFor(S,clubId,pool){
  const rebuild=S.staff?.clubs&&approachFor(S,clubId)==='rebuild',focus=S.staff?.clubs?focusFor(S,clubId):[];
  return pool.slice(0,70).map(p=>{const need=needAt(S,clubId,p.pos);
    return {p,score:perceivedGrade(S,clubId,p)+(need>0?(rebuild?2:4)*need:-5)+(focus.includes(p.pos)?6:0)+(rebuild&&p.age<=21?2:0)};})
    .sort((a,b)=>b.score-a.score)[0]?.p;
}
function makePick(S,prospectId,by){
  const D=S.draft,slot=D.order[D.pick];
  if(!slot)return false;
  const p=draftAvailable(D).find(x=>x.id===prospectId);
  if(!p)return false;
  D.picks.push({overall:slot.overall,round:slot.round,club:slot.owner,origin:slot.origin,prospectId:p.id,name:p.name,pos:p.pos,college:p.college,by});
  const terms=rookieTerms(S,slot.overall);
  S.rosters[slot.owner].push({id:'r'+D.season+'-'+slot.overall,name:p.name,pos:p.pos,rating:p.rating,age:p.age,potential:p.potential,
    drafted:{season:D.season,round:slot.round,overall:slot.overall,college:p.college},contract:{...makeContract(S,terms,'rookie'),option:slot.round===1}});
  if(slot.owner===S.club)payBonus(S,terms.bonus,'club');
  D.pick++;
  if(D.pick>=D.order.length)completeDraft(S);
  return true;
}
function aiPick(S){
  const D=S.draft,slot=D.order[D.pick];
  return makePick(S,bestFor(S,slot.owner,draftAvailable(D)).id,slot.owner===S.club?'gm':'club');
}
function ownerPick(S,prospectId){
  const D=S.draft;
  if(D?.status!=='live'||D.order[D.pick]?.owner!==S.club)return 'notYourPick';
  return makePick(S,prospectId,'owner')?'ok':'unavailable';
}
function simToMyPick(S){
  const D=S.draft;
  while(D.status==='live'&&D.order[D.pick].owner!==S.club)aiPick(S);
}
function gmFinishDraft(S,unattended){
  const D=S.draft;
  if(D?.status!=='live')return;
  if(unattended)record(S,'draftUnattended',{picks:D.order.length-D.picks.length});
  while(D.status==='live')aiPick(S);
}
function completeDraft(S){
  const D=S.draft;
  D.status='done';
  // Undrafted free agents fill camp rosters to 60, needs first.
  const pool=draftAvailable(D);
  const campOrder=[...new Set(D.order.map(x=>x.origin))];
  for(let pass=0;pass<8;pass++)for(const id of campOrder){
    if(S.rosters[id].length>=60||!pool.length)continue;
    const need=positions.map(([pos])=>pos).find(pos=>needAt(S,id,pos)>0);
    const i=need?pool.findIndex(p=>p.pos===need):0;
    const p=pool.splice(i<0?0:i,1)[0];
    S.rosters[id].push({id:'u'+D.season+'-'+p.id.split('-')[1],name:p.name,pos:p.pos,rating:p.rating,age:p.age,potential:p.potential,undrafted:{season:D.season,college:p.college},contract:makeContract(S,minimumTerms(S,3),'minimum')});
  }
  S.draftHistory.push({season:D.season,picks:D.picks.map(x=>({overall:x.overall,round:x.round,club:x.club,name:x.name,pos:x.pos,college:x.college}))});
  S.picks=defaultPicks();
  const mine=D.picks.filter(x=>x.club===S.club);
  record(S,'draftDone',{picks:mine.map(x=>({overall:x.overall,round:x.round,name:x.name,pos:x.pos,college:x.college,by:x.by}))});
  const first=D.picks[0];
  news(S,teamName(first.club)+' take '+first.pos+' '+first.name+' of '+first.college+' first overall');
}

// ---- Advancing the clock ---------------------------------------------------
function afterTick(S,r,{games=null,units=null,regularIndex=null}={}){
  if(games&&units){
    finishMedicalWeek(S,units,r,games);
    if(S.practice){manageRoster(S,r);poachPractice(S,r);}
    const hc=S.club&&S.staff?.clubs?.[S.club]?.hc;if(hc)hc.trust=Math.min(80,(hc.trust??70)+.5);
  }
  else for(const p of Object.values(S.rosters).flat())if(p.out&&--p.out<=0)delete p.out;
  if(S.offer){record(S,'quoteExpired',{seller:S.offer.seller});S.offer=null;}
  expireProposals(S);
  processTradeTalk(S,r);
  autoHire(S);
  processStadium(S,r);
  processLeague(S,r,regularIndex);
  processFreeAgency(S,r);
  if(regularIndex!==null)processFinance(S);
  processProjects(S);
  distributeToOwner(S);
  processNaming(S);
}
// GM proposals last one week; re-signing proposals last until the deal would expire.
function expireProposals(S){
  if(!S.staff?.proposals)return;
  S.staff.proposals=S.staff.proposals.filter(P=>{
    if(P.kind==='trade'||P.kind==='offer'){
      if(P.week>=now(S))return true;
      record(S,'tradeExpired',{text:P.kind==='trade'?'The chance to trade for '+P.pos+' '+P.name+' passed before you answered.':possessive(teamName(P.club))+' offer for '+P.pos+' '+P.name+' expired.'});
      return false;
    }
    const alive=P.kind==='fa'?P.week>=now(S)&&S.fa.pool.some(x=>x.id===P.playerId):S.rosters[S.club]?.some(x=>x.id===P.playerId&&x.contract.yearsLeft===1);
    if(!alive&&P.kind==='fa'&&P.week<now(S))record(S,'proposalExpired',{name:P.name});
    return alive;
  });
}
function distributeToOwner(S){
  const t=now(S),F=S.finance;
  if(t<=0||t%4!==0)return;
  const amount=round2(F.distributionAnnual*4/SEASON_TICKS);
  F.ownerCash=round2(F.ownerCash+amount);
  const entry=F.ledger.find(x=>x.season===cur(S).number&&x.week===t);
  if(entry)entry.ownerIncome=round2((entry.ownerIncome??0)+amount);
}
function offseasonWeek(S,r){
  const s=cur(S);
  // Leaving draft week: the GM finishes whatever is left.
  if(s.tick===MILESTONES.draft&&S.draft.status==='live')gmFinishDraft(S,true);
  s.tick++;
  const t=s.tick;
  if(t===MILESTONES.review){seasonReview(S);floorCheck(S);staffReview(S);carousel(S,r);}
  if(t>=MILESTONES.review&&t<=MILESTONES.leagueYear+2)fillOpenings(S,r);
  if(t===MILESTONES.leagueYear)newLeagueYear(S,r);
  if(t===MILESTONES.draft)startDraft(S);
  if(t===MILESTONES.otas){campWork(S,r);record(S,'calendarNote',{text:'OTAs are underway. The rookies are on the field with the veterans for the first time.'});}
  if(t===MILESTONES.minicamp){campWork(S,r);record(S,'calendarNote',{text:'Mandatory minicamp wrapped up. The coaches liked what they saw from the young players.'});}
  if(t===MILESTONES.camp){campWork(S,r);campWork(S,r);record(S,'calendarNote',{text:'Training camp is open. Position battles start now.'});}
  if(t===RESIGN_TICK)resignExpiring(S,r);
  if(t===MILESTONES.cuts){
    fillRosters(S,r);
    const cut=finalCuts(S,r);
    record(S,'finalCuts',{count:cut.length,names:cut.sort((a,b)=>b.rating-a.rating).slice(0,3)});
  }
  afterTick(S,r);
}
function seasonReview(S){
  const s=cur(S),P=s.postseason,row=standings(S).flat().find(x=>x.id===S.club);
  const st=S.club?playoffStatus(S,S.club):null;
  const entry={season:s.number,club:S.club,record:row?[row.w,row.l,row.t]:null,finish:st?.finish??(st?.alive?'Playoffs':'Missed the playoffs'),champion:P?.champion??null};
  S.history.push(entry);
  if(S.club)record(S,'seasonReview',entry);
}
function newLeagueYear(S,r){
  turnCapYear(S);
  staffYear(S);
  const {retired,risers}=developPlayers(S,r);
  for(const p of S.fa.pool)p.age++;
  for(const lease of Object.values(S.world.leases))lease.yearsLeft=Math.max(0,lease.yearsLeft-1);
  if(S.finance.naming.status==='signed')S.finance.naming.deal.years=Math.max(0,S.finance.naming.deal.years-1);
  // Lapsed stadium offers come back with fresh terms.
  const revived=[];
  for(const site of S.world.sites.filter(x=>x.status==='expired')){
    const m=marketById(S,site.marketId),k=SITE_KINDS[site.kind];
    Object.assign(site,{status:'open',publicOffer:round5((180+m.potential*4)*between(r,k.offer)),expiresWeek:now(S)+6+randInt(r,14),renewals:(site.renewals??0)+1});
    if(S.stadium.knowledge.some(f=>f.siteId===site.id))revived.push(site.name+' in '+m.name);
  }
  if(S.club)record(S,'leagueYear',{retired,risers,revived,leaseYears:S.world.leases[S.club].yearsLeft});
  news(S,'The new league year opens; '+Object.values(S.rosters).flat().filter(p=>p.age===22).length+' second-year players report');
}
function rollover(S,r){
  const s=cur(S),next=makeSeason(r,s.number+1);
  next.tick=0;
  next.ratings=Object.fromEntries(clubs.map(t=>{const u=personnel(S.rosters[t.id]);return [t.id,{offense:u.offense,defense:u.defense}];}));
  S.seasons.push(next);S.seasonIndex=S.seasons.length-1;
  const shift=x=>x-SEASON_TICKS;
  for(const site of S.world.sites)if(site.status==='open')site.expiresWeek=shift(site.expiresWeek);
  for(const st of S.stadium.studies)if(st.status==='underway')st.due=shift(st.due);
  if(S.finance.naming.status==='awaiting')S.finance.naming.expiresWeek=shift(S.finance.naming.expiresWeek);
  if(S.league.contest?.status==='open')S.league.contest.deadlineWeek=shift(S.league.contest.deadlineWeek);
  if(S.league.meeting?.status==='scheduled')S.league.meeting.week=shift(S.league.meeting.week);
  S.offer=null;
  if(S.depth){S.depth.overrides=0;S.depth.warned=false;}
  fillRosters(S,r);
  for(const t of clubs)comply(S,t.id,true); // after filling, so the opener is always cap-compliant
  prunePool(S);
  S.draft=makeDraft(r,next.number);
  news(S,'Season '+next.number+' kicks off');
  afterTick(S,r);
}
// One step of the clock, whatever the phase.
function advance(S){
  const s=cur(S),r=rngFor(S.rng);
  if(s.completed<s.weeks.length)return playWeek(S);
  if(s.tick<22)return playPostseasonRound(S,r);
  if(s.tick<SEASON_TICKS)return offseasonWeek(S,r);
  return rollover(S,r);
}
// Jump forward to a tick (or into next season with SEASON_TICKS+1). Nothing in between is skipped.
function jumpTo(S,target){
  const startSeason=cur(S).number;
  for(let guard=0;guard<80;guard++){
    if(target>SEASON_TICKS?cur(S).number>startSeason:now(S)>=target||cur(S).number>startSeason)return;
    advance(S);
  }
}
function jumpTargets(S){
  const t=now(S),n=cur(S).number;
  return [[REGULAR_WEEKS+1,'Playoffs: Wild Card round'],[22,'Championship Game'],[MILESTONES.review,'February Week 1 · season review'],
    [MILESTONES.leagueYear,'March Week 2 · new league year'],[MILESTONES.draft,'April Week 4 · draft'],[MILESTONES.otas,'May Week 2 · OTAs'],
    [MILESTONES.camp,'July Week 4 · training camp'],[MILESTONES.cuts,'August Week 4 · final cuts'],[SEASON_TICKS+1,'Season '+(n+1)+' opener']]
    .filter(([tick])=>tick>t);
}
function advanceLabel(S){
  const s=cur(S),t=s.tick;
  if(s.completed<s.weeks.length)return 'Advance week '+(s.completed+1)+' →';
  if(t<22)return 'Play the '+ROUND_NAMES[t-18]+' →';
  if(t<SEASON_TICKS)return 'Advance to '+weekLabel(t+1)+' →';
  return 'Open season '+(s.number+1)+' →';
}

// Words for calendar events.
function calendarEventText(S,e){

      const home=e.home===S.club,opp=teamName(home?e.away:e.home),[a,b]=home?e.score:[e.score[1],e.score[0]];

        (e.won?(e.round===3?' Champions.':' On to the '+ROUND_NAMES[e.round+1]+'.'):' The season is over.');

    case 'leagueYear':return 'The new league year is open. '+(e.retired.length?'Retired: '+e.retired.map(p=>p.pos+' '+p.name).join(', ')+'. ':'Nobody on our roster retired. ')+
      (e.risers.length?'Biggest jumps: '+e.risers.map(p=>p.pos+' '+p.name+' (+'+p.gain+')').join(', ')+'. ':'')+
      (e.revived.length?'Lapsed stadium offers are back with new terms: '+e.revived.join(', ')+'. ':'')+'Our lease has '+e.leaseYears+' year'+(e.leaseYears===1?'':'s')+' left.';

    case 'draftDone':return 'The draft is done. Our class: '+(e.picks.length?e.picks.map(p=>'#'+p.overall+' '+p.pos+' '+p.name+' ('+p.college+')'+(p.by==='owner'?', your call':'')).join('; '):'no picks this year')+'. Undrafted free agents fill out the camp roster.';

  const row=(p,action)=>'<tr><td>'+esc(p.name)+'</td><td>'+esc(p.pos)+'</td><td>'+esc(p.college)+'</td><td>'+p.age+'</td><td>'+grade(p)+'</td><td>'+(action??'')+'</td></tr>';

  if(D.status==='scouting'){
