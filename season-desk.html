// ---------------------------------------------------------------------------
// Trades the owner does not start: GM proposals and offers from other clubs
//
// A trade is {buyer, seller, targetId, outId?, picks:[{origin,round}]}: the
// buyer receives the target player and sends the out player and picks.
// GM ideas and incoming offers wait in staff.proposals (kind 'trade' and
// 'offer') for one week unless the GM's authority lets him act alone.
// ---------------------------------------------------------------------------
const TRADE_DEADLINE=10,AUTO_HIRE_WEEKS=4;
const tradeWindow=S=>{const t=now(S);return t<=TRADE_DEADLINE||t>=MILESTONES.leagueYear;};
const picksOf=(S,id)=>S.picks.filter(p=>p.owner===id).sort((a,b)=>b.round-a.round);
const pickWorth=k=>pickValues[k.round];
const starterIds=(S,id)=>{const u=clubUnits(S,id),set=new Set();for(const [pos,,n] of positions)u.chart[pos].slice(0,n).forEach(p=>set.add(p.id));return set;};
// Value a club puts on a player: talent plus contract surplus.
const tradeValue=(S,p)=>playerValue(p)+contractSurplus(S,p);

function executeTrade(S,T){
  if(!tradeWindow(S))return 'closed';
  const sellerR=S.rosters[T.seller],buyerR=S.rosters[T.buyer];
  const target=sellerR.find(p=>p.id===T.targetId&&!p.out&&!p.ir);
  const out=T.outId?buyerR.find(p=>p.id===T.outId&&!p.out&&!p.ir):null;
  const picks=(T.picks??[]).map(k=>S.picks.find(p=>p.origin===k.origin&&p.round===k.round&&p.owner===T.buyer));
  if(!target||(T.outId&&!out)||picks.some(p=>!p))return 'gone';
  if(sellerShort(S,T.seller,target,out)||out&&healthyAfter(buyerR,out.pos,out,target)<startersAt(out.pos))return 'depth';
  if(capRoom(S,T.buyer)-capHit(target)+(out?capHit(out):0)<0||capRoom(S,T.seller)+capHit(target)-(out?capHit(out):0)<0)return 'cap';
  S.rosters[T.seller]=sellerR.filter(p=>p!==target);S.rosters[T.buyer]=buyerR.filter(p=>p!==out);
  S.rosters[T.buyer].push(target);if(out)S.rosters[T.seller].push(out);
  for(const p of picks)p.owner=T.seller;
  const pk=picks.map(p=>({origin:p.origin,round:p.round}));
  if(T.buyer===S.club)record(S,'trade',{seller:T.seller,incoming:snap(target),outgoing:out?snap(out):null,pick:pk[0]??null,picks:pk,by:T.by??'owner'});
  if(T.seller===S.club)record(S,'tradeAway',{buyer:T.buyer,outgoing:snap(target),incoming:out?snap(out):null,picks:pk,by:T.by??'owner'});
  if(target.rating>=80)news(S,teamName(T.buyer)+' acquire '+target.pos+' '+target.name+' from '+teamName(T.seller));
  return 'ok';
}
const authority=S=>S.staff.directives.tradeAuthority??'all';
// Does the owner want to be called about this one?
function needsCall(S,T){
  const a=authority(S);
  if(a==='all')return true;
  if(a==='none')return false;
  const mine=T.buyer===S.club?T.outId:T.targetId;
  return (T.buyer===S.club&&T.picks.some(k=>k.round===1))||(mine&&starterIds(S,S.club).has(mine));
}

// ---- The GM looks for upgrades ------------------------------------------------------
function gmTradeIdea(S){
  const id=S.club,u=clubUnits(S,id),focus=focusFor(S,id),approach=approachFor(S,id),mine=picksOf(S,id);
  const ideas=[];
  for(const [pos,,n] of positions){
    if(['K','P','LS'].includes(pos))continue;
    const weakest=u.chart[pos][n-1],floor=weakest?.rating??45;
    for(const t of clubs){
      if(t.id===id)continue;
      for(const p of S.rosters[t.id]){
        if(p.pos!==pos||p.out||p.ir||p.rating<floor+4)continue;
        if(approach==='rebuild'&&p.age>=29)continue;
        ideas.push({p,seller:t.id,weakest,gain:p.rating-floor+(focus.includes(pos)?4:0)+(approach==='win-now'?2:0)});
      }
    }
  }
  ideas.sort((a,b)=>b.gain-a.gain);
  for(const {p,seller,weakest} of ideas.slice(0,25)){
    if(S.staff.proposals.some(x=>x.trade?.targetId===p.id))continue;
    const usable=mine.filter(k=>!(approach==='rebuild'&&k.round<=2));
    for(const out of [null,weakest&&weakest.pos===p.pos&&!weakest.out?weakest:null]){
      if(sellerShort(S,seller,p,out))continue;
      const cap=tradeCap(S,seller,p,out);
      if(cap.buyer<0||cap.seller<0)continue;
      const need=termsNeeded(p,out,S,seller);
      const pick=need===0?null:usable.find(k=>pickWorth(k)>=need&&pickWorth(k)<=need*1.25+5); // he will not propose an overpay
      if(need>0&&!pick)continue;
      return {buyer:id,seller,targetId:p.id,outId:out?.id??null,picks:pick?[{origin:pick.origin,round:pick.round}]:[],by:'gm'};
    }
  }
  return null;
}
// ---- Other clubs ask about the owner's players ---------------------------------------
function aiOfferIdea(S,r){
  const id=S.club,buyer=clubs.filter(t=>t.id!==id)[randInt(r,31)].id;
  if(rivalFactor(id,buyer)>=1.2&&r()<.4)return null; // division rivals often do not bother asking
  const theirs=clubUnits(S,buyer),candidates=[];
  for(const p of S.rosters[id]){
    if(p.out||p.ir||['K','P','LS'].includes(p.pos)||sellerShort(S,id,p,null))continue;
    const n=startersAt(p.pos),floor=theirs.chart[p.pos][n-1]?.rating??45;
    if(p.rating>=floor+4&&capRoom(S,buyer)>=capHit(p))candidates.push({p,gain:p.rating-floor});
  }
  if(!candidates.length)return null;
  const {p}=candidates.sort((a,b)=>b.gain-a.gain)[randInt(r,Math.min(4,candidates.length))];
  const want=tradeValue(S,p)*(.88+r()*.32)*rivalFactor(id,buyer),picks=picksOf(S,buyer).sort((a,b)=>pickWorth(a)-pickWorth(b));
  let offer=picks.find(k=>pickWorth(k)>=want);
  let package_=offer?[offer]:null;
  if(!package_){
    for(const a of picks)for(const b of picks)if(a!==b&&pickWorth(a)+pickWorth(b)>=want&&(!package_||pickWorth(a)+pickWorth(b)<package_.reduce((s,k)=>s+pickWorth(k),0)))package_=[a,b];
  }
  if(!package_)return null;
  return {buyer,seller:id,targetId:p.id,outId:null,picks:package_.map(k=>({origin:k.origin,round:k.round})),by:'club'};
}
// How the owner's GM reads a trade, in plain words.
function tradeRead(S,T){
  const incoming=T.buyer===S.club,player=(incoming?S.rosters[T.seller]:S.rosters[S.club]).find(p=>p.id===T.targetId);
  const out=T.outId?S.rosters[S.club].find(p=>p.id===T.outId):null;
  if(!player)return {text:'That player has moved on.',ratio:0};
  const picks=T.picks.reduce((a,k)=>a+pickWorth(k),0);
  if(incoming){
    const need=termsNeeded(player,out,S,T.seller),ratio=(need+5)/(picks+5); // same measure the GM prices with
    const rival=rivalNote(S.club,T.seller);
    return {ratio,text:(ratio>=1.1?'A good price.':ratio>=.9?'A fair price.':'We would be overpaying.')+(rival?' That includes the premium '+teamName(T.seller)+' charges '+(rival.startsWith('a division')?'a division':'a conference')+' rival.':'')+' He would start for us over '+(clubUnits(S,S.club).chart[player.pos][startersAt(player.pos)-1]?.name??'nobody')+'. Cap room after: '+m1(tradeCap(S,T.seller,player,out).buyer)+'.'};
  }
  const rival=rivalNote(S.club,T.buyer),worth=tradeValue(S,player)*rivalFactor(S.club,T.buyer),ratio=picks/Math.max(1,worth),hc=hcOf(S,S.club),starts=starterIds(S,S.club).has(player.id);
  return {ratio,text:(ratio>=1.1?'They are overpaying.':ratio>=.9?'That is a fair offer.':'That is light for him.')+(rival?' They are '+rival+', so I priced in a premium.':'')+' It would clear '+m1(capHit(player))+' of cap room.'+
    (starts?' '+(hc.interim?'The interim coach':'Coach '+hc.name)+' does not want to lose a starter.':'')};
}
function proposeTrade(S,kind,T){
  const player=(T.buyer===S.club?S.rosters[T.seller]:S.rosters[S.club]).find(p=>p.id===T.targetId);
  S.staff.proposals.push({id:S.staff.nextProposalId++,kind,trade:T,playerId:player.id,name:player.name,pos:player.pos,rating:player.rating,age:player.age,
    club:T.buyer===S.club?T.seller:T.buyer,week:now(S)});
}
// Weekly, inside the trade window.
function processTradeTalk(S,r){
  if(!S.club||!tradeWindow(S)||!S.staff?.clubs)return;
  if(r()<.2){
    const T=gmTradeIdea(S);
    if(T){if(needsCall(S,T))proposeTrade(S,'trade',T);else executeTrade(S,T);}
  }
  if(r()<.15){
    const T=aiOfferIdea(S,r);
    if(T){
      const read=tradeRead(S,T);
      if(authority(S)!=='all'&&read.ratio>=1.1&&!starterIds(S,S.club).has(T.targetId))executeTrade(S,{...T,by:'gm'});
      else proposeTrade(S,'offer',T);
    }
  }
}

// ---- Auto-hire ----------------------------------------------------------------------
const absWeek=S=>cur(S).number*100+now(S);
function autoHire(S){
  if(!S.club||!S.staff?.clubs)return;
  const C=S.staff.clubs[S.club];
  for(const role of ['hc','gm']){
    const person=C[role];
    if(!person.interim)continue;
    person.vacantSince??=absWeek(S);
    if(absWeek(S)-person.vacantSince<AUTO_HIRE_WEEKS)continue;
    fillMarket(S,rngFor(S.rng));
    const best=[...S.staff.market[role]].sort((a,b)=>role==='hc'?coachScore(b)-coachScore(a):gmScore(b)-gmScore(a))[0];
    hire(S,role,best.id);
    record(S,'autoHired',{role,name:best.name,president:S.staff.president.name,weeks:AUTO_HIRE_WEEKS});
  }
}

// Words.
function tradeEventText(S,e){
  const who=p=>p.pos+' '+p.name,picks=list=>list.map(pickLabel).join(' and ');
  switch(e.type){
    case 'tradeAway':return (e.by==='gm'?'I traded ':'We traded ')+who(e.outgoing)+' to '+teamName(e.buyer)+' for '+[e.incoming&&who(e.incoming),e.picks.length&&picks(e.picks)].filter(Boolean).join(' and ')+'.';
    case 'autoHired':return 'The '+(e.role==='hc'?'head coach':'general manager')+' job was open for '+e.weeks+' weeks, so team president '+e.president+' hired '+e.name+'. His promises are on the Staff page.';
    case 'tradeExpired':return e.text;
  }
  return '';
}

// Words. Everything returned here is already escaped HTML.
// ---------------------------------------------------------------------------
const weeksText=n=>n+' week'+(n===1?'':'s');
const playerText=p=>(p.pos?p.pos+' ':'')+p.name;
function describeEvent(e,S=save){
  switch(e.type){
    case 'injury':return esc(e.player.name+' ('+e.player.pos+', '+e.player.rating+') is out '+weeksText(e.weeks)+'. '+e.backup.name+' ('+e.backup.rating+') moves into the starting group.');
    case 'cleared':return esc(e.player.name+' ('+e.player.pos+') is cleared to play. The staff has updated the depth chart.');
    case 'trade':return esc((e.by==='gm'?'I traded for ':'Acquired ')+playerText(e.incoming)+' from '+teamName(e.seller)+' for '+[e.outgoing&&playerText(e.outgoing),...(e.picks??(e.pick?[e.pick]:[])).map(pickLabel)].filter(Boolean).join(' and ')+'.');
    case 'quoteExpired':return esc('The trade quote'+(e.seller?' from '+teamName(e.seller):'')+' expired when the week advanced.');
    case 'talksEnded':return esc('Ended trade talks with '+teamName(e.seller)+'.');
    case 'termsGone':return esc('The terms are no longer available.');
    case 'visitReport':return esc(visitReportText(e));
    case 'studyReport':return esc(studyReportText(e));
    case 'projectDone':case 'namingSigned':case 'namingAwaiting':case 'namingLapsed':case 'namingDeclined':return esc(financeEventText(e));
    case 'rightsWon':case 'rightsLost':case 'rightsRenewed':case 'meetingCalled':case 'voteResult':return esc(leagueEventText(e));
    case 'playoffResult':case 'seasonReview':case 'leagueYear':case 'draftOpen':case 'draftUnattended':case 'draftDone':case 'calendarNote':case 'finalCuts':return esc(calendarEventText(S,e));
    case 'playerReleased':case 'contractRestructured':case 'contractExtended':case 'resignings':case 'capYear':case 'capWarning':case 'capCompliance':case 'faSigned':case 'faLost':case 'playerTagged':case 'optionExercised':case 'floorShortfall':case 'salaryPrepaid':case 'floorWarning':return esc(contractEventText(S,e));
    case 'staffFired':case 'staffHired':case 'candidateLost':case 'staffReview':case 'proposalExpired':return esc(staffEventText(S,e));
    case 'rosterMoves':case 'practicePoached':case 'coachUnhappy':return esc(depthEventText(S,e));
    case 'tradeAway':case 'autoHired':case 'tradeExpired':return esc(tradeEventText(S,e));
    case 'siteExpired':return esc('The offer for the '+e.siteName+' in '+e.marketName+' has expired.');
    case 'legacy':return esc(e.text);
    default:return esc('Unrecognized staff report ('+e.type+').');
  }
}
function offerMessage(S,q){
  const seller=teamName(q.seller),target=S.rosters[q.seller].find(p=>p.id===q.targetId);
  switch(q.status){
    case 'opening':return 'Opening terms from '+seller+'.';
    case 'needMore':return 'They want more than your available picks cover. Try offering a stronger player.';
    case 'incomplete':return 'Select a player or a draft pick before sending a proposal.';
    case 'accepted':return seller+' accepts your proposal, pending your authorization.';
    case 'countered':return seller+' turned down your price. Their counter is below.';
    case 'declined':return seller+' declined. Your available picks cannot bridge the gap for this player.';
    case 'needsDepth':return seller+' will not leave itself without a healthy '+(target?.pos??'starter')+'. They would need one back in the deal.';
    case 'capShort':return 'That deal does not fit under our cap. Clear room first, or send back more salary.';
    case 'sellerCap':return seller+' cannot take that much salary back under their cap.';
    default:return 'Existing offer from '+seller+'.';
  }
}

// ---------------------------------------------------------------------------
// Loading, validating and upgrading saves
// ---------------------------------------------------------------------------
function detectVersion(raw){
  if(raw&&isInt(raw.schemaVersion,1))return raw.schemaVersion;
  if(raw&&Array.isArray(raw.weeks))return 1; // November 18 prototype: the season object was the save
  throw Error('this is not a league save');
}
const migrations={
  1:migrateV1,
  2:migrateV2,
  3:migrateV3,
  4:migrateV4,
  5:migrateV5,
  6:migrateV6,
  7:migrateV7,
  8:migrateV8,
  9:migrateV9,
  10:migrateV10,
};
// v10 -> v11: GM trade authority, and a clock on open jobs for auto-hire.
function migrateV10(old){
  old.staff.directives.tradeAuthority??='all';
  const C=old.staff.clubs[old.club];
  if(C)for(const role of ['hc','gm'])if(C[role].interim)C[role].vacantSince??=cur(old).number*100+cur(old).tick;
  old.schemaVersion=11;
  (old.migrations??=[]).push({from:10,to:11,at:new Date().toISOString()});
  return old;
}
// v9 -> v10: depth-chart overrides, game-day actives, injured reserve and practice squads.
function migrateV9(old){
  initDepth(old,rngFor(old.rng));
  old.schemaVersion=10;
  (old.migrations??=[]).push({from:9,to:10,at:new Date().toISOString()});
  return old;
}
// v8 -> v9: head coaches and GMs for every club, owner instructions and approvals.
function migrateV8(old){
  makeStaffAll(old,rngFor(old.rng));
  old.schemaVersion=9;
  (old.migrations??=[]).push({from:8,to:9,at:new Date().toISOString()});
  return old;
}
// v7 -> v8: guarantees, deferred dead money, carryover, tags, rookie options.
function migrateV7(old){
  Object.assign(old.cap,{deadNext:{},carry:{},tags:{}});
  for(const p of Object.values(old.rosters).flat()){
    const c=p.contract;
    c.gYears=c.kind==='rookie'&&p.drafted?(p.drafted.round===1?c.yearsLeft:p.drafted.round===2?Math.min(2,c.yearsLeft):0):capHit(p)>old.cap.limit*.04&&c.yearsLeft>=2?1:0;
    if(c.kind==='rookie'&&p.drafted?.round===1)c.option=true;
  }
  for(const p of old.fa.pool)p.ask.gYears??=0;
  for(const o of Object.values(old.fa.offers))o.gYears??=0;
  old.schemaVersion=8;
  (old.migrations??=[]).push({from:7,to:8,at:new Date().toISOString()});
  return old;
}

// v2 -> v3: adds the stadium world (open markets, site offers, leases), the team
// president, and empty stadium records. Generated from the save's own seed.
function migrateV2(old){

function upgrade(raw){
  let S=JSON.parse(JSON.stringify(raw));
  const from=detectVersion(S);
  if(from>SCHEMA_VERSION)throw Error('it was made by a newer build of the game (save format v'+from+'). Open it with that build');
  for(let v=from;v<SCHEMA_VERSION;v=S.schemaVersion){
    if(!migrations[v])throw Error('there is no upgrade path from save format v'+v);
    S=migrations[v](S);
  }
  const errors=validateSave(S);
  if(errors.length)throw Error(errors.join(' '));
  return {save:S,from};
}
function validateSave(S){
  const errors=[],fail=m=>{if(errors.length<10)errors.push(m);};
  if(!S||typeof S!=='object')return ['The save is empty.'];
  if(S.schemaVersion!==SCHEMA_VERSION)fail('Unexpected save format '+S.schemaVersion+'.');
  if(typeof S.saveId!=='string'||!S.saveId)fail('The save has no id.');
  if(!S.rng||!isInt(S.rng.seed,0,4294967295)||!isInt(S.rng.state,0,4294967295))fail('The random generator state is missing.');
  if(S.club!==null&&!byId.has(S.club))fail('The owned club is not in the league.');
  if(S.revision!==undefined&&!isInt(S.revision,0))fail('The save revision is invalid.');
  if(!Array.isArray(S.seasons)||!S.seasons.length)fail('No seasons are recorded.');
  else{
    if(!isInt(S.seasonIndex,0,S.seasons.length-1))fail('The current season is invalid.');
    S.seasons.forEach((s,si)=>{
      const label='Season '+(si+1);
      if(!s||!isInt(s.number,1))return fail(label+' has no number.');
      if(!Array.isArray(s.weeks)||!s.weeks.length)return fail(label+' has no schedule.');
      if(!isInt(s.completed,0,s.weeks.length))fail(label+' has an invalid week count.');
      if(!isInt(s.tick,0,SEASON_TICKS)||s.tick<s.completed)fail(label+' has an invalid calendar position.');
      s.weeks.forEach((games,wi)=>{
        const where=label+' week '+(wi+1);
        if(!Array.isArray(games))return fail(where+' is not a list of games.');
        const seen=new Set();
        for(const g of games){
          if(!g||!byId.has(g.home)||!byId.has(g.away)||g.home===g.away){fail(where+' has a game with an unknown club.');continue;}
          if(seen.has(g.home)||seen.has(g.away))fail(where+' schedules a club twice.');
          seen.add(g.home);seen.add(g.away);
          const scored=Array.isArray(g.score)&&g.score.length===2&&g.score.every(n=>isInt(n,0));
          if(wi<s.completed?!scored:g.score!==null)fail(where+' has a score that does not match its status.');
          if(g.ot!==undefined&&g.ot!==true)fail(where+' has an invalid overtime flag.');
        }
      });
      if(!clubs.every(t=>Number.isFinite(s.ratings?.[t.id]?.offense)&&Number.isFinite(s.ratings[t.id].defense)))fail(label+' is missing club ratings.');
    });
  }
  if(!S.rosters||typeof S.rosters!=='object')fail('Rosters are missing.');
  else{
    const ids=new Set();
    for(const t of clubs){
      const roster=S.rosters[t.id];
      if(!Array.isArray(roster)){fail(teamName(t.id)+' has no roster.');continue;}
      for(const p of roster){
        if(!p||typeof p.id!=='string'||ids.has(p.id)){fail(teamName(t.id)+' has a player with a missing or duplicate id.');continue;}
        ids.add(p.id);
        if(typeof p.name!=='string'||!positionNames.has(p.pos)||!Number.isFinite(p.rating)||!isInt(p.age,15,60)||(p.out!==undefined&&!isInt(p.out,1,52)))fail(teamName(t.id)+' has an invalid player record ('+p.id+').');
      }
    }
  }
  if(!Array.isArray(S.picks))fail('Draft picks are missing.');
  else{
    const keys=new Set();
    for(const p of S.picks){
      if(!p||!byId.has(p.origin)||!byId.has(p.owner)||!isInt(p.round,1,7)||keys.has(pickKey(p))){fail('A draft pick record is invalid.');continue;}
      keys.add(pickKey(p));
    }
  }
  if(S.offer!==null&&(!S.offer||!byId.has(S.offer.seller)||typeof S.offer.targetId!=='string'||!isInt(S.offer.week,0)))fail('The open trade offer is invalid.');
  if(!Array.isArray(S.events))fail('Staff reports are missing.');
  else{
    let max=0;
    for(const e of S.events){
      if(!e||!isInt(e.id,1)||typeof e.type!=='string'||!isInt(e.week,0)){fail('A staff report is invalid.');continue;}
      max=Math.max(max,e.id);
    }
    if(!isInt(S.nextEventId,max+1))fail('The report counter is behind the reports.');
  }
  const W=S.world;
  if(!W||!Array.isArray(W.markets)||!Array.isArray(W.sites)||!W.leases)fail('The stadium market list is missing.');
  else{
    const marketIds=new Set(W.markets.map(m=>m?.id)),officialIds=new Set(W.markets.flatMap(m=>Array.isArray(m?.officials)?m.officials.map(o=>o?.id):[]));
    for(const site of W.sites){
      if(!site||typeof site.id!=='string'||!marketIds.has(site.marketId)||!officialIds.has(site.sponsor)||!['open','expired'].includes(site.status)||
        !isInt(site.expiresWeek,0,99)||![site.publicOffer,site.parking,site.infraEstimate,site.infraTrue,site.maxSeats].every(Number.isFinite)||!LAND_TERMS.includes(site.landTerms))
        fail('A stadium site record is invalid.');
    }
    if(!clubs.every(t=>typeof W.leases[t.id]?.stadium==='string'&&isInt(W.leases[t.id].capacity,1)))fail('A club lease is missing.');
  }
  const st=S.stadium;
  if(!st||!Array.isArray(st.visits)||!Array.isArray(st.studies)||!Array.isArray(st.knowledge)||!Number.isFinite(st.homeMood)||!isInt(st.nextFactId,1))fail('Stadium records are missing.');
  else{
    if(st.visits.filter(v=>v?.status==='planned').length>1)fail('More than one visit is planned.');
    if(st.knowledge.some(f=>!f||!isInt(f.id,1)||!Array.isArray(f.knownBy)||f.id>=st.nextFactId))fail('A record of who knows what is invalid.');
  }
  if(typeof S.staff?.president?.name!=='string')fail('The team president is missing.');
  const F=S.finance;
  if(!F||![F.ownerCash,F.clubCash,F.debt,F.rate,F.distributionAnnual].every(Number.isFinite)||!Array.isArray(F.projects)||!Array.isArray(F.ledger)||
    !Array.isArray(F.capitalLog)||!F.contributions||!F.naming||!['borrow','owner'].includes(F.lossPolicy))fail('Club finances are missing.');
  else{
    if(F.projects.some(p=>!projectDef(p?.id)||!['proposed','declined','building','active'].includes(p.status)||(p.status==='building'&&!isInt(p.weeksLeft,1))))fail('A funding project is invalid.');
    if(!['none','negotiating','awaiting','signed'].includes(F.naming.status))fail('The naming-rights talks are invalid.');
    if(F.naming.status==='signed'&&!(F.naming.deal&&Number.isFinite(F.naming.deal.annual)))fail('The naming-rights deal is invalid.');
    if(F.ledger.some(x=>!x||!x.lines||!Number.isFinite(x.result)))fail('An operating report is invalid.');
  }
  if(!S.cap||![S.cap.limit,S.cap.scale,S.cap.minSalary].every(Number.isFinite)||!S.cap.dead||!S.cap.deadNext||!S.cap.carry||!S.cap.tags||!S.fa||!Array.isArray(S.fa.pool)||!S.fa.offers)fail('Salary cap records are missing.');
  else if(Object.values(S.rosters??{}).flat().some(p=>!p?.contract||![p.contract.salary,p.contract.prorated].every(Number.isFinite)||!isInt(p.contract.yearsLeft,1,10)))fail('A player contract is invalid.');
  if(!S.staff?.clubs||!clubs.every(t=>S.staff.clubs[t.id]?.hc?.ratings&&S.staff.clubs[t.id]?.gm?.ratings)||!S.staff.directives||!Array.isArray(S.staff.proposals)||!S.staff.market||!Array.isArray(S.staff.openings))fail('Coach and front-office records are missing.');
  if(!S.depth||!S.depth.order||!Array.isArray(S.depth.inactive)||!Array.isArray(S.depth.active)||!S.irReturns||!S.practice||!clubs.every(t=>Array.isArray(S.practice[t.id])&&S.practice[t.id].length<=PRACTICE_LIMIT&&S.practice[t.id].every(p=>p.contract)))fail('Depth chart or practice-squad records are missing.');
  if(!S.draft||!Array.isArray(S.draft.prospects)||!['scouting','live','done'].includes(S.draft.status)||!isInt(S.draft.pick,0))fail('The draft class is missing.');
  if(!Array.isArray(S.history)||!Array.isArray(S.draftHistory))fail('Season history is missing.');
  const Lg=S.league;
  if(!Lg||!Lg.owners||!Lg.markets||!Array.isArray(Lg.news)||!Array.isArray(Lg.promises))fail('League records are missing.');
  else{
    if(!clubs.every(t=>{const o=Lg.owners[t.id];return o&&typeof o.name==='string'&&Number.isFinite(o.relation)&&Array.isArray(o.memory);}))fail('An owner record is invalid.');
    if(!OPEN_MARKETS.every(m=>{const M=Lg.markets[m.id];return M&&(M.holder===null||byId.has(M.holder))&&M.fans&&Object.entries(M.fans).every(([id,v])=>byId.has(id)&&Number.isFinite(v));}))fail('A broadcast market record is invalid.');
    if(Lg.contest&&(!openMarket(Lg.contest.marketId)||!byId.has(Lg.contest.holder)||!['open','decided'].includes(Lg.contest.status)))fail('The broadcast rights contest is invalid.');
    if(Lg.meeting&&(!byId.has(Lg.meeting.sponsor)||!['scheduled','decided'].includes(Lg.meeting.status)||!isInt(Lg.meeting.callsLeft,0)))fail('The league meeting record is invalid.');
  }
  return errors;
}

// v1 -> v2. The v1 save was the season object itself, with office notes stored as sentences.
function migrateV1(old){
  if(!Array.isArray(old.weeks)||!old.ratings)throw Error('this save has no schedule');
  const seed=newSeed(),rng={seed,state:seed},r=rngFor(rng);
  const rosters=old.rosters??generateRosters(r,old.ratings);
  for(const p of Object.values(rosters).flat())if(p&&p.out===0)delete p.out;
  const office=old.office??{};
  const S={schemaVersion:2,saveId:typeof old.saveId==='string'&&old.saveId?old.saveId:randomId(r),rng,
    club:office.club??null,seasonIndex:0,
    seasons:[{number:1,weeks:old.weeks,completed:old.completed,ratings:old.ratings}],
    rosters,picks:Array.isArray(office.picks)?office.picks:defaultPicks(),offer:null,events:[],nextEventId:1,
    migrations:[{from:1,to:2,at:new Date().toISOString()}]};
  const players=Object.values(rosters).flat();
  const findPlayer=name=>players.find(p=>p.name===name);
  for(const note of Array.isArray(office.notes)?[...office.notes].reverse():[]){
    S.events.push({id:S.nextEventId++,season:1,week:isInt(note?.week,0)?note.week:0,...parseV1Note(String(note?.text??''),findPlayer)});
  }
  const q=office.offer;
  if(q&&byId.has(q.seller)&&typeof q.targetId==='string'){
    const m=String(q.message??'');
    const status=/accepts your proposal/.test(m)?'accepted':/turned down/.test(m)?'countered':/declined/.test(m)?'declined':
      /Select a player/.test(m)?'incomplete':q.firm===false?'needMore':'opening';
    S.offer={seller:q.seller,targetId:q.targetId,outId:q.outId??null,origin:q.origin??null,round:q.round??0,
      week:isInt(q.week,0)?q.week:old.completed,firm:q.firm!==false,status};
    if(q.draftOut!==undefined)S.offer.draftOut=q.draftOut;
    if(q.draftPick!==undefined)S.offer.draftPick=q.draftPick;
  }
  return S;
}
// Turn a v1 staff sentence back into a structured event. Unknown sentences are kept verbatim.
function parseV1Note(text,findPlayer){
  const posPattern=[...positionNames].join('|');
  const person=(name,pos,rating)=>{const p=findPlayer(name);return {id:p?.id??null,name,pos:pos??p?.pos??null,rating:rating??null};};
  const labelled=s=>{const m=new RegExp('^('+posPattern+') (.+)$').exec(s);return m?person(m[2],m[1]):person(s);};
  let m;
  if((m=/^Acquired (.+?) from (.+?) for (.+?)(?: straight up)?\.$/.exec(text))&&byName.has(m[2])){
    let outgoing=null,pick=null,ok=true;
    for(const part of m[3].split(' and ')){
      const pk=/^([A-Z]+) round ([1-7])$/.exec(part);
      if(pk&&byAbbr.has(pk[1])&&!pick)pick={origin:byAbbr.get(pk[1]).id,round:Number(pk[2])};
      else if(!pk&&!outgoing)outgoing=labelled(part);
      else ok=false;
    }
    if(ok)return {type:'trade',seller:byName.get(m[2]),incoming:labelled(m[1]),outgoing,pick};
  }
  if((m=/^(.+) \(([A-Z]+), (\d+)\) is out (\d+) weeks?\. (.+) \((\d+)\) moves into the starting group\.$/.exec(text)))
    return {type:'injury',player:person(m[1],m[2],Number(m[3])),weeks:Number(m[4]),backup:person(m[5],m[2],Number(m[6]))};
  if((m=/^(.+) \(([A-Z]+)\) is cleared to play\./.exec(text)))return {type:'cleared',player:person(m[1],m[2])};
  if(text==='The trade quote expired when the week advanced.')return {type:'quoteExpired',seller:null};
  if((m=/^Ended trade talks with (.+)\.$/.exec(text))&&byName.has(m[1]))return {type:'talksEnded',seller:byName.get(m[1])};
  if(text==='The terms are no longer available.')return {type:'termsGone'};
  return {type:'legacy',text};
}

// Rejects prototype-polluting keys in files from outside the game.
const safeReviver=(key,value)=>{
  if(key==='__proto__'||key==='constructor'||key==='prototype')throw Error('the file contains invalid season data');
  return value;
};
function readSaveFile(source){
  const text=String(source).trim();
  if(text.startsWith('{'))return upgrade(JSON.parse(text,safeReviver)).save;
  const block=source.match(/<script\b[^>]*\bid=["']initialSeason["'][^>]*>([\s\S]*?)<\/script\s*>/i);
  if(!block)throw Error('choose a season file saved with Save a copy, or a cgl-week file from an older build');
  const candidate=JSON.parse(block[1],safeReviver);
  if(!candidate)throw Error('this is the game file, not a season copy. Choose your downloaded cgl-week file');
  return upgrade(candidate).save;
}
// JSON safe to place inside <script>: no "<" can close the element early.
const embeddableJson=value=>JSON.stringify(value).replace(/</g,'\\u003c');

// ---------------------------------------------------------------------------
// Browser storage
// ---------------------------------------------------------------------------
const storage={
  get(k){try{return localStorage.getItem(k);}catch{return null;}},
  set(k,v){try{localStorage.setItem(k,v);return true;}catch{return false;}},
};
const embedded=(()=>{try{return JSON.parse($('#initialSeason').textContent,safeReviver);}catch{return null;}})();
const embeddedVersion=(()=>{try{return embedded?detectVersion(embedded):0;}catch{return 0;}})();
// Each season copy opens in its own slot so two copies never overwrite each other.
const slot=!embedded?'default':embeddedVersion>=2?embedded.saveId+'.s'+cur(embedded)?.number+'w'+cur(embedded)?.completed:(embedded.saveId??'copy')+'.'+embedded.completed;
const storageKey='cgl.save.'+slot;
const legacyKey=embeddedVersion>=2?null:'cgl.regular-season.v1.'+(embedded?.saveId??'default')+(embedded?'.'+embedded.completed:'');
const urlSeed=(()=>{try{const v=Number(new URLSearchParams(location.search).get('seed'));return isInt(v,1,4294967295)?v:undefined;}catch{return undefined;}})();

const LOCAL_OK='Saved in this browser.';
let save,saveMessage='';
function boot(){
  const stored=storage.get(storageKey);
  const raw=stored??(legacyKey?storage.get(legacyKey):null);
  if(raw){
    try{
      const {save:S,from}=upgrade(JSON.parse(raw));
      if(from<SCHEMA_VERSION){
        const backup=storageKey+'.before-v'+SCHEMA_VERSION;
        if(storage.get(backup)===null)storage.set(backup,raw);
        saveMessage='Upgraded this browser save from format v'+from+' to v'+SCHEMA_VERSION+'. The original is kept in browser storage.';
      }else saveMessage=LOCAL_OK;
      return S;
    }catch(error){
      storage.set(storageKey+'.unreadable-'+Date.now(),raw);
      saveMessage='The browser save could not be opened because '+sentence(error.message)+' It was set aside in browser storage. ';
    }
  }
  if(embedded){
    try{return upgrade(embedded).save;}
    catch(error){saveMessage+='The season in this file could not be opened because '+sentence(error.message)+' ';}
  }
  if(saveMessage)saveMessage+='A new season has started.';
  return newSave(urlSeed);
}
function persist(){
  if(!storage.set(storageKey,JSON.stringify(save)))saveMessage='This browser is not keeping saves. Use Save a copy to keep your progress.';
  else if(!saveMessage)saveMessage=LOCAL_OK;
}
function commit(){save.revision=(save.revision??0)+1;saveMessage='';persist();draw();}

// ---------------------------------------------------------------------------
// Standings
// ---------------------------------------------------------------------------
function standings(S){
  const s=cur(S);
  const rows=Object.fromEntries(clubs.map(t=>[t.id,{id:t.id,w:0,l:0,t:0,pf:0,pa:0,dw:0,dl:0,dt:0}]));
  const played=s.weeks.slice(0,s.completed).flat();
  for(const g of played){
    const [h,a]=g.score;
    for(const [id,opp,p,q] of [[g.home,g.away,h,a],[g.away,g.home,a,h]]){
      const r=rows[id],mine=byId.get(id),other=byId.get(opp);
      const result=p>q?'w':p<q?'l':'t';
      r[result]++;r.pf+=p;r.pa+=q;
      if(mine.division===other.division&&mine.conference===other.conference)r['d'+result]++;
    }
  }
  const pct=(w,l,t)=>(w+.5*t)/(w+l+t||1);
  const overall=r=>pct(r.w,r.l,r.t);
  return groups.map(group=>{
    const members=group.map(t=>rows[t.id]);
    for(const r of members){
      const tied=new Set(members.filter(other=>overall(other)===overall(r)).map(t=>t.id));
      const meetings=played.filter(g=>tied.has(g.home)&&tied.has(g.away));
      const mine=meetings.filter(g=>g.home===r.id||g.away===r.id);
      const allMet=[...tied].every(id=>id===r.id||mine.some(g=>g.home===id||g.away===id));
      r.h2h=allMet&&mine.length?mine.reduce((sum,g)=>{const [a,b]=g.score;return sum+(a===b?.5:(a>b)===(g.home===r.id)?1:0);},0)/mine.length:null;
    }
    return members.sort((a,b)=>overall(b)-overall(a)||
      (members.filter(r=>overall(r)===overall(a)).every(r=>r.h2h!==null)?b.h2h-a.h2h:0)||
      pct(b.dw,b.dl,b.dt)-pct(a.dw,a.dl,a.dt)||(b.pf-b.pa)-(a.pf-a.pa)||teamName(a.id).localeCompare(teamName(b.id)));
  });
}

function negotiationView(S){
  const q=S.offer,ours=S.rosters[S.club];
  const target=S.rosters[q.seller].find(p=>p.id===q.targetId),out=ours.find(p=>p.id===q.outId);
  if(!target)return '<p>'+esc(teamName(q.seller))+' no longer has that player.</p><button id="decline">End talks</button>';
  const options=ours.filter(p=>!p.out).sort((a,b)=>b.rating-a.rating);
  const draftOut=q.draftOut==='none'?null:options.find(p=>p.id===q.draftOut)??out;
  const picks=ownedPicks(S),quoted=picks.find(p=>p.origin===q.origin&&p.round===q.round);
  const key=q.draftPick??pickKey(quoted),proposed=picks.find(p=>pickKey(p)===key);
  const needed=termsNeeded(target,draftOut,S,q.seller);
  const fair=[7,6,5,4,3,2,1].find(round=>pickValues[round]>=needed);
  const value=proposed?pickValues[proposed.round]:0;
  let advice=sellerShort(S,q.seller,target,draftOut)?'They will not move their last healthy '+target.pos+' unless one comes back. ':
    value-needed>=20?'That pick is an overpay. ':value<needed?'Expect them to ask for more. ':'That price is defensible. ';
  if(buyerShort(S,target,draftOut))advice+='That would leave us without a healthy '+draftOut.pos+'. ';
  if(draftOut&&S.staff?.clubs){const hc=hcOf(S,S.club),u=clubUnits(S,S.club);
    if(u.chart[draftOut.pos].filter(x=>!x.out).slice(0,startersAt(draftOut.pos)).some(x=>x.id===draftOut.id))advice+=(hc.interim?'The interim coach':'Coach '+hc.name)+' does not want to lose '+draftOut.name+'; he starts for us. ';}
  if(rivalNote(S.club,q.seller))advice+=teamName(q.seller)+' is '+rivalNote(S.club,q.seller)+', so they want a premium. ';
  const surplus=contractSurplus(S,target);
  if(surplus>8)advice+='His contract is a bargain ('+m1(capHit(target))+' against a market value near '+m1(marketValue(S,target))+'), which raises the price. ';
  if(surplus<-8)advice+='His contract is expensive ('+m1(capHit(target))+' against a market value near '+m1(marketValue(S,target))+'), which brings the price down. ';
  const cap=tradeCap(S,q.seller,target,draftOut);
  advice+=cap.buyer<0?'We would be '+m1(-cap.buyer)+' over the cap: restructure or release someone first, or send back more salary. ':'This leaves us '+m1(cap.buyer)+' of cap room. ';
  let estimate=needed===0?'I would try a straight swap.':fair?'I value the gap at a round '+fair+' pick'+(draftOut?' with '+draftOut.name:' alone')+'.':'We probably need a stronger player in the deal.';
  if(sellerShort(S,q.seller,target,draftOut)){
    const swap=options.filter(p=>p.pos===target.pos).sort((a,b)=>a.rating-b.rating)[0];
    const gap=swap&&termsNeeded(target,swap),round=swap&&[7,6,5,4,3,2,1].find(rd=>pickValues[rd]>=gap);
    estimate=!swap?'We have no healthy '+target.pos+' to send back.':gap===0?'Sending '+swap.name+' straight up should do it.':round?'If we send '+swap.name+', I value the gap at a round '+round+' pick.':'Even with '+swap.name+' going back, our picks cannot cover the gap.';
  }
  const row=(label,p)=>!p?'<tr><th>'+label+'</th><td colspan="5">No player</td></tr>':'<tr><th>'+label+'</th><td>'+esc(p.name)+'</td><td>'+esc(p.pos)+'</td><td>'+p.age+'</td><td>'+p.rating+'</td><td>'+m1(capHit(p))+' · '+p.contract.yearsLeft+' yr</td></tr>';
  const deal=[out?.name,quoted&&pickLabel(quoted)].filter(Boolean).join(' and ');
  return '<p>'+esc(offerMessage(S,q))+'</p>'+
    '<div class="wide"><table><thead><tr><th>Player comparison</th><th>Name</th><th>Pos.</th><th>Age</th><th>Rating</th><th>Contract</th></tr></thead><tbody>'+row('Their player',target)+row('Your proposed return',draftOut)+'</tbody></table></div>'+
    '<div class="controls"><label>Send player <select id="tradePlayer">'+option('none','No player',!draftOut)+options.map(p=>option(p.id,p.name+' · '+p.pos+' · '+p.rating,p.id===draftOut?.id)).join('')+'</select></label>'+
    '<label>Add pick <select id="tradePick">'+option('none','No pick',key==='none')+picks.map(p=>option(pickKey(p),pickLabel(p),key===pickKey(p))).join('')+'</select></label>'+
    '<button id="counter">Send proposal</button></div>'+
    '<p><b>Your GM</b> · '+esc(advice+estimate)+'</p>'+
    (q.firm!==false?'<p><b>Available deal</b> · '+esc('Receive '+target.name+' for '+deal+'. Expires upon advancing.')+'</p><button id="accept" '+(draftOut?.id!==out?.id||key!==pickKey(quoted)?'disabled':'')+'>Authorize this deal</button> ':'')+
    '<button id="decline">End talks</button>';
}

document.addEventListener('click',e=>{
  const b=e.target.closest?.('button');if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;draw();}
  if(b.dataset.id){selected=b.dataset.id;tab='Team schedule';draw();window.scrollTo(0,0);}
  if(b.id==='claim'&&!save.club){const id=$('#claimTeam').value;if(byId.has(id)){save.club=id;selected=id;ensureContest(save);commit();}}
  if(b.dataset.scout){scoutPos=b.dataset.scout;draw();$('#scout')?.focus();}
  if(b.id==='quote'){const [seller,target]=$('#target').value.split('/');tradeQuote(save,seller,target);commit();}
  if(b.id==='counter'){const q=save.offer;if(q){counterTrade(save,$('#tradePlayer').value,$('#tradePick').value);delete q.draftPick;delete q.draftOut;commit();}}
  if(b.id==='accept'||b.id==='decline'){resolveOffer(save,b.id==='accept');commit();}
  if(b.id==='importYes'&&pendingImport)applyImport(pendingImport);
  if(b.id==='authorizeVisit'){
    const result=authorizeVisit(save,stadiumUi.plan.site,stadiumUi.plan);
    stadiumUi.notice={busy:'A visit is already scheduled this week.',unavailable:'That offer is no longer open.',closed:'The season has ended.',invalid:'Choose every visit option first.'}[result]??'';
    if(result==='ok')commit();else draw();
  }
  if(b.id==='cancelVisit'){cancelVisit(save);commit();}
  if(b.dataset.study){commissionStudy(save,b.dataset.study);commit();}
  if(b.dataset.fund){
    const [project,funding]=b.dataset.fund.split(':'),result=fundProject(save,project,funding);
    financeUi.notice={clubShort:'The club account cannot cover that.',ownerShort:'You do not have that much cash on hand.',debtLimit:'That would put the club over the league debt limit.'}[result]??'';
    if(result==='ok')commit();else draw();
  }
  if(b.dataset.decline){declineProject(save,b.dataset.decline);financeUi.notice='';commit();}
  if(b.dataset.reopen){reopenProject(save,b.dataset.reopen);financeUi.notice='';commit();}
  if(b.id==='delegateNaming'){const result=startNaming(save,financeUi.mandate);financeUi.notice='';if(result==='ok')commit();else draw();}
  if(b.id==='endNaming'||b.id==='declineNaming'){declineNaming(save);commit();}
  if(b.id==='signNaming'){approveNaming(save);commit();}
  if(b.id==='submitBid'&&leagueUi.bid){
    const result=submitBid(save,leagueUi.bid.annual,leagueUi.bid.years,leagueUi.lobby);
    leagueUi.notice=result==='ok'?'':result==='closed'?'The station has already decided.':'Choose an amount and term.';
    if(result==='ok'){leagueUi.lobby=false;commit();}else draw();
  }
  if(b.id==='withdrawBid'){withdrawBid(save);commit();}
  if(b.dataset.call||b.dataset.promise){callOwner(save,b.dataset.call??b.dataset.promise,!!b.dataset.promise);commit();}
  if(b.id==='importNo'){pendingImport=null;draw();}
  if(b.id==='advance'&&save.club){advance(save);viewed=latestView();tab=save.draft.status==='live'?'Draft':'Owner desk';commit();}
  if(b.id==='jumpGo'&&save.club){jumpTo(save,Number($('#jumpTarget').value));viewed=latestView();tab=save.draft.status==='live'?'Draft':'Owner desk';commit();window.scrollTo(0,0);}
  if(b.dataset.draft){ownerPick(save,b.dataset.draft);commit();}
  if(b.id==='gmPick'&&save.draft.order[save.draft.pick]?.owner===save.club){aiPick(save);commit();}
  if(b.id==='simToMine'){simToMyPick(save);commit();}
  const contractNotice={capShort:'That does not fit under the cap. Clear room first.',ownerShort:'You do not have that much cash on hand.',unavailable:'That move is no longer available.',invalid:'Those terms are not valid.'};
  if(b.dataset.extend){const res=extendPlayer(save,b.dataset.extend,contractsUi.funding);contractsUi.notice=contractNotice[res]??'';res==='ok'?commit():draw();}
  if(b.dataset.restructure){const res=restructure(save,b.dataset.restructure,contractsUi.funding);contractsUi.notice=contractNotice[res]??'';res==='ok'?commit():draw();}
  if(b.dataset.release){contractsUi.confirm={playerId:b.dataset.release};contractsUi.notice='';draw();}
  if(b.id==='confirmRelease'&&contractsUi.confirm){ownerRelease(save,contractsUi.confirm.playerId);contractsUi.confirm=null;commit();}
  if(b.id==='cancelRelease'){contractsUi.confirm=null;draw();}
  if(b.dataset.offer){const res=makeOffer(save,b.dataset.offer,contractsUi.funding);contractsUi.notice=contractNotice[res]??'';res==='ok'?commit():draw();}
  if(b.dataset.withdraw){withdrawOffer(save,b.dataset.withdraw);commit();}
  if(b.dataset.negotiate){
    const [kind,pid]=b.dataset.negotiate.split(':'),p=kind==='fa'?save.fa.pool.find(x=>x.id===pid):save.rosters[save.club].find(x=>x.id===pid);
    if(p){const ask=kind==='fa'?p.ask:extensionTerms(save,p);contractsUi.neg={kind,playerId:pid,terms:{salary:round1(ask.salary),years:ask.years,bonus:round1(ask.bonus),gYears:ask.gYears??0},counter:null};contractsUi.notice='';}
    draw();window.scrollTo?.(0,0);
  }
  if(b.id==='negCancel'){contractsUi.neg=null;draw();}
  if((b.id==='negSubmit'||b.id==='negAccept')&&contractsUi.neg){
    const N=contractsUi.neg,t=b.id==='negAccept'?N.counter:N.terms;
    if(N.kind==='fa'){const res=makeOffer(save,N.playerId,contractsUi.funding,t);contractsUi.notice=res==='ok'?'Offer in. He decides when the week advances.':contractNotice[res]??'';if(res==='ok'){contractsUi.neg=null;commit();}else draw();}
    else{
      const p=save.rosters[save.club].find(x=>x.id===N.playerId),res=extendPlayer(save,N.playerId,contractsUi.funding,t);
      if(res==='refused'){N.counter=counterTerms(save,p,t,save.club,extensionTerms(save,p));contractsUi.notice='';draw();}
      else{contractsUi.notice=contractNotice[res]??'';if(res==='ok'){contractsUi.neg=null;commit();}else draw();}
    }
  }
  if(b.dataset.tag){const res=tagPlayer(save,save.club,b.dataset.tag);contractsUi.notice={closed:'The tag window is closed.',used:'You have already used the tag this year.',capShort:'The tag would not fit under next year’s cap.'}[res]??contractNotice[res]??'';res==='ok'?commit():draw();}
  if(b.dataset.untag){untagPlayer(save,save.club);commit();}
  if(b.dataset.fire){staffUi.confirm={role:b.dataset.fire};staffUi.notice='';draw();}
  if(b.id==='cancelFire'){staffUi.confirm=null;draw();}
  if(b.id==='confirmFire'&&staffUi.confirm){fireStaff(save,staffUi.confirm.role);staffUi.confirm=null;commit();}
  if(b.dataset.interview){const [role,cid]=b.dataset.interview.split(':');interview(save,role,cid);commit();}
  if(b.dataset.hire){const [role,cid]=b.dataset.hire.split(':'),res=hire(save,role,cid);staffUi.notice=res==='ok'?'':'That candidate is no longer available.';commit();}
  if(b.dataset.approve){const res=approveProposal(save,Number(b.dataset.approve));staffUi.notice=res==='ok'?'':({capShort:'That no longer fits under the cap.',refused:'He no longer accepts those terms.'}[res]??'That deal is no longer available.');commit();}
  if(b.dataset.reject){declineProposal(save,Number(b.dataset.reject));commit();}
  const depthNotice={rosterFull:'The 53-man roster is full. Release someone or put an injured player on IR first.',unavailable:'That move is not available.'};
  if(b.dataset.depth){const [pid,dir]=b.dataset.depth.split(':');moveDepth(save,pid,Number(dir));depthUi.notice='';commit();}
  if(b.dataset.active){toggleActive(save,b.dataset.active);commit();}
  if(b.dataset.ir){const res=placeOnIR(save,save.club,b.dataset.ir);depthUi.notice=depthNotice[res]??'';res==='ok'?commit():draw();}
  if(b.dataset.unir){const res=activateFromIR(save,save.club,b.dataset.unir);depthUi.notice=depthNotice[res]??'';res==='ok'?commit():draw();}
  if(b.dataset.promote){const res=promote(save,save.club,b.dataset.promote);depthUi.notice=depthNotice[res]??'';res==='ok'?commit():draw();}
  if(b.dataset.psrelease){releasePractice(save,save.club,b.dataset.psrelease);commit();}
  if(b.id==='fillPractice'){fillPractice(save,save.club,rngFor(save.rng));commit();}
  if(b.id==='resetDepth'){resetDepth(save);commit();}
  if(b.id==='prepay'){const res=ownerPrepay(save);contractsUi.notice=res==='ok'?'':'No contracts have future salary left to move.';res==='ok'?commit():draw();}
  if(b.dataset.option){const res=exerciseOption(save,save.club,b.dataset.option);contractsUi.notice=contractNotice[res]??'';res==='ok'?commit():draw();}
  if(b.id==='gmFinish'){gmFinishDraft(save,false);commit();}
});
app.onchange=e=>{
  if(e.target.id==='tradePlayer'||e.target.id==='tradePick'){
    const q=save.offer;
    if(q){q[e.target.id==='tradePlayer'?'draftOut':'draftPick']=e.target.value;commit();}
    return;
  }
  const planKeys={visitSite:'site',visitWho:'who',visitDiscretion:'discretion',visitAsk:'ask',visitSignal:'signal'};
  if(planKeys[e.target.id]){stadiumUi.plan[planKeys[e.target.id]]=e.target.value;stadiumUi.notice='';return;}
  if(e.target.id==='lossPolicy'){setLossPolicy(save,e.target.value);commit();return;}
  if(e.target.id==='playerVote'){setPlayerVote(save,e.target.value);commit();return;}
  if(e.target.id==='gmHandles'){setGmHandles(save,e.target.value==='gm');commit();return;}
  const dirKeys={dirFocus:'focus',dirApproach:'approach',dirApproval:'approvalOver',rosterMoves:'rosterMoves',dirTrades:'tradeAuthority'};
  if(dirKeys[e.target.id]){setDirective(save,dirKeys[e.target.id],e.target.value);commit();return;}
  if(e.target.id==='bonusFunding'){contractsUi.funding=e.target.value;return;}
  const negKeys={negYears:'years',negSalary:'salary',negBonus:'bonus',negG:'gYears'};
  if(negKeys[e.target.id]&&contractsUi.neg){
    const t=contractsUi.neg.terms;t[negKeys[e.target.id]]=Number(e.target.value);t.gYears=Math.min(t.gYears,t.years);contractsUi.neg.counter=null;draw();return;
  }
  if(leagueUi.bid&&e.target.id==='bidAnnual'){leagueUi.bid.annual=Number(e.target.value);return;}
  if(leagueUi.bid&&e.target.id==='bidYears'){leagueUi.bid.years=Number(e.target.value);return;}
  if(e.target.id==='bidLobby'){leagueUi.lobby=e.target.checked;return;}
  if(financeUi.mandate&&['nameMin','nameYears','nameAuthority'].includes(e.target.id)){
    const m=financeUi.mandate;
    if(e.target.id==='nameMin')m.minAnnual=Number(e.target.value);
    if(e.target.id==='nameYears')m.maxYears=Number(e.target.value);
    if(e.target.id==='nameAuthority')m.authority=e.target.value;
    return;
  }
  if(financeUi.mandate&&e.target.id?.startsWith('excl-')){
    const c=e.target.id.slice(5),m=financeUi.mandate;
    m.exclude=e.target.checked?[...new Set([...m.exclude,c])]:m.exclude.filter(x=>x!==c);
    return;
  }
  if(e.target.id==='compareA')stadiumUi.a=e.target.value;
  if(e.target.id==='compareB')stadiumUi.b=e.target.value;
  if(e.target.id==='claimTeam'||e.target.id==='target')return;
  if(e.target.id==='scout')scoutPos=e.target.value;
  if(e.target.id==='week')viewed=Number(e.target.value);
  if(e.target.id==='team')selected=e.target.value;
  draw();
};
const filePicker=$('#seasonFile');
$('#loadSeason').onclick=()=>filePicker.click();
filePicker.onchange=async()=>{
  const file=filePicker.files[0];if(!file)return;
  try{
    const incoming=readSaveFile(await file.text());
    if(save.club){pendingImport=incoming;saveMessage='';draw();}
    else applyImport(incoming);
  }catch(error){
    saveMessage='Could not load save: '+sentence(error.message);draw();
  }finally{filePicker.value='';}
};
function applyImport(S){save=S;pendingImport=null;resetView();commit();}
$('#copy').onclick=()=>offerFile('cgl-season-'+cur().number+'-'+shortLabel(cur().tick).toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.json',JSON.stringify(save));

// Keep the open tab and selections when a new version of the page arrives.
function start(data){
  if(data&&typeof data==='object'){
    if(TABS.includes(data.tab))tab=data.tab;
    if(isInt(data.viewed,1,22))viewed=data.viewed;
    if(byId.has(data.selected))selected=data.selected;
    if(positionNames.has(data.scoutPos))scoutPos=data.scoutPos;
    if(data.stadiumUi&&typeof data.stadiumUi==='object'){
      for(const k of ['a','b'])if(typeof data.stadiumUi[k]==='string')stadiumUi[k]=data.stadiumUi[k];
      for(const k of Object.keys(stadiumUi.plan))if(typeof data.stadiumUi.plan?.[k]==='string')stadiumUi.plan[k]=data.stadiumUi.plan[k];
    }
  }
  draw();
}
const hot=window.claude?.hot;
try{hot?.snapshot?.(()=>({tab,viewed,selected,scoutPos,stadiumUi}));}catch{}
try{hot?.ready?hot.ready(start):start(hot?.data??{});}catch{start({});}
</script>
