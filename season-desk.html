    const slot=D.order[D.pick],mine=slot.owner===S.club,avail=draftAvailable(D);
    html+='<p><b>'+esc('On the clock: pick '+slot.overall+' (round '+slot.round+'), '+teamName(slot.owner)+(slot.owner!==slot.origin?' via '+byId.get(slot.origin).market:''))+'</b></p>';
    if(mine){
      const gm=bestFor(S,S.club,avail);
      html+='<p>'+esc('Your pick. The GM would take '+gm.pos+' '+gm.name+' of '+gm.college+'.')+'</p><div class="controls"><button id="gmPick">Let the GM pick</button><button id="gmFinish">Let the GM run the rest</button></div>'+
        table([...avail.slice(0,50)].sort((a,b)=>grade(b)-grade(a)).slice(0,25).map(p=>row(p,'<button data-draft="'+esc(p.id)+'">Draft</button>')).join(''));
    }else html+='<div class="controls"><button id="simToMine">'+(D.order.slice(D.pick).some(x=>x.owner===S.club)?'Sim to our next pick':'Sim to the end')+'</button><button id="gmFinish">Let the GM run the rest</button></div>';
    const recent=[...D.picks].reverse().slice(0,10);
    if(recent.length)html+='<h2>Latest picks</h2><ul>'+recent.map(x=>'<li><strong>#'+x.overall+'</strong> '+esc(byId.get(x.club).abbr+' · '+x.pos+' '+x.name+', '+x.college)+'</li>').join('')+'</ul>';
    return html;
  }
  const last=S.draftHistory.at(-1);
  html+='<p>'+esc('The next draft is '+weekLabel(MILESTONES.draft)+' of season '+D.season+'.')+'</p>';
  if(last){
    const mine=last.picks.filter(x=>x.club===S.club);
    html+='<h2>Season '+last.season+' draft</h2><p>'+esc(mine.length?'Your class: '+mine.map(x=>'#'+x.overall+' '+x.pos+' '+x.name).join(', ')+'.':'You had no picks.')+'</p>'+
      '<ul>'+last.picks.slice(0,32).map(x=>'<li><strong>#'+x.overall+'</strong> '+esc(byId.get(x.club).abbr+' · '+x.pos+' '+x.name+', '+x.college)+'</li>').join('')+'</ul>';
  }
  return html;
}


// ---------------------------------------------------------------------------
// Contracts and the salary cap (placeholder rules; the bible leaves them open)
//
// player.contract = {salary, prorated, yearsLeft, length, kind, signedSeason}
//   salary     cash and cap charge each season, paid across the regular season
//   prorated   the yearly cap share of signing bonuses, which were paid in cash
//              when signed. Releasing a player accelerates what is left
//              (prorated × yearsLeft) onto this year's cap as dead money.
// cap = {limit, scale, minSalary, dead:{club:$M}, gmHandles}
//   The cap year turns over at the new league year (March Week 2): contracts
//   lose a year, expired players become free agents, the cap grows 4%.
// fa = {pool:[players with ask], offers:{playerId: owner's offer}}
// ---------------------------------------------------------------------------
const CAP_START=255,CAP_GROWTH=.04,MIN_SALARY_START=.9,RESIGN_TICK=27;
const CAP_FLOOR=.89,CARRY_MAX=25,JUNE_TICK=39,TAG_OPEN=23;
const capHit=p=>round2((p.contract?.salary??0)+(p.contract?.prorated??0));
// Share of this contract year's salary still to be paid: all of it from the league
// year until the season starts, a falling share during the season, none after.
function salaryYearLeft(S){
  const s=cur(S),t=s.tick;
  if(t===0||t>=MILESTONES.leagueYear)return 1;
  if(s.completed<s.weeks.length)return (s.weeks.length-s.completed)/s.weeks.length;
  return 0;
}
function guaranteedOwed(S,p){
  const c=p.contract;
  if(!c?.gYears)return {now:0,later:0};
  return {now:round2(c.salary*salaryYearLeft(S)),later:round2(c.salary*Math.max(0,Math.min(c.gYears,c.yearsLeft)-1))};
}
// Releases from June through the season split dead money across two cap years.
const splitDead=S=>!(now(S)>=MILESTONES.leagueYear&&now(S)<JUNE_TICK);
function releaseCost(S,p){
  const c=p.contract,g=guaranteedOwed(S,p),rest=round2(c.prorated*(c.yearsLeft-1));
  const split=splitDead(S)&&c.yearsLeft>1;
  return {deadNow:round2(c.prorated+g.now+(split?0:rest+g.later)),deadLater:split?round2(rest+g.later):0,owed:round2(g.now+g.later),split};
}
const deadIfCut=(p,S=save)=>{const r=releaseCost(S,p);return round2(r.deadNow+r.deadLater);};
const limitFor=(S,id)=>round2(S.cap.limit+(S.cap.carry?.[id]??0));
const committed=(S,id)=>round2(S.rosters[id].reduce((a,p)=>a+capHit(p),0)+(S.practice?.[id]??[]).reduce((a,p)=>a+capHit(p),0)+(S.cap.dead[id]??0));
const capRoom=(S,id)=>round2(limitFor(S,id)-committed(S,id));
const PRIORITIES=['money','security','winning'];
const PRIORITY_LABEL={money:'getting paid the most',security:'guaranteed money',winning:'playing for a winner'};
function priorityFor(p){let h=0;for(const ch of p.id)h=(h*31+ch.charCodeAt(0))%997;return PRIORITIES[h%3];}
const nextYearCommitted=(S,id)=>round2(S.rosters[id].filter(p=>p.contract.yearsLeft>=2).reduce((a,p)=>a+capHit(p),0));
const salaryRaw2=p=>.9+playerValue(p)*.06;
const ageFactor=age=>age>=33?.55:age>=31?.75:age>=29?.9:1;
// What a player is worth on the open market this league year: annual value, before the bonus split.
const marketValue=(S,p)=>round2(Math.max(S.cap.minSalary,S.cap.scale*salaryRaw2(p)*ageFactor(p.age)));
function askFor(S,p){
  const annual=marketValue(S,p),years=p.age<=26?4:p.age<=29?3:p.age<=31?2:1;
  const bonus=annual>S.cap.minSalary*2?round2(annual*years*.25):0;
  const gYears=annual>S.cap.minSalary*5&&years>=2?(p.rating>=82?2:1):0;
  return {salary:round2(annual-bonus/years),years,bonus,gYears};
}
const termsHit=t=>round2(t.salary+t.bonus/t.years);
function makeContract(S,terms,kind){
  return {salary:round2(terms.salary),prorated:round2(terms.bonus/terms.years),yearsLeft:terms.years,length:terms.years,
    gYears:Math.min(terms.years,terms.gYears??0),kind,signedSeason:cur(S).number};
}
// League-wide calibration: contracts fill about 94% of the cap on average.
function makeCap(S,r){
  const raw=Object.values(S.rosters).flat().reduce((a,p)=>a+salaryRaw2(p)*ageFactor(p.age),0);
  S.cap={limit:CAP_START,scale:round2(.94*CAP_START*clubs.length/raw*100)/100,minSalary:MIN_SALARY_START,dead:{},deadNext:{},carry:{},tags:{},gmHandles:true};
  for(const p of Object.values(S.rosters).flat()){
    const annual=marketValue(S,p),years=1+randInt(r,p.age>=30?2:4);
    p.contract={salary:round2(annual*.9),prorated:round2(annual*.1),yearsLeft:years,length:years+randInt(r,2),gYears:annual>CAP_START*.04&&years>=2?1:0,kind:'veteran',signedSeason:cur(S).number};
  }
  // Every club starts close to the cap, as real clubs do.
  for(const t of clubs){
    const total=S.rosters[t.id].reduce((a,p)=>a+capHit(p),0),k=S.cap.limit*(.86+r()*.12)/total;
    for(const p of S.rosters[t.id]){p.contract.salary=round2(Math.max(S.cap.minSalary*.8,p.contract.salary*k));p.contract.prorated=round2(p.contract.prorated*k);}
  }
  S.fa={pool:[],offers:{}};
}
// Rookie deals: four years, priced by draft slot.
function rookieTerms(S,overall){
  const scale=S.cap.limit/CAP_START,annual=Math.max(S.cap.minSalary,round2(9.5*Math.exp(-(overall-1)/30)*scale));
  const bonus=round2(annual*4*(overall<=64?.35:.1));
  return {salary:round2(Math.max(S.cap.minSalary,annual-bonus/4)),years:4,bonus,gYears:overall<=32?4:overall<=64?2:0};
}
const minimumTerms=(S,years=1)=>({salary:S.cap.minSalary,years,bonus:0,gYears:0});

// Cash for the owner's club. Lands in the ledger entry for the current week.
function postCash(S,line,amount){
  const s=cur(S),F=S.finance;
  let entry=F.ledger.find(x=>x.season===s.number&&x.week===s.tick);
  if(!entry){entry={season:s.number,week:s.tick,lines:Object.fromEntries(Object.keys(LINE_LABELS).map(k=>[k,0])),result:0,ownerIncome:0,ownerOperating:0,borrowed:0,offweek:true};F.ledger.push(entry);}
  entry.lines[line]=round2((entry.lines[line]??0)+amount);
  entry.result=round2(entry.result+amount);
  F.clubCash=round2(F.clubCash+amount);
  if(F.clubCash<0){
    const need=-F.clubCash;
    if(F.lossPolicy==='owner'&&F.ownerCash>=need){F.ownerCash=round2(F.ownerCash-need);F.contributions.operating=round2(F.contributions.operating+need);entry.ownerOperating=round2(entry.ownerOperating+need);}
    else{F.debt=round2(F.debt+need);entry.borrowed=round2(entry.borrowed+need);}
    F.clubCash=0;
  }
}
// Bonus cash: the club pays, or the owner covers it personally.
function payBonus(S,amount,funding){
  if(!(amount>0))return;
  const F=S.finance;
  if(funding==='owner'&&F.ownerCash>=amount){
    F.ownerCash=round2(F.ownerCash-amount);
    F.contributions.bonuses=round2((F.contributions.bonuses??0)+amount);
    F.capitalLog.push({season:cur(S).number,week:now(S),project:'bonus',amount,funding:'owner'});
  }else postCash(S,'signingBonuses',-amount);
}

function releasePlayer(S,clubId,playerId,{toPool=true}={}){
  const roster=S.rosters[clubId],i=roster.findIndex(p=>p.id===playerId);
  if(i<0)return null;
  const p=roster[i],cost=releaseCost(S,p);
  roster.splice(i,1);
  S.cap.dead[clubId]=round2((S.cap.dead[clubId]??0)+cost.deadNow);
  if(cost.deadLater)S.cap.deadNext[clubId]=round2((S.cap.deadNext[clubId]??0)+cost.deadLater);
  if(clubId===S.club&&cost.owed>0)postCash(S,'releasePay',-cost.owed);
  delete p.out;
  if(toPool&&p.rating>=52)addToPool(S,p);
  return {player:p,dead:cost.deadNow,deadLater:cost.deadLater,owed:cost.owed};
}
function addToPool(S,p){
  delete p.contract;delete p.out;delete p.ir; // free agents carry no injury designation
  p.ask=askFor(S,p);
  S.fa.pool.push(p);
}
function signPlayer(S,clubId,p,terms,kind,funding){
  S.fa.pool=S.fa.pool.filter(x=>x.id!==p.id);
  delete S.fa.offers[p.id];
  delete p.ask;
  p.contract=makeContract(S,terms,kind);
  S.rosters[clubId].push(p);
  if(clubId===S.club)payBonus(S,terms.bonus,funding);
}

// ---- Owner actions -----------------------------------------------------------
function ownerRelease(S,playerId){
  const p=S.rosters[S.club]?.find(x=>x.id===playerId);
  if(!p)return 'unavailable';
  const r=releasePlayer(S,S.club,playerId);
  record(S,'playerReleased',{player:snap(p),dead:r.dead,deadLater:r.deadLater,owed:r.owed});
  return 'ok';
}
// Turn salary above the minimum into bonus spread over the remaining years.
function restructureSavings(S,p){
  const c=p.contract;
  if(!c||c.yearsLeft<2||c.salary<S.cap.minSalary*1.5)return null;
  const amount=round2(c.salary-S.cap.minSalary);
  return {amount,savings:round2(amount-amount/c.yearsLeft)};
}
function restructure(S,playerId,funding){
  const p=S.rosters[S.club]?.find(x=>x.id===playerId),r=p&&restructureSavings(S,p);
  if(!r)return 'unavailable';
  if(funding==='owner'&&S.finance.ownerCash<r.amount)return 'ownerShort';
  p.contract.salary=round2(p.contract.salary-r.amount);
  p.contract.prorated=round2(p.contract.prorated+r.amount/p.contract.yearsLeft);
  payBonus(S,r.amount,funding);
  if(funding==='owner')learn(S,{kind:'ownerFunding',project:'bonus'},['owner','president','league']);
  record(S,'contractRestructured',{player:snap(p),amount:r.amount,savings:r.savings,funding});
  return 'ok';
}
function extensionTerms(S,p,clubId=S.club){
  const ask=askFor(S,p),k=askFactor(S,clubId);
  return {...ask,salary:round2(Math.max(S.cap.minSalary,ask.salary*k)),bonus:round2(ask.bonus*k),years:Math.max(2,ask.years)};
}
// How a player weighs an offer against his ask: 1.0 means it matches.
function utility(S,p,t,clubId,ask){
  const share=x=>(x.bonus+x.salary*Math.min(x.gYears??0,x.years))/(termsHit(x)*x.years);
  const pr=priorityFor(p),money=termsHit(t)/termsHit(ask);
  let u=money+(pr==='money'?(money-1)*.3:0);
  u+=(share(t)-share(ask))*(pr==='security'?.6:.25);
  u-=Math.abs(t.years-ask.years)*(pr==='security'&&t.years<ask.years?.07:.04);
  u+=(winPct(S,clubId)-.5)*(pr==='winning'?.3:.08);
  return Math.round(u*1000)/1000;
}
function agentRead(S,p,t,clubId,ask){
  const u=utility(S,p,t,clubId,ask);
  if(u>=1)return {u,verdict:'yes',text:'His agent says this gets it done.'};
  if(u>=.9)return {u,verdict:'close',text:'Close. He wants about $'+round1(Math.max(.1,(1.01-u)*termsHit(ask)))+'M more a year, or more of it guaranteed.'};
  return {u,verdict:'no',text:'Not close. His agent is looking for something near the asking terms.'};
}
// The agent's counter: the same shape, with salary raised until it works for him.
function counterTerms(S,p,t,clubId,ask){
  for(let k=1.02;k<=1.8;k+=.02){
    const c={...t,salary:round2(t.salary*k)};
    if(utility(S,p,c,clubId,ask)>=1.01)return c;
  }
  return {...ask};
}
function validTerms(S,t){
  return t&&isInt(t.years,1,6)&&t.salary>=S.cap.minSalary-.001&&t.bonus>=0&&isInt(t.gYears??0,0,t.years);
}
function extendPlayer(S,playerId,funding,terms){
  const p=S.rosters[S.club]?.find(x=>x.id===playerId);
  if(!p||p.contract.yearsLeft!==1)return 'unavailable';
  const t=terms??extensionTerms(S,p);
  if(!validTerms(S,t))return 'invalid';
  if(terms&&utility(S,p,t,S.club,extensionTerms(S,p))<1)return 'refused';
  const oldLeft=p.contract.prorated;
  const hitChange=termsHit(t)+oldLeft/t.years-capHit(p);
  if(hitChange>capRoom(S,S.club))return 'capShort';
  if(funding==='owner'&&S.finance.ownerCash<t.bonus)return 'ownerShort';
  p.contract={salary:t.salary,prorated:round2(t.bonus/t.years+oldLeft/t.years),yearsLeft:t.years+1,length:t.years+1,
    gYears:Math.min(t.years+1,(t.gYears??0)+(p.contract.gYears?1:0)),kind:'extension',signedSeason:cur(S).number};
  payBonus(S,t.bonus,funding);
  record(S,'contractExtended',{player:snap(p),terms:t,funding});
  return 'ok';
}
function pendingOfferHits(S){return Object.values(S.fa.offers).reduce((a,o)=>a+termsHit(o),0);}
function makeOffer(S,playerId,funding,terms){
  const p=S.fa.pool.find(x=>x.id===playerId);
  if(!S.club||!p)return 'unavailable';
  const t=terms??{...p.ask};
  if(!validTerms(S,t))return 'invalid';
  if(termsHit(t)+pendingOfferHits(S)-(S.fa.offers[playerId]?termsHit(S.fa.offers[playerId]):0)>capRoom(S,S.club))return 'capShort';
  if(funding==='owner'&&S.finance.ownerCash<t.bonus)return 'ownerShort';
  S.fa.offers[playerId]={salary:t.salary,years:t.years,bonus:t.bonus,gYears:t.gYears??0,funding,week:now(S)};
  return 'ok';
}
function withdrawOffer(S,playerId){delete S.fa.offers[playerId];}
function tagAmount(S,pos){
  const hits=Object.values(S.rosters).flat().filter(p=>p.pos===pos).map(capHit).sort((a,b)=>b-a).slice(0,5);
  return round2(Math.max(S.cap.minSalary*2,hits.reduce((a,b)=>a+b,0)/Math.max(1,hits.length)*1.05));
}
const tagWindow=S=>now(S)>=TAG_OPEN&&now(S)<MILESTONES.leagueYear;
function tagPlayer(S,clubId,playerId){
  if(!tagWindow(S))return 'closed';
  if(S.cap.tags[clubId])return 'used';
  const p=S.rosters[clubId]?.find(x=>x.id===playerId);
  if(!p||p.contract.yearsLeft!==1)return 'unavailable';
  const amount=tagAmount(S,p.pos);
  if(amount>S.cap.limit*(1+CAP_GROWTH)-nextYearCommitted(S,clubId))return 'capShort';
  S.cap.tags[clubId]={playerId,amount};
  if(clubId===S.club)record(S,'playerTagged',{player:snap(p),amount});
  return 'ok';
}
function untagPlayer(S,clubId){delete S.cap.tags[clubId];}
const optionAmount=(S,p)=>round2(tagAmount(S,p.pos)*.85);
function exerciseOption(S,clubId,playerId){
  const p=S.rosters[clubId]?.find(x=>x.id===playerId),c=p?.contract;
  if(!c||c.yearsLeft!==1||!c.option)return 'unavailable';
  c.yearsLeft=2;c.length+=1;c.gYears=2;c.nextSalary=optionAmount(S,p);c.option=false;
  if(clubId===S.club)record(S,'optionExercised',{player:snap(p),amount:c.nextSalary});
  return 'ok';
}
function setGmHandles(S,on){S.cap.gmHandles=!!on;}

// ---- Clubs run by staff (every AI club, and the owner's when the GM handles it) ----
// Open roster slots at a position (all ages count; the draft looks further ahead with needAt).
const slotsOpen=(S,id,pos)=>positions.find(x=>x[0]===pos)[1]-S.rosters[id].filter(p=>p.pos===pos).length;
const handledByStaff=(S,id)=>id!==S.club||S.cap.gmHandles;
const starterSet=roster=>{const set=new Set(),u=personnel(roster);for(const [pos,,n] of positions)u.chart[pos].slice(0,n).forEach(p=>set.add(p.id));return set;};
// March Week 1: keep the players worth keeping before their deals run out.
function resignExpiring(S,r){
  const mine={kept:[],leaving:[],proposed:[]};
  for(const t of clubs){
    if(!handledByStaff(S,t.id)){
      if(t.id===S.club)mine.leaving=S.rosters[t.id].filter(p=>p.contract.yearsLeft===1&&S.cap.tags[t.id]?.playerId!==p.id).map(snap);
      continue;
    }
    for(const p of S.rosters[t.id])if(p.contract.yearsLeft===1&&p.contract.option&&p.rating>=72)exerciseOption(S,t.id,p.id);
    const starters=starterSet(S.rosters[t.id]);
    let budget=S.cap.limit*(1+CAP_GROWTH)-nextYearCommitted(S,t.id)-12;
    const flush=budget>S.cap.limit*.15;
    const expiring=S.rosters[t.id].filter(p=>p.contract.yearsLeft===1&&S.cap.tags[t.id]?.playerId!==p.id).sort((a,b)=>b.rating-a.rating);
    for(const p of expiring){
      const ageMax={'win-now':33,balanced:31,rebuild:28}[approachFor(S,t.id)]+(flush?1:0);
      const worth=(starters.has(p.id)||p.rating>=72||(flush&&p.rating>=64))&&p.age<=ageMax&&r()<(flush?.92:.8);
      const raise=flush?1+Math.min(.25,budget/S.cap.limit*.5):1,base=extensionTerms(S,p,t.id);
      const t2={salary:round2(base.salary*raise),years:base.years,bonus:round2(base.bonus*raise),gYears:base.gYears},hit=termsHit(t2);
      if(worth&&hit<=budget&&t.id===S.club&&needsApproval(S,hit)){propose(S,'resign',p,t2);mine.proposed.push(snap(p));}
      else if(worth&&hit<=budget){
        budget-=hit;
        p.contract={salary:t2.salary,prorated:round2(t2.bonus/t2.years+p.contract.prorated/t2.years),yearsLeft:t2.years+1,length:t2.years+1,gYears:t2.gYears,kind:'extension',signedSeason:cur(S).number};
        if(t.id===S.club){payBonus(S,t2.bonus,'club');mine.kept.push(snap(p));}
      }else if(starters.has(p.id)&&p.rating>=76&&p.age<=30&&!S.cap.tags[t.id]&&tagPlayer(S,t.id,p.id)==='ok'){
        if(t.id===S.club)mine.kept.push({...snap(p),tagged:true});
      }else if(t.id===S.club)mine.leaving.push(snap(p));
    }
  }
  if(S.club)record(S,'resignings',{...mine,byGm:S.cap.gmHandles});
}
// New league year: contracts lose a year and expired players hit the market.
function turnCapYear(S){
  for(const t of clubs)S.cap.carry[t.id]=round2(Math.max(0,Math.min(CARRY_MAX,capRoom(S,t.id))));
  S.cap.limit=round2(S.cap.limit*(1+CAP_GROWTH));
  S.cap.scale=round2(S.cap.scale*(1+CAP_GROWTH)*100)/100;
  S.cap.minSalary=round2(S.cap.minSalary*(1+CAP_GROWTH));
  S.cap.dead=S.cap.deadNext;S.cap.deadNext={};
  const departed=[],tagged=[];
  for(const [clubId,tag] of Object.entries(S.cap.tags)){
    const p=S.rosters[clubId].find(x=>x.id===tag.playerId);
    if(p&&p.contract.yearsLeft===1){
      p.contract={salary:tag.amount,prorated:0,yearsLeft:2,length:1,gYears:2,kind:'tag',signedSeason:cur(S).number};
      if(clubId===S.club)tagged.push(snap(p));
    }
  }
  S.cap.tags={};
  for(const t of clubs){
    S.rosters[t.id]=S.rosters[t.id].filter(p=>{
      const c=p.contract;
      c.gYears=Math.max(0,(c.gYears??0)-1);
      if(--c.yearsLeft>0){
        if(c.nextSalary){c.salary=c.nextSalary;delete c.nextSalary;delete c.futureSalary;}
        else if(c.futureSalary){c.salary=c.futureSalary;delete c.futureSalary;}
        return true;
      }
      if(t.id===S.club)departed.push(snap(p));
      addToPool(S,p);
      return false;
    });
  }
  if(S.practice)for(const t of clubs){for(const p of S.practice[t.id])if(p.age<=26&&p.rating>=55)addToPool(S,p);S.practice[t.id]=[];} // filler leaves the league
  for(const t of clubs)for(const p of S.rosters[t.id]){delete p.ir;delete p.out;}
  for(const p of S.fa.pool)p.ask=askFor(S,p);
  for(const t of clubs)if(t.id!==S.club)comply(S,t.id);
  const room=capRoom(S,S.club);
  if(S.club){
    record(S,'capYear',{limit:S.cap.limit,carry:S.cap.carry[S.club]??0,departed,tagged,room});
    if(room<0)record(S,'capWarning',{over:round2(-room)});
  }
}
// Prepay future salary into this cap year to reach the floor: cash-neutral over the
// contract, cap hits rise now and fall later.
function prepayToFloor(S,id){
  let need=round2(CAP_FLOOR*S.cap.limit-committed(S,id)),moved=0;
  if(need<=0)return 0;
  const eligible=[...S.rosters[id]].filter(p=>p.contract.yearsLeft>=2&&!p.contract.nextSalary).sort((a,b)=>b.contract.salary-a.contract.salary);
  for(const p of eligible){
    const c=p.contract,future=c.futureSalary??c.salary,years=c.yearsLeft-1;
    const x=round2(Math.min(need,(future-S.cap.minSalary)*years));
    if(x<=0)continue;
    c.salary=round2(c.salary+x);c.futureSalary=round2(future-x/years);
    need=round2(need-x);moved=round2(moved+x);
    if(need<=0)break;
  }
  if(moved>0&&id===S.club)postCash(S,'payroll',-moved);
  return moved;
}
// End of the regular season: staff prepay to reach the floor; an owner in charge gets a warning.
function floorPlanning(S){
  for(const t of clubs){
    if(handledByStaff(S,t.id)){const moved=prepayToFloor(S,t.id);if(moved&&t.id===S.club)record(S,'salaryPrepaid',{amount:moved,byGm:true});}
  }
  if(S.club&&!S.cap.gmHandles){
    const gap=round2(CAP_FLOOR*S.cap.limit-committed(S,S.club));
    if(gap>0)record(S,'floorWarning',{gap,due:MILESTONES.review});
  }
}
function ownerPrepay(S){
  const moved=prepayToFloor(S,S.club);
  if(!moved)return 'unavailable';
  record(S,'salaryPrepaid',{amount:moved,byGm:false});
  return 'ok';
}
// February: a club that spent under the floor pays the difference to its players.
function floorCheck(S){
  if(!S.club)return;
  const floor=round2(CAP_FLOOR*S.cap.limit),spent=committed(S,S.club); // the floor follows the league cap, not carryover
  if(spent>=floor)return;
  const shortfall=round2(floor-spent);
  postCash(S,'floorShortfall',-shortfall);
  record(S,'floorShortfall',{floor,spent,shortfall});
}
// Release until under the cap, cheapest football loss per dollar first. Each cut
// is replaced on a minimum deal, so the savings that count are net of that.
function comply(S,id,forced){
  const cuts=[],r=rngFor(S.rng),saves=x=>capHit(x)-releaseCost(S,x).deadNow-S.cap.minSalary;
  for(let guard=0;guard<30&&capRoom(S,id)<0;guard++){
    const starters=starterSet(S.rosters[id]);
    const p=S.rosters[id].filter(x=>saves(x)>.5).sort((a,b)=>(Number(starters.has(a.id))-Number(starters.has(b.id)))||((a.rating-1.2*saves(a))-(b.rating-1.2*saves(b))))[0];
    if(!p)break;
    cuts.push({...snap(p),dead:releasePlayer(S,id,p.id).dead});
    if(rosterCount(S,id)<53)signMinimum(S,id,p.pos,r);
  }
  if(forced&&id===S.club&&cuts.length)record(S,'capCompliance',{cuts});
  return cuts;
}
// Each week of the market: staff-run clubs bid for needs they can afford, and players sign with the best offer.
function processFreeAgency(S,r){
  const t=now(S),FA=S.fa;
  if(!FA.pool.length)return;
  // Camp rosters run large between the league year and final cuts; otherwise the limit is 53.
  const offseason=t>=MILESTONES.leagueYear&&t<MILESTONES.cuts,opening=t>=MILESTONES.leagueYear&&t<=MILESTONES.leagueYear+2;
  const bids={};
  for(const club of shuffled(r,clubs)){
    const id=club.id;
    if(!handledByStaff(S,id))continue;
    const size=rosterCount(S,id),cap=offseason?60:53,hardMax=offseason?75:53;
    if(size>=hardMax)continue;
    for(let n=0;n<(opening?2:0)+(capRoom(S,id)>S.cap.limit*.2?2:1);n++){
      let room=capRoom(S,id)-(offseason&&t<MILESTONES.draft?8:0)-Object.values(bids).flat().filter(b=>b.club===id).reduce((a,b)=>a+termsHit(b.terms),0);
      const needs=positions.map(([pos])=>pos).filter(pos=>slotsOpen(S,id,pos)>0);
      // A free agent is worth a bid if he fills a hole or beats the weakest starter at his position.
      const floorAt=pos=>{const n=startersAt(pos),best=S.rosters[id].filter(x=>x.pos===pos&&!x.out).map(x=>x.rating).sort((a,b)=>b-a);return best[n-1]??0;};
      const approach=approachFor(S,id),focus=focusFor(S,id);
      const gain=p=>(needs.includes(p.pos)?10:p.rating-floorAt(p.pos))+(focus.includes(p.pos)?4:0);
      const target=FA.pool.filter(p=>(needs.includes(p.pos)||size<cap||gain(p)>=3)&&termsHit(p.ask)<=room&&!(approach==='rebuild'&&p.age>=30)&&!(bids[p.id]??[]).some(b=>b.club===id)&&!(id===S.club&&S.staff.proposals.some(x=>x.playerId===p.id)))
        .sort((a,b)=>gain(b)-gain(a)||b.rating-a.rating)[0];
      if(!target)break;
      const k=.95+r()*.2+Math.min(.3,Math.max(0,capRoom(S,id)/S.cap.limit-.1))+(approach==='win-now'?.06:0); // clubs with room to burn overpay
      const terms={salary:round2(target.ask.salary*k),years:target.ask.years,bonus:round2(target.ask.bonus*k),gYears:target.ask.gYears??0};
      if(id===S.club&&needsApproval(S,termsHit(terms))){propose(S,'fa',target,terms);continue;}
      (bids[target.id]??=[]).push({club:id,terms});
    }
  }
  for(const [pid,o] of Object.entries(FA.offers))(bids[pid]??=[]).push({club:S.club,terms:{salary:o.salary,years:o.years,bonus:o.bonus,gYears:o.gYears??0},funding:o.funding,owner:true});
  // Players hold out for their ask early, and settle as the weeks go by.
  const weeksOpen=t>=MILESTONES.leagueYear?t-MILESTONES.leagueYear:t+(SEASON_TICKS-MILESTONES.leagueYear);
  const threshold=Math.max(.78,.97-.02*weeksOpen);
  for(const [pid,list] of Object.entries(bids)){
    const p=FA.pool.find(x=>x.id===pid);if(!p)continue;
    const scored=list.filter(b=>termsHit(b.terms)<=capRoom(S,b.club)).map(b=>({...b,u:utility(S,p,b.terms,b.club,p.ask)})).sort((a,b)=>b.u-a.u);
    const best=scored[0],owner=list.find(b=>b.owner);
    if(!best||best.u<threshold)continue;
    signPlayer(S,best.club,p,best.terms,'veteran',best.funding??'club');
    if(best.owner)record(S,'faSigned',{player:snap(p),terms:best.terms,funding:best.funding,priority:priorityFor(p)});
    else if(best.club===S.club)record(S,'faSigned',{player:snap(p),terms:best.terms,byGm:true});
    else if(owner)record(S,'faLost',{player:snap(p),club:best.club,terms:best.terms,priority:priorityFor(p)});
    if(p.rating>=80)news(S,p.pos+' '+p.name+' signs with '+teamName(best.club)+': '+best.terms.years+' years, $'+round1(termsHit(best.terms)*best.terms.years)+'M');
  }
  // Proposals for players who just signed elsewhere are moot.
  if(S.staff?.proposals)S.staff.proposals=S.staff.proposals.filter(P=>P.kind!=='fa'||FA.pool.some(x=>x.id===P.playerId));
  // Players nobody wanted ask for less as the market cools.
  if(t>MILESTONES.leagueYear+2||t<MILESTONES.leagueYear)for(const p of FA.pool){
    p.ask={...p.ask,salary:round2(Math.max(S.cap.minSalary,p.ask.salary*.92)),bonus:round2(p.ask.bonus*.85),gYears:p.ask.salary*.92<S.cap.minSalary*4?0:p.ask.gYears};
  }
}
function signMinimum(S,id,pos,r){
  let p=S.fa.pool.filter(x=>x.pos===pos).sort((a,b)=>b.rating-a.rating)[0];
  if(!p){p={id:'m'+cur(S).number+'-'+id+'-'+randInt(r,1e9),name:personName(r),pos,rating:48+randInt(r,8),age:23+randInt(r,6)};p.potential=p.rating+randInt(r,4);}
  signPlayer(S,id,p,minimumTerms(S),'minimum','club');
}
// Before final cuts, staff-run clubs fill holes with minimum deals.
function fillRosters(S,r){
  for(const t of clubs){
    if(!handledByStaff(S,t.id)&&rosterCount(S,t.id)>=53)continue;
    for(let guard=0;guard<20;guard++){
      const need=positions.map(([pos])=>pos).find(pos=>slotsOpen(S,t.id,pos)>0);
      if(rosterCount(S,t.id)>=53&&!need)break;
      let p=S.fa.pool.filter(x=>!need||x.pos===need).sort((a,b)=>b.rating-a.rating)[0];
      if(!p){
        const pos=need??positionWeights[randInt(r,positionWeights.length)];
        p={id:'m'+cur(S).number+'-'+t.id+'-'+guard+'-'+randInt(r,1e6),name:personName(r),pos,rating:48+randInt(r,8),age:23+randInt(r,6)};
        p.potential=p.rating+randInt(r,4);
      }
      signPlayer(S,t.id,p,minimumTerms(S),'minimum','club');
    }
  }
}
// The pool keeps only players someone might still sign.
function prunePool(S){
  S.fa.pool=S.fa.pool.filter(p=>p.age<=33).sort((a,b)=>b.rating-a.rating).slice(0,80);
  for(const id of Object.keys(S.fa.offers))if(!S.fa.pool.some(p=>p.id===id))delete S.fa.offers[id];
}

// Words for contract events.
const money1=n=>'$'+round1(n)+'M';
function contractEventText(S,e){
  const who=p=>p.pos+' '+p.name;
  const terms=t=>t.years+' year'+(t.years===1?'':'s')+', '+money1(t.salary)+' salary'+(t.bonus?' and a '+money1(t.bonus)+' signing bonus':'')+(t.gYears?', '+t.gYears+' year'+(t.gYears===1?'':'s')+' guaranteed':'');
  switch(e.type){
    case 'playerReleased':return 'We released '+who(e.player)+'.'+(e.owed?' We still owe him '+money1(e.owed)+' in guaranteed salary.':'')+
      (e.dead||e.deadLater?' Dead money: '+money1(e.dead)+' on this year’s cap'+(e.deadLater?' and '+money1(e.deadLater)+' on next year’s':'')+'.':' No dead money.');
    case 'contractRestructured':return 'Restructured '+who(e.player)+': '+money1(e.amount)+' of salary became bonus'+(e.funding==='owner'?', paid out of your pocket':'')+'. That clears '+money1(e.savings)+' of cap room this year and pushes the rest into later years.';
    case 'contractExtended':return 'Extended '+who(e.player)+': '+terms(e.terms)+(e.funding==='owner'&&e.terms.bonus?', bonus paid personally':'')+'.';
    case 'resignings':return (e.byGm?'I handled the re-signings. ':'Re-signing window closed. ')+(e.kept.length?'Kept: '+e.kept.map(p=>who(p)+(p.tagged?' (franchise tag)':'')).join(', ')+'. ':'')+(e.proposed?.length?'Waiting on your approval: '+e.proposed.map(who).join(', ')+'. ':'')+(e.leaving.length?'Heading to free agency unless you act: '+e.leaving.map(who).join(', ')+'.':'Nobody else is leaving.');
    case 'capYear':return 'New cap year: the limit is '+money1(e.limit)+(e.carry?', plus '+money1(e.carry)+' we carried over':'')+'. '+(e.tagged?.length?'Playing on the franchise tag: '+e.tagged.map(who).join(', ')+'. ':'')+(e.departed.length?'Expired and now free agents: '+e.departed.map(who).join(', ')+'. ':'')+'We have '+money1(e.room)+' of room.';
    case 'capWarning':return 'We are '+money1(e.over)+' over the cap. We have to be compliant by the season opener, or I will make the cuts.';
    case 'capCompliance':return 'We were still over the cap at the opener, so I released '+e.cuts.map(p=>who(p)+(p.dead?' ('+money1(p.dead)+' dead)':'')).join(', ')+'.';
    case 'faSigned':return (e.byGm?'I signed ':'Signed ')+who(e.player)+': '+terms(e.terms)+(e.funding==='owner'&&e.terms.bonus?', bonus paid personally':'')+'.';
    case 'faLost':return who(e.player)+' signed with '+teamName(e.club)+' instead: '+terms(e.terms)+'.'+(e.priority?' He cared most about '+PRIORITY_LABEL[e.priority]+'.':'');
    case 'playerTagged':return 'We put the franchise tag on '+who(e.player)+': one year at '+money1(e.amount)+', fully guaranteed, starting at the new league year.';
    case 'optionExercised':return 'We picked up the fifth-year option on '+who(e.player)+': '+money1(e.amount)+' next season, guaranteed.';
    case 'salaryPrepaid':return (e.byGm?'To reach the salary floor, I paid ':'You paid ')+money1(e.amount)+' of future salary early. Cap hits rise this year and fall by the same amount later; the cash is the same over the contracts.';
    case 'floorWarning':return 'We are '+money1(e.gap)+' under the salary floor. Prepay salary from the Contracts page before '+weekLabel(e.due)+', or the club pays the gap to the players.';
    case 'floorShortfall':return 'We spent '+money1(e.spent)+' against a salary floor of '+money1(e.floor)+', so the club owes its players the '+money1(e.shortfall)+' difference.';
  }
  return '';
}

// ---- Contracts view ------------------------------------------------------------
const contractsUi={notice:'',confirm:null,funding:'club',neg:null};
function negotiationPanel(S){
  const N=contractsUi.neg;if(!N)return '';
  const p=N.kind==='fa'?S.fa.pool.find(x=>x.id===N.playerId):S.rosters[S.club].find(x=>x.id===N.playerId);
  if(!p){contractsUi.neg=null;return '';}
  const ask=N.kind==='fa'?p.ask:extensionTerms(S,p),t=N.terms,read=agentRead(S,p,t,S.club,ask);
  const steps=(lo,hi,step)=>{const out=[];for(let v=lo;v<=hi+1e-9;v+=step)out.push(round1(v));return out;};
  const salaries=[...new Set([...steps(Math.max(S.cap.minSalary,ask.salary*.6),ask.salary*1.6,Math.max(.1,ask.salary*.05)),round1(t.salary)])].sort((a,b)=>a-b);
  const bonuses=[...new Set([...steps(0,Math.max(ask.bonus*2,termsHit(ask)*t.years*.5),Math.max(.5,round1(Math.max(ask.bonus,termsHit(ask))*.1))),round1(t.bonus)])].sort((a,b)=>a-b);
  const total=round2(t.salary*t.years+t.bonus),guaranteed=round2(t.bonus+t.salary*Math.min(t.gYears,t.years));
  return '<div class="confirm negotiation"><div><strong>'+esc((N.kind==='fa'?'Free-agent offer: ':'Extension: ')+p.pos+' '+p.name+', age '+p.age+', rating '+p.rating)+'</strong>'+
    '<small>'+esc('Asking '+ask.years+' yrs · '+m1(ask.salary)+' salary'+(ask.bonus?' · '+m1(ask.bonus)+' bonus':'')+(ask.gYears?' · '+ask.gYears+' yr guaranteed':'')+'. He cares most about '+PRIORITY_LABEL[priorityFor(p)]+'.')+'</small></div>'+
    '<div class="controls"><label>Years <select id="negYears">'+[1,2,3,4,5,6].map(v=>option(v,v,v===t.years)).join('')+'</select></label>'+
    '<label>Salary <select id="negSalary">'+salaries.map(v=>option(v,'$'+v.toFixed(1)+'M',v===round1(t.salary))).join('')+'</select></label>'+
    '<label>Signing bonus <select id="negBonus">'+bonuses.map(v=>option(v,'$'+v.toFixed(1)+'M',v===round1(t.bonus))).join('')+'</select></label>'+
    '<label>Guaranteed years <select id="negG">'+Array.from({length:t.years+1},(_,i)=>option(i,i,i===t.gYears)).join('')+'</select></label></div>'+
    '<p>'+esc('Cap hit '+m1(termsHit(t))+' a year · '+m1(total)+' total · '+m1(guaranteed)+' guaranteed. '+read.text)+'</p>'+
    (N.counter?'<p><b>'+esc('His agent counters: '+N.counter.years+' yrs, '+m1(N.counter.salary)+' salary, '+m1(N.counter.bonus)+' bonus, '+N.counter.gYears+' guaranteed.')+'</b></p>':'')+
    '<div class="controls"><button id="negSubmit">'+(N.kind==='fa'?'Make this offer':'Offer this extension')+'</button>'+(N.counter?'<button id="negAccept">Accept the counter</button>':'')+'<button id="negCancel">Cancel</button></div></div>';
}
function contractsView(){
  const S=save,id=S.club;
  if(!id)return heading('CONTRACTS','Choose a club first')+'<p>Take ownership on the Owner desk to open the cap sheet.</p>';
  const roster=S.rosters[id],room=capRoom(S,id),dead=S.cap.dead[id]??0,carry=S.cap.carry[id]??0,later=S.cap.deadNext[id]??0;
  let html=heading('CONTRACTS AND THE CAP',teamName(id))+'<div class="units">'+
    '<div><small>Salary cap</small><b>'+m1(limitFor(S,id))+'</b>'+(carry?m1(S.cap.limit)+' + '+m1(carry)+' carried over':'Runs to March Week 2')+'</div>'+
    '<div><small>Committed</small><b>'+m1(committed(S,id))+'</b>'+roster.length+' contracts'+(dead?' · '+m1(dead)+' dead':'')+'</div>'+
    '<div><small>Cap room</small><b>'+m1(room)+'</b>'+(room<0?'Over the cap':'Up to '+m1(CARRY_MAX)+' carries over')+'</div>'+
    '<div><small>Next year</small><b>'+m1(round2(nextYearCommitted(S,id)+later))+'</b>Committed'+(later?' · '+m1(later)+' dead':'')+'</div>'+
    '<div><small>Salary floor</small><b>'+m1(round2(CAP_FLOOR*S.cap.limit))+'</b>Spend less and pay the gap</div></div>';
  html+='<p>Salary is paid in cash during the season; guaranteed salary is owed even if you release the player. Signing bonuses are paid in cash up front but count against the cap a little each year. Releases from June through the season spread dead money over two cap years.</p>'+
    '<div class="controls"><label>Re-signings and free agency <select id="gmHandles">'+option('gm','The GM handles them',S.cap.gmHandles)+option('owner','I decide',!S.cap.gmHandles)+'</select></label>'+
    '<label>Signing bonuses <select id="bonusFunding">'+option('club','Club pays',contractsUi.funding==='club')+option('owner','I pay personally',contractsUi.funding==='owner')+'</select></label></div>'+
    (contractsUi.notice?'<p><b>'+esc(contractsUi.notice)+'</b></p>':'')+negotiationPanel(S);
  const gap=round2(CAP_FLOOR*S.cap.limit-committed(S,id));
  if(gap>0&&now(S)<MILESTONES.review&&now(S)>0)html+='<div class="confirm"><span>'+esc('We are '+m1(gap)+' under the salary floor. Prepaying future salary closes the gap without spending more over the contracts; otherwise the club pays the difference in '+weekLabel(MILESTONES.review)+'.')+'</span><button id="prepay">Prepay salary</button></div>';
  const c=contractsUi.confirm;
  if(c){
    const p=roster.find(x=>x.id===c.playerId);
    if(p){const r=releaseCost(S,p);
      html+='<div class="confirm"><span>'+esc('Release '+p.pos+' '+p.name+'? '+(r.owed?'We would still owe '+m1(r.owed)+' in guaranteed salary. ':'His salary comes off the books. ')+
        'Dead money: '+m1(r.deadNow)+' this year'+(r.deadLater?' and '+m1(r.deadLater)+' next year':'')+'.')+'</span><button id="confirmRelease">Release him</button><button id="cancelRelease">Keep him</button></div>';}
  }
  const expiring=roster.filter(p=>p.contract.yearsLeft===1).sort((a,b)=>b.rating-a.rating);
  const starters=starterSet(roster),tag=S.cap.tags[id];
  html+='<h2>Expiring contracts</h2>'+(expiring.length?'<p>'+esc('These deals end at the new league year. '+(S.cap.gmHandles?'The GM will re-sign the ones worth keeping in '+weekLabel(RESIGN_TICK)+'. ':'Extend anyone you want to keep before then. ')+
      (tagWindow(S)?'The franchise tag window is open until '+weekLabel(MILESTONES.leagueYear)+'.':'The franchise tag window opens '+weekLabel(TAG_OPEN)+'.'))+'</p>'+
    '<div class="wide"><table><thead><tr><th>Player</th><th>Age</th><th>Rating</th><th>Cap hit</th><th>Extension ask</th><th></th></tr></thead><tbody>'+
    expiring.map(p=>{const t=extensionTerms(S,p),gm=(starters.has(p.id)||p.rating>=72)&&p.age<=31?'GM: keep':'GM: let walk';
      const tagged=tag?.playerId===p.id;
      const actions='<button data-negotiate="extend:'+esc(p.id)+'">Negotiate</button><button data-extend="'+esc(p.id)+'">Extend at ask</button>'+
        (p.contract.option?'<button data-option="'+esc(p.id)+'" title="'+m1(optionAmount(S,p))+' next season">Pick up option</button>':'')+
        (tagged?'<button data-untag="1">Remove tag</button>':tagWindow(S)&&!tag?'<button data-tag="'+esc(p.id)+'" title="'+m1(tagAmount(S,p.pos))+' for one year">Franchise tag</button>':'');
      return '<tr><td>'+esc(p.pos+' '+p.name)+'<small>'+(tagged?'Franchise tag · '+m1(tag.amount):gm)+' · wants '+PRIORITY_LABEL[priorityFor(p)]+'</small></td><td>'+p.age+'</td><td>'+p.rating+'</td><td>'+m1(capHit(p))+'</td><td>'+esc(t.years+' yrs · '+m1(termsHit(t))+'/yr'+(t.bonus?' · '+m1(t.bonus)+' bonus':''))+'</td><td class="calls">'+actions+'</td></tr>';}).join('')+'</tbody></table></div>':'<p>No contracts expire this year.</p>');
  html+='<h2>Cap sheet</h2><div class="wide"><table class="capsheet"><thead><tr><th>Player</th><th>Rating</th><th>Cap hit</th><th>Salary</th><th>Years</th><th>Gtd</th><th>Dead if cut</th><th></th></tr></thead><tbody>'+
    [...roster].sort((a,b)=>capHit(b)-capHit(a)).map(p=>{const rs=restructureSavings(S,p);
      return '<tr><td>'+esc(p.pos+' '+p.name)+'<small>Age '+p.age+({rookie:' · rookie deal',tag:' · franchise tag'}[p.contract.kind]??'')+(p.contract.nextSalary?' · option year '+m1(p.contract.nextSalary):'')+'</small></td><td>'+p.rating+'</td><td>'+m1(capHit(p))+'</td><td>'+m1(p.contract.salary)+'</td><td>'+p.contract.yearsLeft+'</td><td>'+(p.contract.gYears??0)+'</td><td>'+m1(deadIfCut(p,S))+'</td><td class="calls">'+
        (rs?'<button data-restructure="'+esc(p.id)+'" title="Clears '+m1(rs.savings)+' this year">Restructure</button>':'')+'<button data-release="'+esc(p.id)+'">Release</button></td></tr>';}).join('')+'</tbody></table></div>';
  const pool=[...S.fa.pool].sort((a,b)=>b.rating-a.rating).slice(0,30);
  html+='<h2>Free agents</h2>'+(pool.length?'<p>'+esc('Players weigh every offer the week it arrives: money, guarantees, years, and how good your team is, depending on what they care about. Early in free agency they hold out for their ask; later they settle.'+(S.cap.gmHandles?' The GM also signs free agents to fill holes; switch to “I decide” to run it yourself.':''))+'</p>'+
    '<div class="wide"><table><thead><tr><th>Player</th><th>Age</th><th>Rating</th><th>Asking</th><th>Cap hit</th><th></th></tr></thead><tbody>'+
    pool.map(p=>{const o=S.fa.offers[p.id];
      return '<tr><td>'+esc(p.pos+' '+p.name)+'<small>Wants '+PRIORITY_LABEL[priorityFor(p)]+'</small></td><td>'+p.age+'</td><td>'+p.rating+'</td><td>'+esc(p.ask.years+' yrs · '+m1(p.ask.salary)+(p.ask.bonus?' + '+m1(p.ask.bonus)+' bonus':'')+(p.ask.gYears?' · '+p.ask.gYears+' gtd':''))+'</td><td>'+m1(termsHit(p.ask))+'</td><td class="calls">'+
        (o?'<small>'+esc('Offer in: '+o.years+' yrs, '+m1(termsHit(o))+'/yr')+'</small><button data-withdraw="'+esc(p.id)+'">Withdraw</button>':'<button data-negotiate="fa:'+esc(p.id)+'">Negotiate</button><button data-offer="'+esc(p.id)+'">Offer asking terms</button>')+'</td></tr>';}).join('')+'</tbody></table></div>':
    '<p>'+esc('Free agency opens at the new league year, '+weekLabel(MILESTONES.leagueYear)+', when expired contracts hit the market.')+'</p>');
  return html;
}


// ---------------------------------------------------------------------------
// Coaches and front office
//
// staff.clubs[id] = {hc, gm}   every club's head coach and general manager
//   hc: ratings {offense, defense, development, gameday}, style {offense, defense, lineup}
//   gm: ratings {scouting, negotiation, cap}, philosophy win-now | balanced | rebuild
//   both: contract {years, salary}, hired {season}, record {w,l,t}, commitments [...]
// staff.directives  the owner's instructions to their GM
// staff.proposals   GM moves waiting for the owner's approval
// staff.market      candidates for open jobs, shared with every club
// staff.openings    jobs open around the league
// staff.track       starts by the owner's players this season, for reviews
// ---------------------------------------------------------------------------
const HC_STYLES={offense:['pass','balanced','run'],defense:['pressure','balanced','coverage'],lineup:['youth','merit','veteran']};
const GM_PHILOSOPHIES=['win-now','balanced','rebuild'];
const STYLE_LABEL={pass:'pass-first offense',balanced:'balanced',run:'run-first offense',pressure:'pressure defense',coverage:'coverage defense',
  youth:'plays young players',merit:'plays the best player',veteran:'trusts veterans','win-now':'win now',rebuild:'rebuild'};
const FOCUS_GROUPS={none:[],QB:['QB'],OL:['OT','OG','C'],receivers:['WR','TE'],RB:['RB'],'pass rush':['DE'],DT:['DT'],LB:['LB'],secondary:['CB','S']};
const PASS_RATE={pass:.67,balanced:.62,run:.55};
const between2=(r,lo,hi)=>lo+randInt(r,hi-lo+1);
const ordinal=n=>n+(n%100>=11&&n%100<=13?'th':['th','st','nd','rd'][n%10]??'th');

function makeCoach(r,{interim=false}={}){
  const lo=interim?40:52,hi=interim?62:88;
  return {id:'hc-'+randomId(r),role:'hc',name:personName(r),age:between2(r,38,66),interim,
    ratings:{offense:between2(r,lo,hi),defense:between2(r,lo,hi),development:between2(r,lo,hi),gameday:between2(r,lo,hi)},
    style:{offense:HC_STYLES.offense[randInt(r,3)],defense:HC_STYLES.defense[randInt(r,3)],lineup:HC_STYLES.lineup[randInt(r,3)]},
    contract:{years:interim?1:between2(r,3,5),salary:interim?2:round1(5+randInt(r,90)/10)},hired:null,record:{w:0,l:0,t:0},commitments:[]};
}
function makeGm(r,{interim=false}={}){
  const lo=interim?40:50,hi=interim?62:88;
  return {id:'gm-'+randomId(r),role:'gm',name:personName(r),age:between2(r,36,64),interim,
    ratings:{scouting:between2(r,lo,hi),negotiation:between2(r,lo,hi),cap:between2(r,lo,hi)},philosophy:GM_PHILOSOPHIES[randInt(r,3)],
    contract:{years:interim?1:between2(r,3,5),salary:interim?1:round1(2+randInt(r,40)/10)},hired:null,record:{w:0,l:0,t:0},commitments:[]};
}
const coachScore=c=>c.ratings.offense+c.ratings.defense+c.ratings.development*.6+c.ratings.gameday*.6;
const gmScore=g=>g.ratings.scouting+g.ratings.negotiation*.7+g.ratings.cap*.6;
function makeStaffAll(S,r){
  S.staff.clubs=Object.fromEntries(clubs.map(t=>{
    const hc=makeCoach(r),gm=makeGm(r);
    hc.hired=gm.hired={season:Math.max(1,cur(S).number-randInt(r,4))};
    return [t.id,{hc,gm}];
  }));
  Object.assign(S.staff,{directives:{focus:'none',approach:'gm',approvalOver:null,tradeAuthority:'all'},proposals:[],market:{hc:[],gm:[]},openings:[],
    track:{season:cur(S).number,games:0,starts:{}},nextProposalId:1});
}
const hcOf=(S,id)=>S.staff.clubs[id].hc;
function initDepth(S,r){
  S.depth={order:{},inactive:[],active:[],overrides:0};
  S.irReturns={season:cur(S).number,counts:{}};
  S.staff.directives.rosterMoves??='gm';
  for(const C of Object.values(S.staff.clubs))C.hc.trust??=70;
  S.practice=Object.fromEntries(clubs.map(t=>[t.id,[]]));
  for(const t of clubs)fillPractice(S,t.id,r);
}
const gmOf=(S,id)=>S.staff.clubs[id].gm;

// ---- How staff shape football ---------------------------------------------------
// Lineup bias: youth coaches start the younger of two close players, veteran coaches the older.
function lineupBias(coach,p){
  if(!coach)return 0;
  const order=coach.ownerOrder?.[p.pos];
  if(order){const i=order.indexOf(p.id);if(i>=0)return 10000-i*100;} // the owner's order outranks any rating gap
  if(coach.qbStarter===p.id)return 100;
  const s=coach.style.lineup;
  if(s==='youth')return p.age<=24?2:p.age>=31?-1:0;
  if(s==='veteran')return p.age>=29?2:p.age<=23?-1:0;
  return 0;
}
function clubUnits(S,id){
  const hc=S.staff?.clubs?.[id]?.hc;
  const u=S.practice?personnel(activesFor(S,id),lineupCoach(S,id)):personnel(S.rosters[id],hc);
  if(!hc)return u;
  const o=(hc.ratings.offense-65)*.08,d=(hc.ratings.defense-65)*.08;
  u.passing+=o+(hc.style.offense==='pass'?.8:0);u.rushing+=o+(hc.style.offense==='run'?.8:0);
  u.pressure+=d+(hc.style.defense==='pressure'?.8:0);u.coverage+=d+(hc.style.defense==='coverage'?.8:0);u.runDefense+=d;
  u.passRate=PASS_RATE[hc.style.offense];u.gameday=hc.ratings.gameday;
  u.offense=Math.round(.62*u.passing+.38*u.rushing);u.defense=Math.round(.62*(.58*u.coverage+.42*u.pressure)+.38*u.runDefense);
  return u;
}
// An average development coach (about 70) leaves growth where it was; the best add about 7%.
const devFactor=(S,id)=>{const hc=S.staff?.clubs?.[id]?.hc;return hc?.72+hc.ratings.development/250:1;};
// What a GM thinks a prospect is worth: the consensus grade, blurred by his scouting.
function perceivedGrade(S,id,p){
  const gm=S.staff?.clubs?.[id]?.gm;
  if(!gm)return p.grade;
  let h=0;for(const ch of id+p.id)h=(h*33+ch.charCodeAt(0))%100003;
  const noise=(h%2001)/1000-1;
  return Math.round(.55*p.potential+.45*p.rating+(DRAFT_POSITION_VALUE[p.pos]??0)+noise*(95-gm.ratings.scouting)/6);
}
const approachFor=(S,id)=>id===S.club&&S.staff.directives.approach!=='gm'?S.staff.directives.approach:gmOf(S,id).philosophy;
const focusFor=(S,id)=>id===S.club?FOCUS_GROUPS[S.staff.directives.focus]??[]:[];
const tradeFactor=S=>S?.staff?.clubs&&S.club?1.12-gmOf(S,S.club).ratings.negotiation*.0016:1.04;
const askFactor=(S,id)=>S?.staff?.clubs?.[id]?1.06-gmOf(S,id).ratings.negotiation*.0012:1;

// The owner's club: count who starts each game, for coach and GM reviews.
function trackStarts(S,units,games){
  if(!S.club||!S.staff.track)return;
  if(S.staff.track.season!==cur(S).number)S.staff.track={season:cur(S).number,games:0,starts:{}};
  if(!games.some(g=>g.home===S.club||g.away===S.club))return;
  const T=S.staff.track,u=units[S.club];
  T.games++;
  for(const [pos,,n] of positions)for(const p of u.chart[pos].filter(x=>!x.out).slice(0,n))T.starts[p.id]=(T.starts[p.id]??0)+1;
}
function creditRecords(S,games){
  for(const g of games){
    if(!g.score)continue;
    for(const [id,mine,theirs] of [[g.home,g.score[0],g.score[1]],[g.away,g.score[1],g.score[0]]]){
      const club=S.staff.clubs[id];
      for(const person of [club.hc,club.gm])person.record[mine>theirs?'w':mine<theirs?'l':'t']++;
    }
  }
}

// ---- Interviews: what a candidate says about the roster you actually have ----------
const ovr=(S,id)=>clubUnits(S,id);
function leagueRank(S,id,key){return clubs.map(t=>({id:t.id,v:personnel(S.rosters[t.id])[key]})).sort((a,b)=>b.v-a.v).findIndex(x=>x.id===id)+1;}
function coachInterview(S,c){
  const id=S.club,roster=S.rosters[id],out=[],commit=[];
  const qbs=roster.filter(p=>p.pos==='QB').sort((a,b)=>b.rating-a.rating),[q1,q2]=qbs;
  if(q1&&q2&&c.style.lineup==='youth'&&q1.age>=31&&q2.age<=26&&q1.rating-q2.rating<=7){
    out.push('I would start '+q2.name+' at quarterback. He is '+q2.age+' and rated '+q2.rating+'; '+q1.name+' has given you what he can.');
    commit.push({type:'qbStarter',playerId:q2.id,name:q2.name});
  }else if(q1&&q2&&c.style.lineup==='merit'&&q1.rating-q2.rating<=3){
    out.push('Quarterback is an open competition between '+q1.name+' and '+q2.name+'. The better one in camp starts.');
  }else if(q1){
    out.push(q1.name+' is my quarterback.');
    commit.push({type:'qbStarter',playerId:q1.id,name:q1.name});
  }
  const line=['OG','OT','C'].map(pos=>({pos,worst:roster.filter(p=>p.pos===pos).sort((a,b)=>b.rating-a.rating)[startersAt(pos)-1]})).filter(x=>x.worst).sort((a,b)=>a.worst.rating-b.worst.rating)[0];
  if(line&&line.worst.rating<70&&c.ratings.offense>=c.ratings.defense){
    out.push('I need a '+({OG:'guard',OT:'tackle',C:'center'}[line.pos])+' to protect '+(q1?.name??'the quarterback')+'. '+line.worst.name+' ('+line.worst.rating+') cannot start for a contender.');
    commit.push({type:'needPosition',pos:line.pos});
  }
  const rush=leagueRank(S,id,'pressure');
  if(c.style.defense==='pressure'&&rush>12){
    out.push('Your pass rush ranks '+ordinal(rush)+' in the league. I run a pressure front, and I will need an edge rusher.');
    commit.push({type:'needPosition',pos:'DE'});
  }else if(c.ratings.defense>c.ratings.offense+6&&leagueRank(S,id,'coverage')>12){
    out.push('I will fix your secondary with what is already here. Points allowed will go down.');
    commit.push({type:'defense'});
  }
  if(c.style.lineup==='youth'){
    const kids=roster.filter(p=>p.age<=24&&(p.potential??0)>=p.rating+5&&p.pos!=='QB').sort((a,b)=>b.potential-a.potential).slice(0,2);
    if(kids.length){out.push('I would play '+kids.map(p=>p.pos+' '+p.name).join(' and ')+' now. That is how they get better.');commit.push({type:'youth',playerIds:kids.map(p=>p.id),names:kids.map(p=>p.name)});}
  }
  const strength=ovr(S,id),league=clubs.map(t=>ovr(S,t.id)),avg=key=>league.reduce((a,u)=>a+u[key],0)/league.length;
  const edge=(strength.offense-avg('offense'))+(strength.defense-avg('defense'));
  const target=Math.max(5,Math.min(13,Math.round(8.5+edge*.35+(coachScore(c)-260)/40+(c.style.lineup==='veteran'?.5:0))));
  out.push(target>=9?'With me, this roster wins '+target+' games.':target>=7?'This roster can win '+target+' games, and more once it is mine.':'Be patient with me. This roster wins '+target+' games this year; give me two years.');
  commit.push({type:'wins',target});
  return {statements:out,commitments:commit};
}
function gmInterview(S,g){
  const id=S.club,roster=S.rosters[id],out=[],commit=[],room=capRoom(S,id);
  const q1=roster.filter(p=>p.pos==='QB').sort((a,b)=>b.rating-a.rating)[0];
  const units=[['pass rush','pressure','DE'],['secondary','coverage','CB'],['run defense','runDefense','DT'],['passing game','passing','WR'],['running game','rushing','RB']]
    .map(([label,key,pos])=>({label,pos,rank:leagueRank(S,id,key)})).sort((a,b)=>b.rank-a.rank);
  const worst=units[0];
  if(g.philosophy==='win-now'){
    out.push('This team should be trying to win now. We have '+m1(room)+' of cap room and I would spend it on the '+worst.label+', which ranks '+ordinal(worst.rank)+'.');
    commit.push({type:'acquirePosition',pos:worst.pos,label:worst.label});
  }else if(g.philosophy==='rebuild'){
    out.push('Honestly, this is a two-year rebuild. I would keep about '+m1(Math.max(10,Math.round(room/2)))+' of our room for next year and build through the draft.');
    commit.push({type:'draftEarly',pos:worst.pos,label:worst.label});
  }else{
    out.push('The '+worst.label+' ranks '+ordinal(worst.rank)+'. I would fix it with a mix of the draft and a free agent we can afford.');
    commit.push({type:'acquirePosition',pos:worst.pos,label:worst.label});
  }
  if(q1&&q1.age>=31){out.push(q1.name+' is '+q1.age+'. I would draft his successor in the first two rounds.');commit.push({type:'draftPosition',pos:'QB'});}
  const hc=hcOf(S,id),ask=hc.commitments.find(x=>x.type==='needPosition');
  if(ask&&!hc.interim){
    const posName={OG:'guard',OT:'tackle',C:'center',DE:'edge rusher'}[ask.pos]??ask.pos;
    if(ask.pos!==worst.pos)out.push('I hear '+hc.name+' wants a '+posName+'. I would rather put the money into the '+worst.label+'.');
    else out.push('I agree with '+hc.name+' about the '+posName+'.');
  }
  out.push(g.ratings.cap>=70?'You will not see much dead money while I am here.':'I will take on dead money if it buys us a better roster.');
  return {statements:out,commitments:commit};
}

// ---- Reviews: commitments against what happened -----------------------------------
function evaluateCommitment(S,c,person){
  const T=S.staff.track,games=Math.max(1,T.games),row=standings(S).flat().find(x=>x.id===S.club);
  const since=person.hired?.season??1,snapshot=new Set(person.rosterAtHire??[]);
  switch(c.type){
    case 'wins':{const w=row.w;return {status:w>=c.target?'kept':w>=c.target-2?'close':'broken',text:'Promised '+c.target+' wins; got '+w+'.'};}
    case 'qbStarter':{const n=T.starts[c.playerId]??0,benched=S.depth?.order?.QB&&S.depth.order.QB[0]!==c.playerId;
      if(n<games*.7&&benched)return {status:'broken',blame:'owner',text:'Said '+c.name+' would start at QB; he started '+n+' of '+T.games+' after you overruled him.'};
      return {status:n>=games*.7?'kept':n>0?'close':'broken',text:'Said '+c.name+' would start at QB; he started '+n+' of '+T.games+'.'};}
    case 'youth':{const n=c.playerIds.map(id=>T.starts[id]??0);const ok=n.filter(x=>x>=games/2).length;
      return {status:ok===n.length?'kept':ok?'close':'broken',text:'Said he would play '+c.names.join(' and ')+'; starts: '+n.join(', ')+'.'};}
    case 'needPosition':{const added=S.rosters[S.club].filter(p=>p.pos===c.pos&&!snapshot.has(p.id)&&(T.starts[p.id]??0)>=Math.min(6,games/2));
      return {status:added.length?'kept':'broken',blame:added.length?null:'gm',text:'Asked for a starting '+c.pos+'; '+(added.length?added.map(p=>p.name).join(', ')+' arrived and started.':'nobody new started there.')};}
    case 'defense':{const rank=pointsAllowedRank(S);return {status:rank<=12?'kept':rank<=18?'close':'broken',text:'Promised a better defense; points allowed ranked '+ordinal(rank)+'.'};}
    case 'acquirePosition':case 'draftPosition':case 'draftEarly':{
      const drafted=S.draftHistory.filter(d=>d.season>=since).flatMap(d=>d.picks).filter(x=>x.club===S.club&&x.pos===c.pos&&(c.type==='acquirePosition'||x.round<=2));
      const added=c.type==='acquirePosition'?S.rosters[S.club].filter(p=>p.pos===c.pos&&!snapshot.has(p.id)&&p.rating>=70):[];
      const ok=drafted.length+added.length>0;
      return {status:ok?'kept':'broken',text:(c.type==='acquirePosition'?'Promised help at '+(c.label??c.pos):'Promised to draft a '+c.pos+' early')+'; '+(ok?[...added.map(p=>p.name),...drafted.map(x=>x.name)].slice(0,3).join(', ')+'.':'not yet.')};}
  }
  return {status:'kept',text:''};
}
function pointsAllowedRank(S){
  return standings(S).flat().sort((a,b)=>a.pa-b.pa).findIndex(x=>x.id===S.club)+1;
}
function staffReview(S){
  if(!S.club)return;
  const C=S.staff.clubs[S.club],report=[];
  for(const person of [C.hc,C.gm]){
    const results=person.commitments.map(c=>evaluateCommitment(S,c,person));
    report.push({role:person.role,name:person.name,interim:person.interim,record:{...person.record},results,overrides:person.role==='hc'?S.depth?.overrides??0:0});
  }
  record(S,'staffReview',{report});
}

// ---- Owner actions: instructions, approvals, firing, hiring -----------------------
function setDirective(S,key,value){
  const D=S.staff.directives;
  if(key==='focus'&&value in FOCUS_GROUPS)D.focus=value;
  if(key==='approach'&&['gm',...GM_PHILOSOPHIES].includes(value))D.approach=value;
  if(key==='approvalOver')D.approvalOver=value===''||value==null?null:Number(value);
  if(key==='rosterMoves'&&['gm','owner'].includes(value))D.rosterMoves=value;
  if(key==='tradeAuthority'&&['all','big','none'].includes(value))D.tradeAuthority=value;
}
const needsApproval=(S,hit)=>S.staff.directives.approvalOver!=null&&hit>S.staff.directives.approvalOver;
function propose(S,kind,p,terms){
  if(S.staff.proposals.some(x=>x.playerId===p.id))return;
  S.staff.proposals.push({id:S.staff.nextProposalId++,kind,playerId:p.id,name:p.name,pos:p.pos,rating:p.rating,age:p.age,terms,week:now(S)});
}
function approveProposal(S,id){
  const P=S.staff.proposals.find(x=>x.id===id);if(!P)return 'unavailable';
  S.staff.proposals=S.staff.proposals.filter(x=>x!==P);
  if(P.kind==='trade'||P.kind==='offer')return executeTrade(S,P.trade);
  if(P.kind==='fa')return makeOffer(S,P.playerId,'club',P.terms);
  return extendPlayer(S,P.playerId,'club',P.terms);
}
function declineProposal(S,id){S.staff.proposals=S.staff.proposals.filter(x=>x.id!==id);}
function staffBuyout(person){return round2(person.interim?0:person.contract.salary*person.contract.years);}
function fireStaff(S,role){
  const C=S.staff.clubs[S.club],person=C[role];
  if(!person||person.interim)return 'unavailable';
  const r=rngFor(S.rng),cost=staffBuyout(person);
  if(cost)postCash(S,'staffBuyout',-cost);
  const interim=role==='hc'?makeCoach(r,{interim:true}):makeGm(r,{interim:true});
  interim.hired={season:cur(S).number};interim.vacantSince=cur(S).number*100+now(S);
  C[role]=interim;
  fillMarket(S,r);
  record(S,'staffFired',{role,name:person.name,cost,interim:interim.name});
  news(S,teamName(S.club)+' fire '+(role==='hc'?'head coach ':'general manager ')+person.name);
  return 'ok';
}
function fillMarket(S,r){
  while(S.staff.market.hc.length<8)S.staff.market.hc.push(makeCoach(r));
  while(S.staff.market.gm.length<7)S.staff.market.gm.push(makeGm(r));
}
function interview(S,role,candidateId){
  const c=S.staff.market[role].find(x=>x.id===candidateId);
  if(!c)return 'unavailable';
  c.interview=role==='hc'?coachInterview(S,c):gmInterview(S,c);
  return 'ok';
}
function hire(S,role,candidateId){
  const C=S.staff.clubs[S.club];
  if(!C[role].interim)return 'filled';
  const c=S.staff.market[role].find(x=>x.id===candidateId);
  if(!c)return 'unavailable';
  if(!c.interview)interview(S,role,candidateId);
  S.staff.market[role]=S.staff.market[role].filter(x=>x!==c);
  c.hired={season:cur(S).number};c.commitments=c.interview.commitments;c.rosterAtHire=S.rosters[S.club].map(p=>p.id);
  if(role==='hc'){const qb=c.commitments.find(x=>x.type==='qbStarter');if(qb)c.qbStarter=qb.playerId;}
  C[role]=c;
  record(S,'staffHired',{role,name:c.name,contract:c.contract,statements:c.interview.statements});
  news(S,teamName(S.club)+' hire '+c.name+' as '+(role==='hc'?'head coach':'general manager'));
  return 'ok';
}

// ---- The carousel: AI clubs fire after bad years and hire from the same pool -------
function carousel(S,r){
  const s=cur(S),table=standings(S).flat();
  for(const t of clubs){
    if(t.id===S.club)continue;
    const row=table.find(x=>x.id===t.id),pct=(row.w+.5*row.t)/(row.w+row.l+row.t||1),C=S.staff.clubs[t.id];
    const tenure=s.number-(C.hc.hired?.season??s.number);
    const gt=s.number-(C.gm.hired?.season??s.number);
    const out=[];
    if(pct<.3&&tenure>=1||pct<.42&&tenure>=3||r()<.04)out.push('hc');
    if(pct<.3&&gt>=2||r()<.03)out.push('gm');
    for(const role of out){
      news(S,teamName(t.id)+' part ways with '+(role==='hc'?'head coach ':'general manager ')+C[role].name);
      C[role]=role==='hc'?makeCoach(r,{interim:true}):makeGm(r,{interim:true});
      C[role].hired={season:s.number};
      S.staff.openings.push({club:t.id,role});
    }
  }
  fillMarket(S,r);
}
// February weeks: open jobs get filled, one club at a time, from the shared pool.
function fillOpenings(S,r){
  const last=now(S)>=MILESTONES.leagueYear+2;
  for(const o of [...S.staff.openings]){
    if(!last&&r()>.6)continue;
    const pool=S.staff.market[o.role];
    if(!pool.length){pool.push(o.role==='hc'?makeCoach(r):makeGm(r));}
    const pick=pool.sort((a,b)=>(o.role==='hc'?coachScore(b)-coachScore(a):gmScore(b)-gmScore(a)))[randInt(r,Math.min(3,pool.length))];
    S.staff.market[o.role]=pool.filter(x=>x!==pick);
    pick.hired={season:cur(S).number};
    S.staff.clubs[o.club][o.role]=pick;
    S.staff.openings=S.staff.openings.filter(x=>x!==o);
    news(S,teamName(o.club)+' hire '+pick.name+' as '+(o.role==='hc'?'head coach':'general manager'));
    if(pick.interview&&S.club)record(S,'candidateLost',{role:o.role,name:pick.name,club:o.club});
  }
}
// Each new league year: staff contracts run down; reset records for the new season.
function staffYear(S){
  for(const C of Object.values(S.staff.clubs))for(const person of [C.hc,C.gm]){
    person.contract.years=Math.max(0,person.contract.years-1);
    person.record={w:0,l:0,t:0};
    if(person.contract.years===0&&!person.interim)person.contract.years=2; // quiet two-year extensions keep the prototype simple
  }
}

// ---------------------------------------------------------------------------
// Depth chart and game-day roster
//
// player.ir = {since}       on injured reserve: off the 53, still on the cap
// practice[club] = [...]    up to 16 practice-squad players on cheap one-year deals
// depth = {order:{pos:[ids]}, inactive:[ids], active:[ids], overrides}
//                           the owner's changes to the coach's depth chart
// irReturns = {season, counts:{club:n}}   players brought back from IR
// hc.trust                  how the coach feels about the owner's interference
// ---------------------------------------------------------------------------
const ACTIVE_LIMIT=48,PRACTICE_LIMIT=16,IR_MIN_WEEKS=4,IR_RETURNS=8,IR_THRESHOLD=6;
const rosterCount=(S,id)=>S.rosters[id].filter(p=>!p.ir).length;
const practiceOf=(S,id)=>S.practice?.[id]??[];
const practiceTerms=S=>({salary:round2(S.cap.minSalary*.25),years:1,bonus:0,gYears:0});

// The coach plus the owner's overrides, as the lineup function sees it.
function lineupCoach(S,id){
  const hc=S.staff?.clubs?.[id]?.hc;
  if(id!==S.club||!S.depth)return hc;
  return {...hc,ownerOrder:S.depth.order};
}
// Game day: 48 of the healthy players dress. Starters first, then the best
// backups, then everyone else by rating. The owner can force either way.
function activesFor(S,id){
  const healthy=S.rosters[id].filter(p=>!p.ir&&!p.out);
  const forcedOut=id===S.club&&S.depth?new Set(S.depth.inactive):new Set();
  const forcedIn=id===S.club&&S.depth?new Set(S.depth.active):new Set();
  const chart=personnel(healthy.filter(p=>!forcedOut.has(p.id)),lineupCoach(S,id)).chart;
  const importance=new Map();
  for(const [pos,,n] of positions)chart[pos].forEach((p,i)=>importance.set(p.id,(i<n?2000:i===n?1000:0)+p.rating));
  const ranked=healthy.filter(p=>!forcedOut.has(p.id)).sort((a,b)=>Number(forcedIn.has(b.id))-Number(forcedIn.has(a.id))||(importance.get(b.id)??0)-(importance.get(a.id)??0));
  return ranked.slice(0,ACTIVE_LIMIT);
}
const inactivesFor=(S,id)=>{const act=new Set(activesFor(S,id).map(p=>p.id));return S.rosters[id].filter(p=>!p.ir&&!p.out&&!act.has(p.id));};

// ---- The owner's depth chart --------------------------------------------------------
// The coach's order at a position, ignoring the owner, for comparison.
function coachOrder(S,id,pos){
  const healthy=S.rosters[id].filter(p=>!p.ir&&!p.out);
  return personnel(healthy,S.staff.clubs[id].hc).chart[pos].map(p=>p.id);
}
function currentOrder(S,pos){
  return personnel(S.rosters[S.club].filter(p=>!p.ir),lineupCoach(S,S.club)).chart[pos].map(p=>p.id);
}
function moveDepth(S,playerId,dir){
  const p=S.rosters[S.club].find(x=>x.id===playerId);
  if(!p||p.ir)return 'unavailable';
  const order=currentOrder(S,p.pos),i=order.indexOf(playerId),j=i+dir;
  if(i<0||j<0||j>=order.length)return 'unavailable';
  [order[i],order[j]]=[order[j],order[i]];
  const n=startersAt(p.pos),before=coachOrder(S,S.club,p.pos).slice(0,n).sort().join(),after=order.filter(id=>{const q=S.rosters[S.club].find(x=>x.id===id);return q&&!q.out;}).slice(0,n).sort().join();
  S.depth.order[p.pos]=order;
  if(before!==after){
    S.depth.overrides++;
    const hc=S.staff.clubs[S.club].hc;
    hc.trust=Math.max(0,(hc.trust??70)-4);
    if(hc.trust<40&&!S.depth.warned){S.depth.warned=true;record(S,'coachUnhappy',{name:hc.name,overrides:S.depth.overrides});}
  }
  return 'ok';
}
function resetDepth(S){S.depth.order={};S.depth.inactive=[];S.depth.active=[];}
function toggleActive(S,playerId){
  const D=S.depth,act=activesFor(S,S.club).some(p=>p.id===playerId);
  D.inactive=D.inactive.filter(x=>x!==playerId);D.active=D.active.filter(x=>x!==playerId);
  (act?D.inactive:D.active).push(playerId);
  return 'ok';
}

// ---- Injured reserve -----------------------------------------------------------------
function placeOnIR(S,id,playerId){
  const p=S.rosters[id].find(x=>x.id===playerId);
  if(!p||p.ir||!(p.out>=IR_MIN_WEEKS))return 'unavailable';
  p.ir={since:now(S)};
  if(id===S.club){S.depth.inactive=S.depth.inactive.filter(x=>x!==playerId);S.depth.active=S.depth.active.filter(x=>x!==playerId);}
  return 'ok';
}
function irReturnsUsed(S,id){
  if(S.irReturns.season!==cur(S).number)S.irReturns={season:cur(S).number,counts:{}};
  return S.irReturns.counts[id]??0;
}
function canReturn(S,id,p){return !!p.ir&&!p.out&&now(S)-p.ir.since>=IR_MIN_WEEKS&&irReturnsUsed(S,id)<IR_RETURNS;}
function activateFromIR(S,id,playerId){
  const p=S.rosters[id].find(x=>x.id===playerId);
  if(!p||!canReturn(S,id,p))return 'unavailable';
  if(rosterCount(S,id)>=53)return 'rosterFull';
  delete p.ir;
  S.irReturns.counts[id]=irReturnsUsed(S,id)+1;
  return 'ok';
}

// ---- Practice squad ------------------------------------------------------------------
function signToPractice(S,id,p){
  if(practiceOf(S,id).length>=PRACTICE_LIMIT)return false;
  S.fa.pool=S.fa.pool.filter(x=>x.id!==p.id);
  delete S.fa.offers[p.id];delete p.ask;delete p.out;delete p.ir;
  p.contract=makeContract(S,practiceTerms(S),'practice');
  S.practice[id].push(p);
  return true;
}
function promote(S,id,playerId){
  const ps=practiceOf(S,id),p=ps.find(x=>x.id===playerId);
  if(!p)return 'unavailable';
  if(rosterCount(S,id)>=53)return 'rosterFull';
  S.practice[id]=ps.filter(x=>x!==p);
  p.contract=makeContract(S,minimumTerms(S),'minimum');
  S.rosters[id].push(p);
  return 'ok';
}
function releasePractice(S,id,playerId){
  const p=practiceOf(S,id).find(x=>x.id===playerId);
  if(!p)return 'unavailable';
  S.practice[id]=S.practice[id].filter(x=>x!==p);
  addToPool(S,p);
  return 'ok';
}
// Fill a practice squad with the best young players available.
function fillPractice(S,id,r,candidates=[]){
  const young=p=>p.age<=25;
  for(const p of candidates.filter(young).sort((a,b)=>b.rating-a.rating)){if(!signToPractice(S,id,p))break;}
  while(practiceOf(S,id).length<PRACTICE_LIMIT){
    const p=S.fa.pool.filter(young).sort((a,b)=>b.rating-a.rating)[0];
    if(p){signToPractice(S,id,p);continue;}
    const q={id:'ps'+cur(S).number+'-'+id+'-'+randInt(r,1e9),name:personName(r),pos:positionWeights[randInt(r,positionWeights.length)],rating:46+randInt(r,10),age:22+randInt(r,3)};
    q.potential=q.rating+4+randInt(r,10);
    S.fa.pool.push(q);signToPractice(S,id,q);
  }
}
// Other clubs sign practice-squad players to their 53; the owner hears about theirs.
function poachPractice(S,r){
  if(!S.club)return;
  for(const p of [...practiceOf(S,S.club)]){
    if(r()>.015||p.rating<62)continue;
    const club=clubs.filter(t=>t.id!==S.club)[randInt(r,31)];
    S.practice[S.club]=S.practice[S.club].filter(x=>x!==p);
    p.contract=makeContract(S,minimumTerms(S),'minimum');
    S.rosters[club.id].push(p);
    record(S,'practicePoached',{player:snap(p),club:club.id});
  }
}

// ---- Weekly roster moves by staff ----------------------------------------------------
const rosterMovesByStaff=(S,id)=>id!==S.club||S.staff.directives.rosterMoves!=='owner';
function weakestBackup(S,id){
  const u=personnel(S.rosters[id].filter(p=>!p.ir),S.staff.clubs[id].hc),keep=new Set();
  for(const [pos,,n] of positions)u.chart[pos].slice(0,n+1).forEach(p=>keep.add(p.id));
  return S.rosters[id].filter(p=>!p.ir&&!p.out&&!keep.has(p.id)).sort((a,b)=>capHit(a)-capHit(b)||a.rating-b.rating)[0];
}
function manageRoster(S,r){
  const notes=[];
  for(const t of clubs){
    const id=t.id;
    if(!rosterMovesByStaff(S,id))continue;
    for(const p of S.rosters[id])if(!p.ir&&p.out>=IR_THRESHOLD){placeOnIR(S,id,p.id);if(id===S.club)notes.push(p.pos+' '+p.name+' to injured reserve');}
    for(const p of S.rosters[id].filter(x=>canReturn(S,id,x))){
      if(rosterCount(S,id)>=53){const cut=weakestBackup(S,id);if(!cut)break;releasePlayer(S,id,cut.id);if(id===S.club)notes.push('released '+cut.pos+' '+cut.name);}
      activateFromIR(S,id,p.id);if(id===S.club)notes.push(p.pos+' '+p.name+' back from injured reserve');
    }
    for(let guard=0;guard<6&&rosterCount(S,id)<53;guard++){
      const healthy=pos=>S.rosters[id].filter(p=>p.pos===pos&&!p.ir&&!p.out).length;
      const short=positions.map(([pos,,n])=>({pos,gap:n+1-healthy(pos)})).sort((a,b)=>b.gap-a.gap)[0];
      const ps=practiceOf(S,id).filter(p=>p.pos===short.pos).sort((a,b)=>b.rating-a.rating)[0]??practiceOf(S,id).sort((a,b)=>b.rating-a.rating)[0];
      if(ps){promote(S,id,ps.id);if(id===S.club)notes.push('promoted '+ps.pos+' '+ps.name+' from the practice squad');}
      else{signMinimum(S,id,short.pos,r);const p=S.rosters[id].at(-1);if(id===S.club)notes.push('signed '+p.pos+' '+p.name);}
    }
  }
  if(notes.length&&S.club)record(S,'rosterMoves',{notes});
}
// What the owner needs to know when they run the roster themselves.
function rosterAlerts(S){
  const id=S.club,alerts=[];
  if(!id)return alerts;
  const u=personnel(S.rosters[id].filter(p=>!p.ir),lineupCoach(S,id));
  for(const [pos,,n] of positions)if(u.chart[pos].filter(p=>!p.out).length<n)alerts.push('No healthy starter at '+pos);
  const irable=S.rosters[id].filter(p=>!p.ir&&p.out>=IR_MIN_WEEKS);
  if(irable.length)alerts.push(irable.length+' player'+(irable.length===1?'':'s')+' could go on injured reserve');
  const back=S.rosters[id].filter(p=>canReturn(S,id,p));
  if(back.length)alerts.push(back.length+' ready to come back from IR');
  const open=53-rosterCount(S,id);
  if(open>0)alerts.push(open+' open roster spot'+(open===1?'':'s'));
  return alerts;
}

// Words for depth-chart events.
function depthEventText(S,e){
  switch(e.type){
    case 'rosterMoves':return 'Roster moves this week: '+e.notes.join('; ')+'.';
    case 'practicePoached':return teamName(e.club)+' signed '+e.player.pos+' '+e.player.name+' off our practice squad.';
    case 'coachUnhappy':return 'Coach '+e.name+' is unhappy about how often you change his lineup ('+e.overrides+' times so far). He says the players notice.';
  }
  return '';
}
