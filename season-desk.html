// ---------------------------------------------------------------------------
// The calendar
//
// Every season runs on one clock, cur(S).tick:
//   1–18   regular-season weeks (completed tracks the schedule)
//   19–22  Wild Card, Divisional, Conference Championships, Championship Game
//   23–50  February Week 1 through August Week 4
// Advancing from August Week 4 opens the next season at tick 0. Deadlines are
// stored as ticks and carried into the new season.
// ---------------------------------------------------------------------------
const SEASON_TICKS=50;
const ROUND_NAMES=['Wild Card round','Divisional round','Conference Championships','Championship Game'];
const OFF_MONTHS=['February','March','April','May','June','July','August'];
const MILESTONES={review:23,leagueYear:28,draft:34,otas:36,minicamp:40,camp:46,cuts:50};
const now=(S=save)=>cur(S).tick;
function weekLabel(t){
  if(t<=0)return 'the preseason';
  if(t<=REGULAR_WEEKS)return 'Week '+t;
  if(t<=22)return 'the '+ROUND_NAMES[t-19];
  if(t<=SEASON_TICKS){const i=t-23;return OFF_MONTHS[Math.floor(i/4)]+' Week '+(i%4+1);}
  return 'next season';
}
function shortLabel(t){
  if(t<=0)return 'Preseason';
  if(t<=REGULAR_WEEKS)return 'W'+t;
  if(t<=22)return ['Wild Card','Divisional','Conf. Champ.','Championship'][t-19];
  const i=t-23;return OFF_MONTHS[Math.floor(i/4)].slice(0,3)+' W'+(i%4+1);
}
const capital=s=>s[0].toUpperCase()+s.slice(1);
function eventWhen(S,e){
  const prefix=e.season!==cur(S).number?'Season '+e.season+' · ':'';
  return prefix+(e.week?'After '+shortLabel(e.week):'Preseason');
}

// ---- Postseason ------------------------------------------------------------
function seedsFor(S){
  const table=standings(S),pct=r=>(r.w+.5*r.t)/(r.w+r.l+r.t||1);
  const better=(a,b)=>pct(b)-pct(a)||(b.pf-b.pa)-(a.pf-a.pa)||teamName(a.id).localeCompare(teamName(b.id));
  const seeds={};
  for(const conference of ['Charter','Union']){
    const groupsHere=table.filter(rows=>byId.get(rows[0].id).conference===conference);
    const winners=groupsHere.map(rows=>rows[0]).sort(better);
    const rest=groupsHere.flatMap(rows=>rows.slice(1)).sort(better).slice(0,3);
    seeds[conference]=[...winners,...rest].map(r=>r.id);
  }
  return seeds;
}
function postseasonGames(P){
  const seedOf=id=>{for(const c of ['Charter','Union']){const i=P.seeds[c].indexOf(id);if(i>=0)return i;}return 99;};
  const confOf=id=>byId.get(id).conference;
  const r=P.rounds.length,game=(a,b)=>seedOf(a)<=seedOf(b)?{home:a,away:b,score:null}:{home:b,away:a,score:null};
  const winners=round=>P.rounds[round].games.map(g=>g.score[0]>g.score[1]?g.home:g.away);
  if(r===0)return ['Charter','Union'].flatMap(c=>{const s=P.seeds[c];return [game(s[1],s[6]),game(s[2],s[5]),game(s[3],s[4])];});
  if(r===1)return ['Charter','Union'].flatMap(c=>{
    const alive=[P.seeds[c][0],...winners(0).filter(id=>confOf(id)===c)].sort((a,b)=>seedOf(a)-seedOf(b));
    return [game(alive[0],alive[3]),game(alive[1],alive[2])];
  });
  if(r===2)return ['Charter','Union'].map(c=>{const w=winners(1).filter(id=>confOf(id)===c);return game(w[0],w[1]);});
  const [a,b]=winners(2);return [{...game(a,b),neutral:true}];
}
// Playoff games cannot end tied: overtime continues until someone scores more.
function simulatePlayoff(home,away,neutral,r){
  const result=simulate(home,away,r,neutral);
  let [h,a]=result.score,ot=!!result.ot;
  for(let n=0;h===a&&n<40;n++){
    ot=true;
    if(n%2===0)h+=drive(home,away,!neutral,r);else a+=drive(away,home,false,r);
  }
  if(h===a)h+=3;
  return {score:[h,a],ot};
}
function playPostseasonRound(S,r){
  const s=cur(S);
  s.postseason??={seeds:seedsFor(S),rounds:[],champion:null};
  const P=s.postseason,round=P.rounds.length;
  const units=Object.fromEntries(clubs.map(t=>[t.id,personnel(S.rosters[t.id])]));
  const games=postseasonGames(P);
  for(const g of games){
    const result=simulatePlayoff(units[g.home],units[g.away],!!g.neutral,r);
    g.score=result.score;if(result.ot)g.ot=true;
  }
  P.rounds.push({name:ROUND_NAMES[round],games});
  s.tick++;
  const mine=games.find(g=>g.home===S.club||g.away===S.club);
  if(mine)postseasonFinance(S,mine);
  if(round===3){
    const g=games[0];P.champion=g.score[0]>g.score[1]?g.home:g.away;
    news(S,teamName(P.champion)+' win the Championship Game, '+Math.max(...g.score)+'–'+Math.min(...g.score));
  }
  if(mine)record(S,'playoffResult',{round,home:mine.home,away:mine.away,score:mine.score,ot:!!mine.ot,won:(mine.score[0]>mine.score[1])===(mine.home===S.club)});
  afterTick(S,r,{games,units});
}
function postseasonFinance(S,g){
  const F=S.finance,lines=Object.fromEntries(Object.keys(LINE_LABELS).map(k=>[k,0]));
  if(g.home===S.club){const G=gate(S,S.club);Object.assign(lines,{tickets:G.tickets,premium:G.premium,concessions:G.concessions,gameDay:-2.5,visitorShare:-.34*G.tickets});}
  else if(!g.neutral)lines.visitorShare=.34*gate(S,g.home).tickets;
  for(const k in lines)lines[k]=round2(lines[k]);
  const result=sumLines(lines);
  F.clubCash=round2(F.clubCash+result);
  F.ledger.push({season:cur(S).number,week:now(S),lines,result,ownerIncome:0,ownerOperating:0,borrowed:0,playoff:true});
}
function playoffStatus(S,id){
  const P=cur(S).postseason;
  if(!P)return null;
  const seed=seedIndex(P.seeds,id);
  if(seed<0)return {seed,alive:false,finish:'Missed the playoffs'};
  for(const [i,round] of P.rounds.entries()){
    const g=round.games.find(x=>x.home===id||x.away===id);
    if(g&&(g.score[0]>g.score[1])!==(g.home===id))return {seed,alive:false,finish:i===3?'Lost the Championship Game':'Lost in the '+ROUND_NAMES[i]};
  }
  if(P.champion===id)return {seed,alive:false,finish:'Won the Championship Game',champion:true};
  return {seed,alive:true};
}
function seedIndex(seeds,id){for(const c of ['Charter','Union']){const i=seeds[c].indexOf(id);if(i>=0)return i;}return -1;}

// ---- Players: development, retirement, cuts --------------------------------
const lateBloomers=new Set(['K','P','LS','QB']);
function developPlayers(S,r){
  const retired=[],risers=[];
  for(const t of clubs){
    S.rosters[t.id]=S.rosters[t.id].filter(p=>{
      p.age++;
      const grace=lateBloomers.has(p.pos)?3:0,age=p.age-grace;
      const quits=age>=36||(age>=34&&r()<.45)||(age>=31&&p.rating<55&&r()<.4);
      if(quits){if(t.id===S.club)retired.push(snap(p));return false;}
      const before=p.rating;
      if(age<=26)p.rating+=Math.max(0,Math.round(((p.potential??p.rating)-p.rating)*(.14+r()*.28)));
      else if(age<=29)p.rating+=randInt(r,3)-1;
      else if(age<=32)p.rating-=1+randInt(r,3);
      else p.rating-=2+randInt(r,4);
      p.rating=Math.max(40,Math.min(99,p.rating));
      if(t.id===S.club&&p.rating-before>=4)risers.push({...snap(p),gain:p.rating-before});
      return true;
    });
  }
  return {retired,risers:risers.sort((a,b)=>b.gain-a.gain).slice(0,3)};
}
// Camp work: young players inch toward their potential.
function campWork(S,r){
  for(const p of Object.values(S.rosters).flat())if(p.age<=25&&p.rating<(p.potential??0)&&r()<.35)p.rating++;
}
// Keep the best at each position up to the roster slots, then the best of the rest to 53.
function finalCuts(S){
  let mine=[];
  for(const t of clubs){
    const roster=S.rosters[t.id],keep=new Set();
    for(const [pos,count] of positions)roster.filter(p=>p.pos===pos).sort((a,b)=>b.rating-a.rating).slice(0,count).forEach(p=>keep.add(p));
    roster.filter(p=>!keep.has(p)).sort((a,b)=>b.rating-a.rating).slice(0,Math.max(0,53-keep.size)).forEach(p=>keep.add(p));
    const cut=roster.filter(p=>!keep.has(p));
    if(t.id===S.club)mine=cut.map(snap);
    S.rosters[t.id]=roster.filter(p=>keep.has(p));
  }
  return mine;
}

// ---- The draft ---------------------------------------------------------------
const COLLEGES=['Allegheny State','Bayou Tech','Cascade','Central Prairie','Delta A&M','Eastern Ridge','Great Lakes Tech','Gulf State',
  'High Plains','Iron Range','Keystone Valley','Lakeshore','Magnolia','North Woods','Ozark State','Palmetto','Piedmont','Red River',
  'Sierra Tech','Tidewater','Twin Rivers','Western Plateau'];
const positionWeights=positions.flatMap(([pos,count])=>Array(count).fill(pos));
// How boards value positions: a great kicker is still not a first-round grade.
const DRAFT_POSITION_VALUE={QB:4,DE:2,OT:2,WR:1,CB:1,K:-14,P:-14,LS:-18};
function makeDraft(r,season){
  const prospects=Array.from({length:400},(_,i)=>{
    const pos=positionWeights[randInt(r,positionWeights.length)];
    const rating=44+randInt(r,20)+(i<48?randInt(r,12):0);
    const potential=Math.min(97,rating+5+randInt(r,22)+(i<48?randInt(r,6):0));
    return {id:'d'+season+'-'+(i+1),name:personName(r),pos,college:COLLEGES[randInt(r,COLLEGES.length)],age:21+randInt(r,3),
      rating,potential,grade:Math.round(.55*potential+.45*rating+randInt(r,9)-4+(DRAFT_POSITION_VALUE[pos]??0))};
  }).sort((a,b)=>b.grade-a.grade);
  return {season,status:'scouting',prospects,order:[],pick:0,picks:[]};
}
function draftOrder(S){
  const s=cur(S),table=standings(S).flat(),P=s.postseason;
  const pct=id=>{const r=table.find(x=>x.id===id);return {p:(r.w+.5*r.t)/(r.w+r.l+r.t||1),d:r.pf-r.pa};};
  const rank=id=>{
    const st=playoffStatus(S,id);
    if(!P||st.seed<0)return 0;
    if(st.champion)return 5;
    if(st.finish==='Lost the Championship Game')return 4;
    return 1+ROUND_NAMES.findIndex(n=>st.finish==='Lost in the '+n);
  };
  const order=clubs.map(t=>t.id).sort((a,b)=>rank(a)-rank(b)||pct(a).p-pct(b).p||pct(a).d-pct(b).d||a.localeCompare(b));
  return [1,2,3,4,5,6,7].flatMap(round=>order.map((origin,i)=>({overall:(round-1)*32+i+1,round,origin,
    owner:S.picks.find(p=>p.origin===origin&&p.round===round)?.owner??origin})));
}
function startDraft(S){
  const D=S.draft;
  if(!D||D.status!=='scouting')return;
  D.order=draftOrder(S);D.status='live';D.pick=0;
  const mine=D.order.filter(x=>x.owner===S.club).map(x=>x.overall);
  record(S,'draftOpen',{picks:mine});
  news(S,'The draft opens with '+teamName(D.order[0].owner)+' on the clock');
}
const draftAvailable=D=>{const taken=new Set(D.picks.map(x=>x.prospectId));return D.prospects.filter(p=>!taken.has(p.id));};
function needAt(S,clubId,pos){
  const target=positions.find(x=>x[0]===pos)[1];
  return target-S.rosters[clubId].filter(p=>p.pos===pos&&p.age<=31).length;
}
function bestFor(S,clubId,pool){
  return pool.slice(0,60).map(p=>({p,score:p.grade+(needAt(S,clubId,p.pos)>0?4*needAt(S,clubId,p.pos):-5)}))
    .sort((a,b)=>b.score-a.score)[0]?.p;
}
function makePick(S,prospectId,by){
  const D=S.draft,slot=D.order[D.pick];
  if(!slot)return false;
  const p=draftAvailable(D).find(x=>x.id===prospectId);
  if(!p)return false;
  D.picks.push({overall:slot.overall,round:slot.round,club:slot.owner,origin:slot.origin,prospectId:p.id,name:p.name,pos:p.pos,college:p.college,by});
  S.rosters[slot.owner].push({id:'r'+D.season+'-'+slot.overall,name:p.name,pos:p.pos,rating:p.rating,age:p.age,potential:p.potential,
    drafted:{season:D.season,round:slot.round,overall:slot.overall,college:p.college}});
  D.pick++;
  if(D.pick>=D.order.length)completeDraft(S);
  return true;
}
function aiPick(S){
  const D=S.draft,slot=D.order[D.pick];
  return makePick(S,bestFor(S,slot.owner,draftAvailable(D)).id,slot.owner===S.club?'gm':'club');
}
function ownerPick(S,prospectId){
  const D=S.draft;
  if(D?.status!=='live'||D.order[D.pick]?.owner!==S.club)return 'notYourPick';
  return makePick(S,prospectId,'owner')?'ok':'unavailable';
}
function simToMyPick(S){
  const D=S.draft;
  while(D.status==='live'&&D.order[D.pick].owner!==S.club)aiPick(S);
}
function gmFinishDraft(S,unattended){
  const D=S.draft;
  if(D?.status!=='live')return;
  if(unattended)record(S,'draftUnattended',{picks:D.order.length-D.picks.length});
  while(D.status==='live')aiPick(S);
}
function completeDraft(S){
  const D=S.draft;
  D.status='done';
  // Undrafted free agents fill camp rosters to 60, needs first.
  const pool=draftAvailable(D);
  const campOrder=[...new Set(D.order.map(x=>x.origin))];
  for(let pass=0;pass<8;pass++)for(const id of campOrder){
    if(S.rosters[id].length>=60||!pool.length)continue;
    const need=positions.map(([pos])=>pos).find(pos=>needAt(S,id,pos)>0);
    const i=need?pool.findIndex(p=>p.pos===need):0;
    const p=pool.splice(i<0?0:i,1)[0];
    S.rosters[id].push({id:'u'+D.season+'-'+p.id.split('-')[1],name:p.name,pos:p.pos,rating:p.rating,age:p.age,potential:p.potential,undrafted:{season:D.season,college:p.college}});
  }
  S.draftHistory.push({season:D.season,picks:D.picks.map(x=>({overall:x.overall,round:x.round,club:x.club,name:x.name,pos:x.pos,college:x.college}))});
  S.picks=defaultPicks();
  const mine=D.picks.filter(x=>x.club===S.club);
  record(S,'draftDone',{picks:mine.map(x=>({overall:x.overall,round:x.round,name:x.name,pos:x.pos,college:x.college,by:x.by}))});
  const first=D.picks[0];
  news(S,teamName(first.club)+' take '+first.pos+' '+first.name+' of '+first.college+' first overall');
}

// ---- Advancing the clock ---------------------------------------------------
function afterTick(S,r,{games=null,units=null,regularIndex=null}={}){
  if(games&&units)finishMedicalWeek(S,units,r,games);
  else for(const p of Object.values(S.rosters).flat())if(p.out&&--p.out<=0)delete p.out;
  if(S.offer){record(S,'quoteExpired',{seller:S.offer.seller});S.offer=null;}
  processStadium(S,r);
  processLeague(S,r,regularIndex);
  if(regularIndex!==null)processFinance(S);
  processProjects(S);
  distributeToOwner(S);
  processNaming(S);
}
function distributeToOwner(S){
  const t=now(S),F=S.finance;
  if(t<=0||t%4!==0)return;
  const amount=round2(F.distributionAnnual*4/SEASON_TICKS);
  F.ownerCash=round2(F.ownerCash+amount);
  const entry=F.ledger.find(x=>x.season===cur(S).number&&x.week===t);
  if(entry)entry.ownerIncome=round2((entry.ownerIncome??0)+amount);
}
function offseasonWeek(S,r){
  const s=cur(S);
  // Leaving draft week: the GM finishes whatever is left.
  if(s.tick===MILESTONES.draft&&S.draft.status==='live')gmFinishDraft(S,true);
  s.tick++;
  const t=s.tick;
  if(t===MILESTONES.review)seasonReview(S);
  if(t===MILESTONES.leagueYear)newLeagueYear(S,r);
  if(t===MILESTONES.draft)startDraft(S);
  if(t===MILESTONES.otas){campWork(S,r);record(S,'calendarNote',{text:'OTAs are underway. The rookies are on the field with the veterans for the first time.'});}
  if(t===MILESTONES.minicamp){campWork(S,r);record(S,'calendarNote',{text:'Mandatory minicamp wrapped up. The coaches liked what they saw from the young players.'});}
  if(t===MILESTONES.camp){campWork(S,r);campWork(S,r);record(S,'calendarNote',{text:'Training camp is open. Position battles start now.'});}
  if(t===MILESTONES.cuts){
    const cut=finalCuts(S);
    record(S,'finalCuts',{count:cut.length,names:cut.sort((a,b)=>b.rating-a.rating).slice(0,3)});
  }
  afterTick(S,r);
}
function seasonReview(S){
  const s=cur(S),P=s.postseason,row=standings(S).flat().find(x=>x.id===S.club);
  const st=S.club?playoffStatus(S,S.club):null;
  const entry={season:s.number,club:S.club,record:row?[row.w,row.l,row.t]:null,finish:st?.finish??(st?.alive?'Playoffs':'Missed the playoffs'),champion:P?.champion??null};
  S.history.push(entry);
  if(S.club)record(S,'seasonReview',entry);
}
function newLeagueYear(S,r){
  const {retired,risers}=developPlayers(S,r);
  for(const lease of Object.values(S.world.leases))lease.yearsLeft=Math.max(0,lease.yearsLeft-1);
  if(S.finance.naming.status==='signed')S.finance.naming.deal.years=Math.max(0,S.finance.naming.deal.years-1);
  // Lapsed stadium offers come back with fresh terms.
  const revived=[];
  for(const site of S.world.sites.filter(x=>x.status==='expired')){
    const m=marketById(S,site.marketId),k=SITE_KINDS[site.kind];
    Object.assign(site,{status:'open',publicOffer:round5((180+m.potential*4)*between(r,k.offer)),expiresWeek:now(S)+6+randInt(r,14),renewals:(site.renewals??0)+1});
    if(S.stadium.knowledge.some(f=>f.siteId===site.id))revived.push(site.name+' in '+m.name);
  }
  if(S.club)record(S,'leagueYear',{retired,risers,revived,leaseYears:S.world.leases[S.club].yearsLeft});
  news(S,'The new league year opens; '+Object.values(S.rosters).flat().filter(p=>p.age===22).length+' second-year players report');
}
function rollover(S,r){
  const s=cur(S),next=makeSeason(r,s.number+1);
  next.tick=0;
  next.ratings=Object.fromEntries(clubs.map(t=>{const u=personnel(S.rosters[t.id]);return [t.id,{offense:u.offense,defense:u.defense}];}));
  S.seasons.push(next);S.seasonIndex=S.seasons.length-1;
  const shift=x=>x-SEASON_TICKS;
  for(const site of S.world.sites)if(site.status==='open')site.expiresWeek=shift(site.expiresWeek);
  for(const st of S.stadium.studies)if(st.status==='underway')st.due=shift(st.due);
  if(S.finance.naming.status==='awaiting')S.finance.naming.expiresWeek=shift(S.finance.naming.expiresWeek);
  if(S.league.contest?.status==='open')S.league.contest.deadlineWeek=shift(S.league.contest.deadlineWeek);
  if(S.league.meeting?.status==='scheduled')S.league.meeting.week=shift(S.league.meeting.week);
  S.offer=null;
  S.draft=makeDraft(r,next.number);
  news(S,'Season '+next.number+' kicks off');
  afterTick(S,r);
}
// One step of the clock, whatever the phase.
function advance(S){
  const s=cur(S),r=rngFor(S.rng);
  if(s.completed<s.weeks.length)return playWeek(S);
  if(s.tick<22)return playPostseasonRound(S,r);
  if(s.tick<SEASON_TICKS)return offseasonWeek(S,r);
  return rollover(S,r);
}
// Jump forward to a tick (or into next season with SEASON_TICKS+1). Nothing in between is skipped.
function jumpTo(S,target){
  const startSeason=cur(S).number;
  for(let guard=0;guard<80;guard++){
    if(target>SEASON_TICKS?cur(S).number>startSeason:now(S)>=target||cur(S).number>startSeason)return;
    advance(S);
  }
}
function jumpTargets(S){
  const t=now(S),n=cur(S).number;
  return [[REGULAR_WEEKS+1,'Playoffs: Wild Card round'],[22,'Championship Game'],[MILESTONES.review,'February Week 1 · season review'],
    [MILESTONES.leagueYear,'March Week 2 · new league year'],[MILESTONES.draft,'April Week 4 · draft'],[MILESTONES.otas,'May Week 2 · OTAs'],
    [MILESTONES.camp,'July Week 4 · training camp'],[MILESTONES.cuts,'August Week 4 · final cuts'],[SEASON_TICKS+1,'Season '+(n+1)+' opener']]
    .filter(([tick])=>tick>t);
}
function advanceLabel(S){
  const s=cur(S),t=s.tick;
  if(s.completed<s.weeks.length)return 'Advance week '+(s.completed+1)+' →';
  if(t<22)return 'Play the '+ROUND_NAMES[t-18]+' →';
  if(t<SEASON_TICKS)return 'Advance to '+weekLabel(t+1)+' →';
  return 'Open season '+(s.number+1)+' →';
}

// Words for calendar events.
function calendarEventText(S,e){
  switch(e.type){
    case 'playoffResult':{
      const home=e.home===S.club,opp=teamName(home?e.away:e.home),[a,b]=home?e.score:[e.score[1],e.score[0]];
      return (e.won?'We beat ':'We lost to ')+opp+' '+Math.max(a,b)+'–'+Math.min(a,b)+(e.ot?' in overtime':'')+' in the '+ROUND_NAMES[e.round]+'.'+
        (e.won?(e.round===3?' Champions.':' On to the '+ROUND_NAMES[e.round+1]+'.'):' The season is over.');
    }
    case 'seasonReview':return 'Season '+e.season+' review: '+(e.record?e.record.join('–'):'no record')+'. '+e.finish+'.'+(e.champion&&e.champion!==S.club?' '+teamName(e.champion)+' won it all.':'');
    case 'leagueYear':return 'The new league year is open. '+(e.retired.length?'Retired: '+e.retired.map(p=>p.pos+' '+p.name).join(', ')+'. ':'Nobody on our roster retired. ')+
      (e.risers.length?'Biggest jumps: '+e.risers.map(p=>p.pos+' '+p.name+' (+'+p.gain+')').join(', ')+'. ':'')+
      (e.revived.length?'Lapsed stadium offers are back with new terms: '+e.revived.join(', ')+'. ':'')+'Our lease has '+e.leaseYears+' year'+(e.leaseYears===1?'':'s')+' left.';
    case 'draftOpen':return 'Draft week. We pick at '+(e.picks.length?e.picks.map(n=>'#'+n).join(', '):'no spots, after our trades')+'. I will run the board unless you want it.';
    case 'draftUnattended':return 'You were not in the room, so I made the last '+e.picks+' picks of the draft.';
    case 'draftDone':return 'The draft is done. Our class: '+(e.picks.length?e.picks.map(p=>'#'+p.overall+' '+p.pos+' '+p.name+' ('+p.college+')'+(p.by==='owner'?', your call':'')).join('; '):'no picks this year')+'. Undrafted free agents fill out the camp roster.';
    case 'calendarNote':return e.text;
    case 'finalCuts':return 'Final cuts are in: we released '+e.count+' player'+(e.count===1?'':'s')+' to get to 53'+(e.names.length?', including '+e.names.map(p=>p.pos+' '+p.name).join(', '):'')+'.';
  }
  return '';
}

// ---- Draft view ----------------------------------------------------------------
function draftView(){
  const S=save,D=S.draft,s=cur();
  let html=heading('DRAFT','Class of season '+D.season);
  const mineOwned=S.picks.filter(p=>p.owner===S.club).sort((a,b)=>a.round-b.round);
  const row=(p,action)=>'<tr><td>'+esc(p.name)+'</td><td>'+esc(p.pos)+'</td><td>'+esc(p.college)+'</td><td>'+p.age+'</td><td>'+p.grade+'</td><td>'+(action??'')+'</td></tr>';
  const table=(rows,extra)=>'<div class="wide"><table><thead><tr><th>Prospect</th><th>Pos.</th><th>College</th><th>Age</th><th>GM grade</th><th>'+(extra??'')+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  if(D.status==='scouting'){
    html+='<p>'+esc('The draft is '+weekLabel(MILESTONES.draft)+'. '+(S.club?'You hold '+(mineOwned.length?mineOwned.map(pickLabel).join(', '):'no picks')+'. ':'')+'Order follows the final standings and playoff results, worst first. The GM grades blend what a player is now with what scouts think he can become.')+'</p>'+
      '<h2>Top of the board</h2>'+table(D.prospects.slice(0,30).map(p=>row(p)).join(''));
    return html;
  }
  if(D.status==='live'){
    const slot=D.order[D.pick],mine=slot.owner===S.club,avail=draftAvailable(D);
    html+='<p><b>'+esc('On the clock: pick '+slot.overall+' (round '+slot.round+'), '+teamName(slot.owner)+(slot.owner!==slot.origin?' via '+byId.get(slot.origin).market:''))+'</b></p>';
    if(mine){
      const gm=bestFor(S,S.club,avail);
      html+='<p>'+esc('Your pick. The GM would take '+gm.pos+' '+gm.name+' of '+gm.college+'.')+'</p><div class="controls"><button id="gmPick">Let the GM pick</button><button id="gmFinish">Let the GM run the rest</button></div>'+
        table(avail.slice(0,25).map(p=>row(p,'<button data-draft="'+esc(p.id)+'">Draft</button>')).join(''));
    }else html+='<div class="controls"><button id="simToMine">'+(D.order.slice(D.pick).some(x=>x.owner===S.club)?'Sim to our next pick':'Sim to the end')+'</button><button id="gmFinish">Let the GM run the rest</button></div>';
    const recent=[...D.picks].reverse().slice(0,10);
    if(recent.length)html+='<h2>Latest picks</h2><ul>'+recent.map(x=>'<li><strong>#'+x.overall+'</strong> '+esc(byId.get(x.club).abbr+' · '+x.pos+' '+x.name+', '+x.college)+'</li>').join('')+'</ul>';
    return html;
  }
  const last=S.draftHistory.at(-1);
  html+='<p>'+esc('The next draft is '+weekLabel(MILESTONES.draft)+' of season '+D.season+'.')+'</p>';
  if(last){
    const mine=last.picks.filter(x=>x.club===S.club);
    html+='<h2>Season '+last.season+' draft</h2><p>'+esc(mine.length?'Your class: '+mine.map(x=>'#'+x.overall+' '+x.pos+' '+x.name).join(', ')+'.':'You had no picks.')+'</p>'+
      '<ul>'+last.picks.slice(0,32).map(x=>'<li><strong>#'+x.overall+'</strong> '+esc(byId.get(x.club).abbr+' · '+x.pos+' '+x.name+', '+x.college)+'</li>').join('')+'</ul>';
  }
  return html;

const playerText=p=>(p.pos?p.pos+' ':'')+p.name;
function describeEvent(e,S=save){

    case 'studyReport':return esc(studyReportText(e));
    case 'projectDone':case 'namingSigned':case 'namingAwaiting':case 'namingLapsed':case 'namingDeclined':return esc(financeEventText(e));
    case 'rightsWon':case 'rightsLost':case 'rightsRenewed':case 'meetingCalled':case 'voteResult':return esc(leagueEventText(e));
    case 'playoffResult':case 'seasonReview':case 'leagueYear':case 'draftOpen':case 'draftUnattended':case 'draftDone':case 'calendarNote':case 'finalCuts':return esc(calendarEventText(S,e));

function offerMessage(S,q){
  const seller=teamName(q.seller),target=S.rosters[q.seller].find(p=>p.id===q.targetId);
  switch(q.status){

    case 'incomplete':return 'Select a player or a draft pick before sending a proposal.';
    case 'accepted':return seller+' accepts your proposal, pending your authorization.';

// ---------------------------------------------------------------------------
// Loading, validating and upgrading saves
// ---------------------------------------------------------------------------
function detectVersion(raw){
  if(raw&&isInt(raw.schemaVersion,1))return raw.schemaVersion;
  if(raw&&Array.isArray(raw.weeks))return 1; // November 18 prototype: the season object was the save
  throw Error('this is not a league save');
}
const migrations={
  1:migrateV1,
  2:migrateV2,
  3:migrateV3,
  4:migrateV4,
  5:migrateV5,
};
// v5 -> v6: the calendar. Seasons get a clock, players get potential, and the
// first draft class is generated.
function migrateV5(old){
  const r=rngFor(old.rng);
  for(const s of old.seasons)s.tick??=s.completed;
  for(const p of Object.values(old.rosters).flat())
    if(p.potential===undefined)p.potential=Math.min(99,p.age<=24?p.rating+2+randInt(r,12):p.age<=27?p.rating+randInt(r,5):p.rating);
  old.draft=makeDraft(r,cur(old).number);
  old.history??=[];old.draftHistory??=[];
  old.schemaVersion=6;
  (old.migrations??=[]).push({from:5,to:6,at:new Date().toISOString()});
  return old;
}
// v4 -> v5: adds owners, open-market broadcast control and fan preference,
// headlines, and (for a save with a club) the rights contest.
function migrateV4(old){
  old.league=makeLeague(rngFor(old.rng));
  old.schemaVersion=5;
  for(const season of old.seasons)season.tick??=season.completed; // the contest deadline needs the clock
  ensureContest(old);
  (old.migrations??=[]).push({from:4,to:5,at:new Date().toISOString()});
  return old;
}
// v3 -> v4: adds owner and club finances, funding proposals and naming-rights
// state. Operating reports start with the next played week.
function migrateV3(old){
  old.finance=makeFinance(rngFor(old.rng));
  (old.migrations??=[]).push({from:3,to:4,at:new Date().toISOString()});
  old.schemaVersion=4;
  return old;
}
// v2 -> v3: adds the stadium world (open markets, site offers, leases), the team
// president, and empty stadium records. Generated from the save's own seed.
function migrateV2(old){
  const r=rngFor(old.rng);
  old.world=makeWorld(r,cur(old)?.completed??0);
  old.staff=makeStaff(r);
  old.stadium=newStadiumState();
  (old.migrations??=[]).push({from:2,to:3,at:new Date().toISOString()});
  old.schemaVersion=3;
  return old;
}
function upgrade(raw){
  let S=JSON.parse(JSON.stringify(raw));
  const from=detectVersion(S);
  if(from>SCHEMA_VERSION)throw Error('it was made by a newer build of the game (save format v'+from+'). Open it with that build');
  for(let v=from;v<SCHEMA_VERSION;v=S.schemaVersion){
    if(!migrations[v])throw Error('there is no upgrade path from save format v'+v);
    S=migrations[v](S);
  }
  const errors=validateSave(S);
  if(errors.length)throw Error(errors.join(' '));
  return {save:S,from};
}
function validateSave(S){
  const errors=[],fail=m=>{if(errors.length<10)errors.push(m);};
  if(!S||typeof S!=='object')return ['The save is empty.'];
  if(S.schemaVersion!==SCHEMA_VERSION)fail('Unexpected save format '+S.schemaVersion+'.');
  if(typeof S.saveId!=='string'||!S.saveId)fail('The save has no id.');
  if(!S.rng||!isInt(S.rng.seed,0,4294967295)||!isInt(S.rng.state,0,4294967295))fail('The random generator state is missing.');
  if(S.club!==null&&!byId.has(S.club))fail('The owned club is not in the league.');
  if(S.revision!==undefined&&!isInt(S.revision,0))fail('The save revision is invalid.');
  if(!Array.isArray(S.seasons)||!S.seasons.length)fail('No seasons are recorded.');
  else{
    if(!isInt(S.seasonIndex,0,S.seasons.length-1))fail('The current season is invalid.');
    S.seasons.forEach((s,si)=>{
      const label='Season '+(si+1);
      if(!s||!isInt(s.number,1))return fail(label+' has no number.');
      if(!Array.isArray(s.weeks)||!s.weeks.length)return fail(label+' has no schedule.');
      if(!isInt(s.completed,0,s.weeks.length))fail(label+' has an invalid week count.');
      if(!isInt(s.tick,0,SEASON_TICKS)||s.tick<s.completed)fail(label+' has an invalid calendar position.');
      s.weeks.forEach((games,wi)=>{
        const where=label+' week '+(wi+1);
        if(!Array.isArray(games))return fail(where+' is not a list of games.');
        const seen=new Set();
        for(const g of games){
          if(!g||!byId.has(g.home)||!byId.has(g.away)||g.home===g.away){fail(where+' has a game with an unknown club.');continue;}
          if(seen.has(g.home)||seen.has(g.away))fail(where+' schedules a club twice.');
          seen.add(g.home);seen.add(g.away);
          const scored=Array.isArray(g.score)&&g.score.length===2&&g.score.every(n=>isInt(n,0));
          if(wi<s.completed?!scored:g.score!==null)fail(where+' has a score that does not match its status.');
          if(g.ot!==undefined&&g.ot!==true)fail(where+' has an invalid overtime flag.');
        }
      });
      if(!clubs.every(t=>Number.isFinite(s.ratings?.[t.id]?.offense)&&Number.isFinite(s.ratings[t.id].defense)))fail(label+' is missing club ratings.');
    });
  }
  if(!S.rosters||typeof S.rosters!=='object')fail('Rosters are missing.');
  else{
    const ids=new Set();
    for(const t of clubs){
      const roster=S.rosters[t.id];
      if(!Array.isArray(roster)){fail(teamName(t.id)+' has no roster.');continue;}
      for(const p of roster){
        if(!p||typeof p.id!=='string'||ids.has(p.id)){fail(teamName(t.id)+' has a player with a missing or duplicate id.');continue;}
        ids.add(p.id);
        if(typeof p.name!=='string'||!positionNames.has(p.pos)||!Number.isFinite(p.rating)||!isInt(p.age,15,60)||(p.out!==undefined&&!isInt(p.out,1,52)))fail(teamName(t.id)+' has an invalid player record ('+p.id+').');
      }
    }
  }
  if(!Array.isArray(S.picks))fail('Draft picks are missing.');
  else{
    const keys=new Set();
    for(const p of S.picks){
      if(!p||!byId.has(p.origin)||!byId.has(p.owner)||!isInt(p.round,1,7)||keys.has(pickKey(p))){fail('A draft pick record is invalid.');continue;}
      keys.add(pickKey(p));
    }
  }
  if(S.offer!==null&&(!S.offer||!byId.has(S.offer.seller)||typeof S.offer.targetId!=='string'||!isInt(S.offer.week,0)))fail('The open trade offer is invalid.');
  if(!Array.isArray(S.events))fail('Staff reports are missing.');
  else{
    let max=0;
    for(const e of S.events){
      if(!e||!isInt(e.id,1)||typeof e.type!=='string'||!isInt(e.week,0)){fail('A staff report is invalid.');continue;}
      max=Math.max(max,e.id);
    }
    if(!isInt(S.nextEventId,max+1))fail('The report counter is behind the reports.');
  }
  const W=S.world;
  if(!W||!Array.isArray(W.markets)||!Array.isArray(W.sites)||!W.leases)fail('The stadium market list is missing.');
  else{
    const marketIds=new Set(W.markets.map(m=>m?.id)),officialIds=new Set(W.markets.flatMap(m=>Array.isArray(m?.officials)?m.officials.map(o=>o?.id):[]));
    for(const site of W.sites){
      if(!site||typeof site.id!=='string'||!marketIds.has(site.marketId)||!officialIds.has(site.sponsor)||!['open','expired'].includes(site.status)||
        !isInt(site.expiresWeek,0,99)||![site.publicOffer,site.parking,site.infraEstimate,site.infraTrue,site.maxSeats].every(Number.isFinite)||!LAND_TERMS.includes(site.landTerms))
        fail('A stadium site record is invalid.');
    }
    if(!clubs.every(t=>typeof W.leases[t.id]?.stadium==='string'&&isInt(W.leases[t.id].capacity,1)))fail('A club lease is missing.');
  }
  const st=S.stadium;
  if(!st||!Array.isArray(st.visits)||!Array.isArray(st.studies)||!Array.isArray(st.knowledge)||!Number.isFinite(st.homeMood)||!isInt(st.nextFactId,1))fail('Stadium records are missing.');
  else{
    if(st.visits.filter(v=>v?.status==='planned').length>1)fail('More than one visit is planned.');
    if(st.knowledge.some(f=>!f||!isInt(f.id,1)||!Array.isArray(f.knownBy)||f.id>=st.nextFactId))fail('A record of who knows what is invalid.');
  }
  if(typeof S.staff?.president?.name!=='string')fail('The team president is missing.');
  const F=S.finance;
  if(!F||![F.ownerCash,F.clubCash,F.debt,F.rate,F.distributionAnnual].every(Number.isFinite)||!Array.isArray(F.projects)||!Array.isArray(F.ledger)||
    !Array.isArray(F.capitalLog)||!F.contributions||!F.naming||!['borrow','owner'].includes(F.lossPolicy))fail('Club finances are missing.');
  else{
    if(F.projects.some(p=>!projectDef(p?.id)||!['proposed','declined','building','active'].includes(p.status)||(p.status==='building'&&!isInt(p.weeksLeft,1))))fail('A funding project is invalid.');
    if(!['none','negotiating','awaiting','signed'].includes(F.naming.status))fail('The naming-rights talks are invalid.');
    if(F.naming.status==='signed'&&!(F.naming.deal&&Number.isFinite(F.naming.deal.annual)))fail('The naming-rights deal is invalid.');
    if(F.ledger.some(x=>!x||!x.lines||!Number.isFinite(x.result)))fail('An operating report is invalid.');
  }
  if(!S.draft||!Array.isArray(S.draft.prospects)||!['scouting','live','done'].includes(S.draft.status)||!isInt(S.draft.pick,0))fail('The draft class is missing.');
  if(!Array.isArray(S.history)||!Array.isArray(S.draftHistory))fail('Season history is missing.');
  const Lg=S.league;
  if(!Lg||!Lg.owners||!Lg.markets||!Array.isArray(Lg.news)||!Array.isArray(Lg.promises))fail('League records are missing.');
  else{
    if(!clubs.every(t=>{const o=Lg.owners[t.id];return o&&typeof o.name==='string'&&Number.isFinite(o.relation)&&Array.isArray(o.memory);}))fail('An owner record is invalid.');
    if(!OPEN_MARKETS.every(m=>{const M=Lg.markets[m.id];return M&&(M.holder===null||byId.has(M.holder))&&M.fans&&Object.entries(M.fans).every(([id,v])=>byId.has(id)&&Number.isFinite(v));}))fail('A broadcast market record is invalid.');
    if(Lg.contest&&(!openMarket(Lg.contest.marketId)||!byId.has(Lg.contest.holder)||!['open','decided'].includes(Lg.contest.status)))fail('The broadcast rights contest is invalid.');
    if(Lg.meeting&&(!byId.has(Lg.meeting.sponsor)||!['scheduled','decided'].includes(Lg.meeting.status)||!isInt(Lg.meeting.callsLeft,0)))fail('The league meeting record is invalid.');
  }
  return errors;
}

// v1 -> v2. The v1 save was the season object itself, with office notes stored as sentences.
function migrateV1(old){
  if(!Array.isArray(old.weeks)||!old.ratings)throw Error('this save has no schedule');
  const seed=newSeed(),rng={seed,state:seed},r=rngFor(rng);
  const rosters=old.rosters??generateRosters(r,old.ratings);
  for(const p of Object.values(rosters).flat())if(p&&p.out===0)delete p.out;
  const office=old.office??{};
  const S={schemaVersion:2,saveId:typeof old.saveId==='string'&&old.saveId?old.saveId:randomId(r),rng,
    club:office.club??null,seasonIndex:0,
    seasons:[{number:1,weeks:old.weeks,completed:old.completed,ratings:old.ratings}],
    rosters,picks:Array.isArray(office.picks)?office.picks:defaultPicks(),offer:null,events:[],nextEventId:1,
    migrations:[{from:1,to:2,at:new Date().toISOString()}]};
  const players=Object.values(rosters).flat();
  const findPlayer=name=>players.find(p=>p.name===name);
  for(const note of Array.isArray(office.notes)?[...office.notes].reverse():[]){
    S.events.push({id:S.nextEventId++,season:1,week:isInt(note?.week,0)?note.week:0,...parseV1Note(String(note?.text??''),findPlayer)});
  }
  const q=office.offer;
  if(q&&byId.has(q.seller)&&typeof q.targetId==='string'){
    const m=String(q.message??'');
    const status=/accepts your proposal/.test(m)?'accepted':/turned down/.test(m)?'countered':/declined/.test(m)?'declined':
      /Select a player/.test(m)?'incomplete':q.firm===false?'needMore':'opening';
    S.offer={seller:q.seller,targetId:q.targetId,outId:q.outId??null,origin:q.origin??null,round:q.round??0,
      week:isInt(q.week,0)?q.week:old.completed,firm:q.firm!==false,status};
    if(q.draftOut!==undefined)S.offer.draftOut=q.draftOut;
    if(q.draftPick!==undefined)S.offer.draftPick=q.draftPick;
  }
  return S;
}
// Turn a v1 staff sentence back into a structured event. Unknown sentences are kept verbatim.
function parseV1Note(text,findPlayer){
  const posPattern=[...positionNames].join('|');
  const person=(name,pos,rating)=>{const p=findPlayer(name);return {id:p?.id??null,name,pos:pos??p?.pos??null,rating:rating??null};};
  const labelled=s=>{const m=new RegExp('^('+posPattern+') (.+)$').exec(s);return m?person(m[2],m[1]):person(s);};
  let m;
  if((m=/^Acquired (.+?) from (.+?) for (.+?)(?: straight up)?\.$/.exec(text))&&byName.has(m[2])){
    let outgoing=null,pick=null,ok=true;
    for(const part of m[3].split(' and ')){
      const pk=/^([A-Z]+) round ([1-7])$/.exec(part);
      if(pk&&byAbbr.has(pk[1])&&!pick)pick={origin:byAbbr.get(pk[1]).id,round:Number(pk[2])};
      else if(!pk&&!outgoing)outgoing=labelled(part);
      else ok=false;
    }
    if(ok)return {type:'trade',seller:byName.get(m[2]),incoming:labelled(m[1]),outgoing,pick};
  }
  if((m=/^(.+) \(([A-Z]+), (\d+)\) is out (\d+) weeks?\. (.+) \((\d+)\) moves into the starting group\.$/.exec(text)))
    return {type:'injury',player:person(m[1],m[2],Number(m[3])),weeks:Number(m[4]),backup:person(m[5],m[2],Number(m[6]))};
  if((m=/^(.+) \(([A-Z]+)\) is cleared to play\./.exec(text)))return {type:'cleared',player:person(m[1],m[2])};
  if(text==='The trade quote expired when the week advanced.')return {type:'quoteExpired',seller:null};
  if((m=/^Ended trade talks with (.+)\.$/.exec(text))&&byName.has(m[1]))return {type:'talksEnded',seller:byName.get(m[1])};
  if(text==='The terms are no longer available.')return {type:'termsGone'};
  return {type:'legacy',text};
}

// Rejects prototype-polluting keys in files from outside the game.
const safeReviver=(key,value)=>{
  if(key==='__proto__'||key==='constructor'||key==='prototype')throw Error('the file contains invalid season data');
  return value;
};
function readSaveFile(source){
  const text=String(source).trim();
  if(text.startsWith('{'))return upgrade(JSON.parse(text,safeReviver)).save;
  const block=source.match(/<script\b[^>]*\bid=["']initialSeason["'][^>]*>([\s\S]*?)<\/script\s*>/i);
  if(!block)throw Error('choose a season file saved with Save a copy, or a cgl-week file from an older build');
  const candidate=JSON.parse(block[1],safeReviver);
  if(!candidate)throw Error('this is the game file, not a season copy. Choose your downloaded cgl-week file');
  return upgrade(candidate).save;
}
// JSON safe to place inside <script>: no "<" can close the element early.
const embeddableJson=value=>JSON.stringify(value).replace(/</g,'\\u003c');

// ---------------------------------------------------------------------------
// Browser storage
// ---------------------------------------------------------------------------
const storage={
  get(k){try{return localStorage.getItem(k);}catch{return null;}},
  set(k,v){try{localStorage.setItem(k,v);return true;}catch{return false;}},
};
const embedded=(()=>{try{return JSON.parse($('#initialSeason').textContent,safeReviver);}catch{return null;}})();
const embeddedVersion=(()=>{try{return embedded?detectVersion(embedded):0;}catch{return 0;}})();
// Each season copy opens in its own slot so two copies never overwrite each other.
const slot=!embedded?'default':embeddedVersion>=2?embedded.saveId+'.s'+cur(embedded)?.number+'w'+cur(embedded)?.completed:(embedded.saveId??'copy')+'.'+embedded.completed;
const storageKey='cgl.save.'+slot;
const legacyKey=embeddedVersion>=2?null:'cgl.regular-season.v1.'+(embedded?.saveId??'default')+(embedded?'.'+embedded.completed:'');
const urlSeed=(()=>{try{const v=Number(new URLSearchParams(location.search).get('seed'));return isInt(v,1,4294967295)?v:undefined;}catch{return undefined;}})();

const LOCAL_OK='Saved in this browser.';
let save,saveMessage='';
function boot(){
  const stored=storage.get(storageKey);
  const raw=stored??(legacyKey?storage.get(legacyKey):null);
  if(raw){
    try{
      const {save:S,from}=upgrade(JSON.parse(raw));
      if(from<SCHEMA_VERSION){
        const backup=storageKey+'.before-v'+SCHEMA_VERSION;
        if(storage.get(backup)===null)storage.set(backup,raw);
        saveMessage='Upgraded this browser save from format v'+from+' to v'+SCHEMA_VERSION+'. The original is kept in browser storage.';
      }else saveMessage=LOCAL_OK;
      return S;
    }catch(error){
      storage.set(storageKey+'.unreadable-'+Date.now(),raw);
      saveMessage='The browser save could not be opened because '+sentence(error.message)+' It was set aside in browser storage. ';
    }
  }
  if(embedded){
    try{return upgrade(embedded).save;}
    catch(error){saveMessage+='The season in this file could not be opened because '+sentence(error.message)+' ';}
  }
  if(saveMessage)saveMessage+='A new season has started.';
  return newSave(urlSeed);
}
function persist(){
  if(!storage.set(storageKey,JSON.stringify(save)))saveMessage='This browser is not keeping saves. Use Save a copy to keep your progress.';
  else if(!saveMessage)saveMessage=LOCAL_OK;
}
function commit(){save.revision=(save.revision??0)+1;saveMessage='';persist();draw();}

// Season files through Claude's downloads capability (Save a copy).

const use=name=>{

const downloadsReady=use('downloads');
downloadsReady.then(d=>{for(const id of ['#copy','#save'])$(id).hidden=!d;});
async function offerFile(filename,data){

// ---------------------------------------------------------------------------
// Standings
// ---------------------------------------------------------------------------
function standings(S){
  const s=cur(S);
  const rows=Object.fromEntries(clubs.map(t=>[t.id,{id:t.id,w:0,l:0,t:0,pf:0,pa:0,dw:0,dl:0,dt:0}]));
  const played=s.weeks.slice(0,s.completed).flat();
  for(const g of played){
    const [h,a]=g.score;
    for(const [id,opp,p,q] of [[g.home,g.away,h,a],[g.away,g.home,a,h]]){
      const r=rows[id],mine=byId.get(id),other=byId.get(opp);
      const result=p>q?'w':p<q?'l':'t';
      r[result]++;r.pf+=p;r.pa+=q;
      if(mine.division===other.division&&mine.conference===other.conference)r['d'+result]++;
    }
  }
  const pct=(w,l,t)=>(w+.5*t)/(w+l+t||1);
  const overall=r=>pct(r.w,r.l,r.t);
  return groups.map(group=>{
    const members=group.map(t=>rows[t.id]);
    for(const r of members){
      const tied=new Set(members.filter(other=>overall(other)===overall(r)).map(t=>t.id));
      const meetings=played.filter(g=>tied.has(g.home)&&tied.has(g.away));
      const mine=meetings.filter(g=>g.home===r.id||g.away===r.id);
      const allMet=[...tied].every(id=>id===r.id||mine.some(g=>g.home===id||g.away===id));
      r.h2h=allMet&&mine.length?mine.reduce((sum,g)=>{const [a,b]=g.score;return sum+(a===b?.5:(a>b)===(g.home===r.id)?1:0);},0)/mine.length:null;
    }
    return members.sort((a,b)=>overall(b)-overall(a)||
      (members.filter(r=>overall(r)===overall(a)).every(r=>r.h2h!==null)?b.h2h-a.h2h:0)||
      pct(b.dw,b.dl,b.dt)-pct(a.dw,a.dl,a.dt)||(b.pf-b.pa)-(a.pf-a.pa)||teamName(a.id).localeCompare(teamName(b.id)));
  });
}

function negotiationView(S){
  const q=S.offer,ours=S.rosters[S.club];
  const target=S.rosters[q.seller].find(p=>p.id===q.targetId),out=ours.find(p=>p.id===q.outId);
  if(!target)return '<p>'+esc(teamName(q.seller))+' no longer has that player.</p><button id="decline">End talks</button>';
  const options=ours.filter(p=>!p.out).sort((a,b)=>b.rating-a.rating);
  const draftOut=q.draftOut==='none'?null:options.find(p=>p.id===q.draftOut)??out;
  const picks=ownedPicks(S),quoted=picks.find(p=>p.origin===q.origin&&p.round===q.round);
  const key=q.draftPick??pickKey(quoted),proposed=picks.find(p=>pickKey(p)===key);
  const needed=termsNeeded(target,draftOut);
  const fair=[7,6,5,4,3,2,1].find(round=>pickValues[round]>=needed);
  const value=proposed?pickValues[proposed.round]:0;
  let advice=sellerShort(S,q.seller,target,draftOut)?'They will not move their last healthy '+target.pos+' unless one comes back. ':
    value-needed>=20?'That pick is an overpay. ':value<needed?'Expect them to ask for more. ':'That price is defensible. ';
  if(buyerShort(S,target,draftOut))advice+='That would leave us without a healthy '+draftOut.pos+'. ';
  let estimate=needed===0?'I would try a straight swap.':fair?'I value the gap at a round '+fair+' pick'+(draftOut?' with '+draftOut.name:' alone')+'.':'We probably need a stronger player in the deal.';
  if(sellerShort(S,q.seller,target,draftOut)){
    const swap=options.filter(p=>p.pos===target.pos).sort((a,b)=>a.rating-b.rating)[0];
    const gap=swap&&termsNeeded(target,swap),round=swap&&[7,6,5,4,3,2,1].find(rd=>pickValues[rd]>=gap);
    estimate=!swap?'We have no healthy '+target.pos+' to send back.':gap===0?'Sending '+swap.name+' straight up should do it.':round?'If we send '+swap.name+', I value the gap at a round '+round+' pick.':'Even with '+swap.name+' going back, our picks cannot cover the gap.';
  }
  const row=(label,p)=>!p?'<tr><th>'+label+'</th><td colspan="4">No player</td></tr>':'<tr><th>'+label+'</th><td>'+esc(p.name)+'</td><td>'+esc(p.pos)+'</td><td>'+p.age+'</td><td>'+p.rating+'</td></tr>';
  const deal=[out?.name,quoted&&pickLabel(quoted)].filter(Boolean).join(' and ');
  return '<p>'+esc(offerMessage(S,q))+'</p>'+
    '<div class="wide"><table><thead><tr><th>Player comparison</th><th>Name</th><th>Pos.</th><th>Age</th><th>Rating</th></tr></thead><tbody>'+row('Their player',target)+row('Your proposed return',draftOut)+'</tbody></table></div>'+
    '<div class="controls"><label>Send player <select id="tradePlayer">'+option('none','No player',!draftOut)+options.map(p=>option(p.id,p.name+' · '+p.pos+' · '+p.rating,p.id===draftOut?.id)).join('')+'</select></label>'+
    '<label>Add pick <select id="tradePick">'+option('none','No pick',key==='none')+picks.map(p=>option(pickKey(p),pickLabel(p),key===pickKey(p))).join('')+'</select></label>'+
    '<button id="counter">Send proposal</button></div>'+
    '<p><b>Your GM</b> · '+esc(advice+estimate)+'</p>'+
    (q.firm!==false?'<p><b>Available deal</b> · '+esc('Receive '+target.name+' for '+deal+'. Expires upon advancing.')+'</p><button id="accept" '+(draftOut?.id!==out?.id||key!==pickKey(quoted)?'disabled':'')+'>Authorize this deal</button> ':'')+
    '<button id="decline">End talks</button>';
}

  if(leagueUi.bid&&e.target.id==='bidYears'){leagueUi.bid.years=Number(e.target.value);return;}
  if(e.target.id==='bidLobby'){leagueUi.lobby=e.target.checked;return;}
  if(financeUi.mandate&&['nameMin','nameYears','nameAuthority'].includes(e.target.id)){
    const m=financeUi.mandate;
    if(e.target.id==='nameMin')m.minAnnual=Number(e.target.value);
    if(e.target.id==='nameYears')m.maxYears=Number(e.target.value);
    if(e.target.id==='nameAuthority')m.authority=e.target.value;
    return;
  }
  if(financeUi.mandate&&e.target.id?.startsWith('excl-')){
    const c=e.target.id.slice(5),m=financeUi.mandate;
    m.exclude=e.target.checked?[...new Set([...m.exclude,c])]:m.exclude.filter(x=>x!==c);
    return;
  }
  if(e.target.id==='compareA')stadiumUi.a=e.target.value;
  if(e.target.id==='compareB')stadiumUi.b=e.target.value;
  if(e.target.id==='claimTeam'||e.target.id==='target')return;
  if(e.target.id==='scout')scoutPos=e.target.value;
  if(e.target.id==='week')viewed=Number(e.target.value);
  if(e.target.id==='team')selected=e.target.value;
  draw();
};
const filePicker=$('#seasonFile');
$('#loadSeason').onclick=()=>filePicker.click();
filePicker.onchange=async()=>{
  const file=filePicker.files[0];if(!file)return;
  try{
    const incoming=readSaveFile(await file.text());
    if(save.club){pendingImport=incoming;saveMessage='';draw();}
    else applyImport(incoming);
  }catch(error){
    saveMessage='Could not load save: '+sentence(error.message);draw();
  }finally{filePicker.value='';}
};
function applyImport(S){save=S;pendingImport=null;resetView();commit();}
$('#copy').onclick=()=>offerFile('cgl-season-'+cur().number+'-'+shortLabel(cur().tick).toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.json',JSON.stringify(save));

// Keep the open tab and selections when a new version of the page arrives.
function start(data){
  if(data&&typeof data==='object'){
    if(TABS.includes(data.tab))tab=data.tab;
    if(isInt(data.viewed,1,22))viewed=data.viewed;
    if(byId.has(data.selected))selected=data.selected;
    if(positionNames.has(data.scoutPos))scoutPos=data.scoutPos;
    if(data.stadiumUi&&typeof data.stadiumUi==='object'){
      for(const k of ['a','b'])if(typeof data.stadiumUi[k]==='string')stadiumUi[k]=data.stadiumUi[k];
      for(const k of Object.keys(stadiumUi.plan))if(typeof data.stadiumUi.plan?.[k]==='string')stadiumUi.plan[k]=data.stadiumUi.plan[k];
    }
  }
  draw();
}
const hot=window.claude?.hot;
try{hot?.snapshot?.(()=>({tab,viewed,selected,scoutPos,stadiumUi}));}catch{}
try{hot?.ready?hot.ready(start):start(hot?.data??{});}catch{start({});}
</script>
